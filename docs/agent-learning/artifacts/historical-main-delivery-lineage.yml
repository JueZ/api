version: 1
id: historical-main-delivery-lineage
title: Bind historical Main Delivery evidence to its immutable trigger lineage
fingerprint: agent-learning.historical-evidence.latest-terminal-state
source:
  type: autonomous_review
  references:
    - kind: issue
      locator: JueZ/api#359
      url: https://github.com/JueZ/api/issues/359
    - kind: pull_request
