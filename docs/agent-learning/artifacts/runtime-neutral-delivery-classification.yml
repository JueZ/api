classification:
  failureArea: post-merge-delivery-efficiency
  severity: medium
  symptom: Runtime-neutral merges either rebuilt and redeployed unchanged application code or fell back to that full path when the classifier could not start.
  rootCause: The original controller lacked authenticated deployment-impact classification; its first implementation then imported an external policy-parser dependency that was unavailable in the dependency-free trusted delivery checkout.
disposition:
  primary: regression-test
  rationale: Protected-main code validates the exact runtime-neutral allowlist, authenticates and counts the complete paginated PR file list, considers both sides of renames, and now proves the classifier executes without installed packages while ambiguous or deployment-impacting changes still fail closed to full delivery.
artifacts:
  - path: scripts/lib/deployment-impact.mjs
    kind: implementation
  - path: scripts/lib/autonomous-policy.mjs
    kind: implementation
  - path: scripts/classify-deployment-impact.mjs
    kind: implementation
  - path: scripts/test/deployment-impact.test.mjs
    kind: regression-test
  - path: scripts/test/autonomous-policy.test.mjs
    kind: regression-test
  - path: .github/workflows/codex-main-delivery.yml
    kind: workflow
  - path: .github/autonomous-policy.yml
    kind: policy
counterfactual:
  hypothesis: The classifier starts in the trusted dependency-free delivery checkout and lets allowlisted changes reuse validation and skip environment deployment, while mixed, malformed, traversing, incomplete, renamed-from-code, or deployment-impacting changes still require the full path.
status: implemented
