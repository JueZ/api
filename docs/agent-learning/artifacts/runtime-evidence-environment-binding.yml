classification:
  failureArea: agent-learning-evidence
  severity: high
  symptom: Live health evidence could be queried without independently proving that test and production were different intended environments.
  rootCause: The verifier first trusted the release ledger for the runtime origin, then overclaimed a deployment status URL as immutable job provenance, and did not verify the downloaded run artifact bytes against GitHub's authenticated digest before using their origin.
disposition:
  primary: regression-test
  rationale: Deterministic tests reject aliased environments, require successful ledger-publication steps and exact-run artifact identity/digest, and distinguish REST source-head evidence from separately authenticated PR base/head identity; the live verifier hashes the downloaded archive before using its origin.
artifacts:
  - path: scripts/agent-learning/verify-program-evidence.mjs
    kind: implementation
  - path: scripts/test/agent-learning-artifacts.test.mjs
    kind: regression-test
  - path: .github/workflows/ci.yml
    kind: workflow
counterfactual:
  hypothesis: The rejected verifier accepts aliased, status-URL-only, or metadata-only evidence, while the repaired verifier requires distinct digest-bound ledger origins, a successful exact-run job and publication steps, exact artifact bytes, and separate pull-request-target source/base bindings.
  broken:
    commit: b928577c9a88218dcdacc7293f6264196837a80e
    expectedResult: The provenance regressions fail because distinct attested origins, exact-run job/artifact digest binding, and explicit pull-request-target source/base semantics are not required.
  verification:
    commands:
      - node --test scripts/test/agent-learning-artifacts.test.mjs
      - node scripts/agent-learning/verify-artifacts.mjs --github
status: implemented
