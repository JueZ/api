name: Deploy Environment

on:
  workflow_call:
    inputs:
      environmentName:
        description: Bicep environment name. Use test or prod.
        required: true
        type: string
      azureResourceGroup:
        description: Azure resource group to deploy into.
        required: true
        type: string
      githubEnvironment:
        description: GitHub Environment name used for deployment history and approvals.
        required: true
        type: string
      deployFrontend:
        description: Deploy Angular static files when present.
        required: false
        default: true
        type: boolean
      deployFunctions:
        description: Deploy Azure Functions package when present.
        required: false
        default: true
        type: boolean
      sourceRef:
        description: Immutable 40-character commit SHA from main to deploy.
        required: false
        default: ''
        type: string
      controllerRef:
        description: Immutable caller run head SHA containing the deployment workflow generation.
        required: true
        type: string
      controllerWorkflowSha:
        description: Immutable caller workflow definition SHA; must equal controllerRef.
        required: true
        type: string
      updateProductionVariables:
        description: Report resolved production values after successful smoke tests.
        required: false
        default: false
        type: boolean
      redditShareUrlSmokeEnabled:
        description: Run the optional authenticated Reddit share URL smoke against the configured /s/ URL.
        required: false
        default: false
        type: boolean
      allowRollback:
        description: Permit a non-monotonic production source only from the dedicated rollback workflow.
        required: false
        default: false
        type: boolean
      preparePrivateStorageOnly:
        description: Provision and migrate only the bounded production private-storage boundary.
        required: false
        default: false
        type: boolean
      migrationSourceStorageAccount:
        description: Existing production account containing the approved WLH reference blob.
        required: false
        default: ''
        type: string
      migrationTargetStorageAccount:
        description: Expected production private-storage account resolved by shared Bicep.
        required: false
        default: ''
        type: string
      migrationExpectedSha256:
        description: Independently verified SHA-256 digest of the one approved WLH reference blob.
        required: false
        default: ''
        type: string
      migrationConfirmation:
        description: Exact one-time production private-storage preparation confirmation.
        required: false
        default: ''
        type: string
      deliveryCorrelation:
        description: Unique value binding this deployment to one workflow dispatch and release ledger.
        required: true
        type: string
      ciRunId:
        description: Exact first-attempt successful main CI run that produced the immutable release bundle.
        required: false
        default: ''
        type: string
      ciDeliveryCorrelation:
        description: Correlation embedded in the exact main CI run title.
        required: false
        default: ''
        type: string
      testDeliveryCorrelation:
        description: Correlation from the exact successful Deploy Test run promoted to production.
        required: false
        default: ''
        type: string
      testDeliveryRunId:
        description: Exact successful Deploy Test workflow run promoted to production.
        required: false
        default: ''
        type: string
      rollbackReleaseRunId:
        description: Exact prior successful Promote Production run containing the accepted rollback ledger.
        required: false
        default: ''
        type: string
      rollbackReleaseCorrelation:
        description: Correlation from the accepted prior production release ledger.
        required: false
        default: ''
        type: string
    secrets:
      REDDIT_CLIENT_SECRET:
        description: Reddit OAuth client secret for app-only API access.
        required: true
      OPENAI_API_KEY:
        description: Optional OpenAI API key for Repairable Error Contract LLM-assisted diagnostics.
        required: false
      WLH_BASE_URL:
        description: WLH upstream base URL.
        required: true
      BRING_EMAIL:
        description: Bring! technical account email.
        required: true
      BRING_PASSWORD:
        description: Bring! technical account password.
        required: true
      BRING_CLIENT_API_KEY:
        description: Unofficial Bring client API key.
        required: true
      BRING_CONFIRMATION_HMAC_KEY:
        description: Bring confirmation/pseudonym HMAC key.
        required: true
      BRING_MUTATION_ENCRYPTION_KEY:
        description: Bring prepared-mutation encryption key.
        required: true
    outputs:
      effectiveBaseUrl:
        description: Resolved Function App base URL.
        value: ${{ jobs.deploy.outputs.effectiveBaseUrl }}
      functionAppName:
        description: Resolved Azure Function App name.
        value: ${{ jobs.deploy.outputs.functionAppName }}
      storageAccountName:
        description: Resolved static-web Azure Storage account name.
        value: ${{ jobs.deploy.outputs.storageAccountName }}
      releaseStorageAccountName:
        description: Resolved immutable-release Azure Storage account name.
        value: ${{ jobs.deploy.outputs.releaseStorageAccountName }}

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

jobs:
  deploy:
    if: ${{ !inputs.preparePrivateStorageOnly }}
    name: deploy ${{ inputs.environmentName }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.githubEnvironment }}
      url: ${{ steps.resolve.outputs.effective_base_url }}
    outputs:
      effectiveBaseUrl: ${{ steps.resolve.outputs.effective_base_url }}
      functionAppName: ${{ steps.resolve.outputs.function_app_name }}
      storageAccountName: ${{ steps.resolve.outputs.storage_account_name }}
      releaseStorageAccountName: ${{ steps.resolve.outputs.release_storage_account_name }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
      AZURE_RESOURCE_GROUP: ${{ inputs.azureResourceGroup }}
      ENVIRONMENT_NAME: ${{ inputs.environmentName }}
      DEPLOY_FRONTEND: ${{ inputs.deployFrontend }}
      DEPLOY_FUNCTIONS: ${{ inputs.deployFunctions }}
      SOURCE_REF: ${{ inputs.sourceRef }}
      CONTROLLER_REF: ${{ inputs.controllerRef }}
      CONTROLLER_WORKFLOW_SHA: ${{ inputs.controllerWorkflowSha }}
      DELIVERY_CORRELATION: ${{ inputs.deliveryCorrelation }}
      CI_RUN_ID: ${{ inputs.ciRunId }}
      CI_DELIVERY_CORRELATION: ${{ inputs.ciDeliveryCorrelation }}
      TEST_DELIVERY_CORRELATION: ${{ inputs.testDeliveryCorrelation }}
      TEST_DELIVERY_RUN_ID: ${{ inputs.testDeliveryRunId }}
      ROLLBACK_RELEASE_RUN_ID: ${{ inputs.rollbackReleaseRunId }}
      ROLLBACK_RELEASE_CORRELATION: ${{ inputs.rollbackReleaseCorrelation }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_STATIC_WEB_STORAGE_ACCOUNT: ${{ vars.AZURE_STATIC_WEB_STORAGE_ACCOUNT }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      DEPLOY_PRODUCTION_ENABLED: ${{ vars.DEPLOY_PRODUCTION_ENABLED }}
      AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      OIDC_JWKS_URI: ${{ vars.OIDC_JWKS_URI }}
      OIDC_REQUIRED_SCOPES: ${{ vars.OIDC_REQUIRED_SCOPES }}
      OIDC_ALLOWED_OBJECT_IDS: ${{ vars.OIDC_ALLOWED_OBJECT_IDS }}
      OIDC_ALLOWED_SUBJECTS: ${{ vars.OIDC_ALLOWED_SUBJECTS }}
      OIDC_ALLOWED_APP_OBJECT_IDS: ${{ vars.OIDC_ALLOWED_APP_OBJECT_IDS }}
      OIDC_ALLOWED_CLIENT_IDS: ${{ vars.OIDC_ALLOWED_CLIENT_IDS }}
      OIDC_ALLOWED_DELEGATED_CLIENT_IDS: ${{ vars.OIDC_ALLOWED_DELEGATED_CLIENT_IDS }}
      OIDC_ALLOWED_TENANTS: ${{ vars.OIDC_ALLOWED_TENANTS }}
      AUTH_DEBUG: ${{ vars.AUTH_DEBUG }}
      MCP_RESOURCE_ORIGIN: ${{ vars.MCP_RESOURCE_ORIGIN }}
      MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS }}
      OPERATOR_ALERT_EMAIL: ${{ vars.OPERATOR_ALERT_EMAIL }}
      WEB_AUTH_ENABLED: ${{ vars.WEB_AUTH_ENABLED }}
      WEB_AUTH_CLIENT_ID: ${{ vars.WEB_AUTH_CLIENT_ID }}
      WEB_AUTH_AUTHORITY: ${{ vars.WEB_AUTH_AUTHORITY }}
      WEB_AUTH_REDIRECT_URI: ${{ vars.WEB_AUTH_REDIRECT_URI }}
      TEST_WEB_AUTH_REDIRECT_URI: ${{ vars.TEST_WEB_AUTH_REDIRECT_URI }}
      WEB_AUTH_API_SCOPE: ${{ vars.WEB_AUTH_API_SCOPE }}
      WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ vars.TEST_WEB_API_BASE_URL }}
      REDDIT_CLIENT_ID: ${{ vars.REDDIT_CLIENT_ID }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      REPAIRABLE_ERRORS_LLM_ENABLED: ${{ vars.REPAIRABLE_ERRORS_LLM_ENABLED }}
      REPAIRABLE_ERRORS_LLM_MODEL: ${{ vars.REPAIRABLE_ERRORS_LLM_MODEL }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      WLH_CATEGORY_VERSION: ${{ vars.WLH_CATEGORY_VERSION }}
      WLH_CATEGORY_BLOB_NAME: ${{ vars.WLH_CATEGORY_BLOB_NAME }}
      WLH_CATEGORY_BLOB_CONTAINER: ${{ vars.WLH_CATEGORY_BLOB_CONTAINER }}
      BRING_BASE_URL: ${{ vars.BRING_BASE_URL }}
      BRING_COUNTRY: ${{ vars.BRING_COUNTRY }}
      BRING_ENABLED: ${{ vars.BRING_ENABLED }}
      BRING_ADD_ENABLED: ${{ vars.BRING_ADD_ENABLED }}
      BRING_DESTRUCTIVE_ENABLED: ${{ vars.BRING_DESTRUCTIVE_ENABLED }}
      BRING_EXPECTED_ACCOUNT_FINGERPRINT: ${{ vars.BRING_EXPECTED_ACCOUNT_FINGERPRINT }}
      BRING_DEFAULT_LIST_UUID: ${{ vars.BRING_DEFAULT_LIST_UUID }}
      BRING_READABLE_LIST_UUIDS: ${{ vars.BRING_READABLE_LIST_UUIDS }}
      BRING_WRITABLE_LIST_UUIDS: ${{ vars.BRING_WRITABLE_LIST_UUIDS }}
      BRING_SESSION_CACHE_ENABLED: ${{ vars.BRING_SESSION_CACHE_ENABLED }}
      BRING_SESSION_CACHE_CONTAINER: ${{ vars.BRING_SESSION_CACHE_CONTAINER }}
      BRING_SESSION_CACHE_BLOB: ${{ vars.BRING_SESSION_CACHE_BLOB }}
      BRING_MUTATION_CONTAINER: ${{ vars.BRING_MUTATION_CONTAINER }}
      BRING_AUDIT_CONTAINER: ${{ vars.BRING_AUDIT_CONTAINER }}
      DEPLOYED_AT_UTC: ${{ github.event.head_commit.timestamp || '' }}
      DEPLOYMENT_RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      ROLLBACK_REQUESTED: ${{ inputs.allowRollback }}
      ALLOW_ROLLBACK: >-
        ${{
          inputs.allowRollback &&
          github.workflow_ref == format('{0}/.github/workflows/rollback-production.yml@refs/heads/main', github.repository) &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch'
        }}
      APPLICATIONINSIGHTS_NAME: ${{ vars.APPLICATIONINSIGHTS_NAME }}
      TEST_SERVICE_AUTH_CLIENT_ID: ${{ vars.TEST_SERVICE_AUTH_CLIENT_ID }}
      TEST_SERVICE_AUTH_TENANT_ID: ${{ vars.TEST_SERVICE_AUTH_TENANT_ID }}
      TEST_SERVICE_AUTH_SCOPE: ${{ vars.TEST_SERVICE_AUTH_SCOPE }}
      PROD_SERVICE_AUTH_CLIENT_ID: ${{ vars.PROD_SERVICE_AUTH_CLIENT_ID }}
      PROD_SERVICE_AUTH_TENANT_ID: ${{ vars.PROD_SERVICE_AUTH_TENANT_ID }}
      PROD_SERVICE_AUTH_SCOPE: ${{ vars.PROD_SERVICE_AUTH_SCOPE }}
    steps:
      - name: Checkout current deployment controller
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(pwd -P)" != "$(realpath "$GITHUB_WORKSPACE")" ] ||
             [ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "Deployment controller checkout requires the exact empty GitHub workspace." >&2
            exit 1
          fi

          git init .
          git remote add origin https://github.com/JueZ/api.git
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout --detach refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          if [ -n "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)" ] ||
             [ -n "$(git clean -ndx)" ]; then
            echo "Deployment controller workspace contains content outside the exact commit." >&2
            exit 1
          fi
      - name: Validate deployment source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_ref="${SOURCE_REF:-${GITHUB_SHA}}"
          # CONTROLLER_REF is assigned through the workflow job environment.
          # shellcheck disable=SC2153
          controller_ref="$CONTROLLER_REF"
          checked_out_controller="$(git rev-parse HEAD)"

          if [[ ! "$deployment_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "sourceRef must be a full 40-character commit SHA from the main branch." >&2
            exit 1
          fi
          if [[ ! "$controller_ref" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$CONTROLLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$GITHUB_RUN_ATTEMPT" != "1" ] ||
             [ "$controller_ref" != "$CONTROLLER_WORKFLOW_SHA" ] ||
             [ "$controller_ref" != "$GITHUB_SHA" ] ||
             [ "$controller_ref" != "$checked_out_controller" ]; then
            echo "Deployment controller must equal the immutable caller run, workflow, and checkout SHA." >&2
            exit 1
          fi
          current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          if [ "$ENVIRONMENT_NAME" = "test" ]; then
            expected_caller_path=".github/workflows/deploy-test.yml"
            expected_caller_name="Deploy Test"
          elif [ "$ROLLBACK_REQUESTED" = "true" ]; then
            expected_caller_path=".github/workflows/rollback-production.yml"
            expected_caller_name="Rollback Production"
          else
            expected_caller_path=".github/workflows/promote-production.yml"
            expected_caller_name="Promote Production"
          fi
          expected_caller_title="$expected_caller_name $deployment_ref $DELIVERY_CORRELATION"
          # GitHub has exposed either the static workflow name or resolved
          # run-name in .name; path and display_title remain exact identity gates.
          if ! jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg controller_ref "$controller_ref" \
            --arg path "$expected_caller_path" \
            --arg workflow_name "$expected_caller_name" \
            --arg title "$expected_caller_title" \
            '(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .head_sha == $controller_ref
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .path == $path
              and (.name == $workflow_name or .name == $title)
              and .display_title == $title
              and .run_attempt == 1
              and (.status == "queued" or .status == "in_progress")' \
            <<<"$current_run_json" >/dev/null; then
            echo "Current deployment run identity does not match its immutable caller workflow generation." >&2
            exit 1
          fi
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse origin/main)"
          if [ "$controller_ref" != "$current_main" ]; then
            echo "The immutable deployment controller is no longer current main; redispatch from the new main." >&2
            exit 1
          fi
          echo "DEPLOYMENT_CONTROL_REF=$controller_ref" >> "$GITHUB_ENV"
          if ! git merge-base --is-ancestor "$deployment_ref" origin/main; then
            echo "sourceRef must point to a commit already present in the main branch history." >&2
            exit 1
          fi

          if [ "$ROLLBACK_REQUESTED" = "true" ]; then
            if [ "$ALLOW_ROLLBACK" != "true" ] || [ "$ENVIRONMENT_NAME" != "prod" ]; then
              echo "Rollback is permitted only from rollback-production.yml on main for production." >&2
              exit 1
            fi
            if [ "${deployment_ref,,}" = "$controller_ref" ]; then
              echo "Rollback sourceRef must be an older main ancestor, not current main." >&2
              exit 1
            fi
          elif [ "${deployment_ref,,}" != "$controller_ref" ]; then
            echo "Normal deployment sourceRef must equal the current main controller commit." >&2
            exit 1
          fi

          if [ "$ROLLBACK_REQUESTED" != "true" ]; then
            if ! [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] ||
               ! [[ "$CI_DELIVERY_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]; then
              echo "Normal deployment requires one exact main CI run ID and correlation." >&2
              exit 1
            fi
            ci_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
            expected_ci_title="CI $deployment_ref $CI_DELIVERY_CORRELATION"
            if ! jq -e \
              --arg run_id "$CI_RUN_ID" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg source_ref "$deployment_ref" \
              --arg workflow_name "CI" \
              --arg title "$expected_ci_title" \
              '(.id | tostring) == $run_id
                and .repository.full_name == $repository
                and .path == ".github/workflows/ci.yml"
                and (.name == $workflow_name or .name == $title)
                and (.event == "push" or .event == "workflow_dispatch")
                and .conclusion == "success"
                and .head_branch == "main"
                and .head_sha == $source_ref
                and .display_title == $title
                and .run_attempt == 1' \
              <<<"$ci_run_json" >/dev/null; then
              echo "Pinned CI run does not match the exact first-attempt main release authorization." >&2
              exit 1
            fi
            echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

          if [ "$ENVIRONMENT_NAME" = "prod" ] &&
             { [ "$DEPLOY_FRONTEND" != "true" ] || [ "$DEPLOY_FUNCTIONS" != "true" ]; }; then
            echo "Production promotion and rollback require both Function and frontend packages." >&2
            exit 1
          fi

          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            if [ "$ALLOW_ROLLBACK" != "true" ]; then
              : "${PRODUCTION_BASE_URL:?PRODUCTION_BASE_URL is required for monotonic production validation}"
              current_health="$(curl --fail --show-error --silent --max-time 20 "${PRODUCTION_BASE_URL%/}/health")"
              current_source_ref="$(jq -r '.deployedSourceRef // .deployedCommitSha // ""' <<<"$current_health")"
              if ! [[ "$current_source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "Current production health did not report an immutable source SHA." >&2
                exit 1
              fi
              if [ "${current_source_ref,,}" != "${deployment_ref,,}" ] &&
                 ! git merge-base --is-ancestor "$current_source_ref" "$deployment_ref"; then
                echo "Refusing non-monotonic production deployment from $current_source_ref to $deployment_ref. Use rollback-production.yml for an intentional rollback." >&2
                exit 1
              fi
            fi

            if [ "$ALLOW_ROLLBACK" = "true" ]; then
              if ! [[ "$ROLLBACK_RELEASE_RUN_ID" =~ ^[0-9]+$ ]] ||
                 ! [[ "$ROLLBACK_RELEASE_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]; then
                echo "Rollback requires an exact prior production run ID and delivery correlation." >&2
                exit 1
              fi
              rollback_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ROLLBACK_RELEASE_RUN_ID}")"
              expected_rollback_title="Promote Production $deployment_ref $ROLLBACK_RELEASE_CORRELATION"
              if ! jq -e \
                --arg source_ref "$deployment_ref" \
                --arg run_id "$ROLLBACK_RELEASE_RUN_ID" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg workflow_name "Promote Production" \
                --arg title "$expected_rollback_title" \
                '(.id | tostring) == $run_id
                  and .repository.full_name == $repository
                  and .path == ".github/workflows/promote-production.yml"
                  and (.name == $workflow_name or .name == $title)
                  and .event == "workflow_dispatch"
                  and .conclusion == "success"
                  and .head_branch == "main"
                  and .head_sha == $source_ref
                  and .display_title == $title
                  and .run_attempt == 1' \
                <<<"$rollback_run_json" >/dev/null; then
                echo "Rollback release run identity does not match the requested historical source and correlation." >&2
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/rollback-ledger"
              if find "$RUNNER_TEMP/rollback-ledger" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                echo "Rollback ledger extraction directory must be empty before download." >&2
                exit 1
              fi
              gh run download "$ROLLBACK_RELEASE_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "release-ledger-prod-${deployment_ref}-${ROLLBACK_RELEASE_CORRELATION}" \
                --dir "$RUNNER_TEMP/rollback-ledger"
              rollback_ledger="$RUNNER_TEMP/rollback-ledger/release-ledger-prod.json"
              EXPECTED_DELIVERY_CORRELATION="$ROLLBACK_RELEASE_CORRELATION" \
                node scripts/validate-release-ledger.mjs "$rollback_ledger"
              if ! jq -e \
                --arg source_ref "$deployment_ref" \
                --arg run_id "$ROLLBACK_RELEASE_RUN_ID" \
                --arg correlation "$ROLLBACK_RELEASE_CORRELATION" \
                '.environment == "prod"
                  and .sourceRef == $source_ref
                  and .deployedCommit == $source_ref
                  and .workflowRunId == $run_id
                  and .deliveryCorrelation == $correlation
                  and (.artifacts.functionappSha256 | test("^[0-9a-f]{64}$"))
                  and (.artifacts.frontendSha256 | test("^[0-9a-f]{64}$"))
                  and (.artifacts.sbomSha256 | test("^[0-9a-f]{64}$"))
                  and .smokeResults.status == "passed"
                  and .authenticatedSmokeResults.status == "passed"
                  and .telemetryCheckResult.status == "passed"' \
                "$rollback_ledger" >/dev/null; then
                echo "Historical production ledger is missing exact successful release evidence." >&2
                exit 1
              fi
              {
                echo "approved_function_digest=$(jq -r '.artifacts.functionappSha256' "$rollback_ledger")"
                echo "approved_frontend_digest=$(jq -r '.artifacts.frontendSha256' "$rollback_ledger")"
                echo "approved_sbom_digest=$(jq -r '.artifacts.sbomSha256' "$rollback_ledger")"
              } >> "$GITHUB_OUTPUT"
              echo "Validated exact historical production ledger from run $ROLLBACK_RELEASE_RUN_ID."
            else
              if ! [[ "$TEST_DELIVERY_RUN_ID" =~ ^[0-9]+$ ]] ||
                 ! [[ "$TEST_DELIVERY_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]; then
                echo "Production promotion requires the exact Deploy Test run ID and delivery correlation." >&2
                exit 1
              fi
              test_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_DELIVERY_RUN_ID}")"
              expected_test_title="Deploy Test $deployment_ref $TEST_DELIVERY_CORRELATION"
              if ! jq -e \
                --arg source_ref "$deployment_ref" \
                --arg run_id "$TEST_DELIVERY_RUN_ID" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg workflow_name "Deploy Test" \
                --arg title "$expected_test_title" \
                '(.id | tostring) == $run_id
                  and .repository.full_name == $repository
                  and .path == ".github/workflows/deploy-test.yml"
                  and (.name == $workflow_name or .name == $title)
                  and .event == "workflow_dispatch"
                  and .conclusion == "success"
                  and .head_branch == "main"
                  and .head_sha == $source_ref
                  and .display_title == $title
                  and .run_attempt == 1' \
                <<<"$test_run_json" >/dev/null; then
                echo "Deploy Test run identity does not match the exact source and correlation being promoted." >&2
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/deploy-test-provenance"
              if find "$RUNNER_TEMP/deploy-test-provenance" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                echo "Deploy Test provenance extraction directory must be empty before download." >&2
                exit 1
              fi
              gh run download "$TEST_DELIVERY_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "deploy-test-provenance-${deployment_ref}-${TEST_DELIVERY_CORRELATION}" \
                --dir "$RUNNER_TEMP/deploy-test-provenance"
              provenance_file="$RUNNER_TEMP/deploy-test-provenance/deploy-test-provenance.json"
              if ! jq -e \
                --arg source_ref "$deployment_ref" \
                --arg test_run_id "$TEST_DELIVERY_RUN_ID" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg correlation "$TEST_DELIVERY_CORRELATION" \
                --arg ci_run_id "$CI_RUN_ID" \
                --arg ci_correlation "$CI_DELIVERY_CORRELATION" \
                '.environmentName == "test"
                  and .sourceRef == $source_ref
                  and .resolvedHead == $source_ref
                  and .runId == $test_run_id
                  and .workflow == "Deploy Test"
                  and .repository == $repository
                  and .deliveryCorrelation == $correlation
                  and .ciRunId == $ci_run_id
                  and .ciDeliveryCorrelation == $ci_correlation
                  and .runAttempt == "1"
                  and .deployFrontend == "true"
                  and .deployFunctions == "true"
                  and .eventName == "workflow_dispatch"
                  and (.artifacts.functionappSha256 | test("^[0-9a-f]{64}$"))
                  and (.artifacts.sourceFrontendSha256 | test("^[0-9a-f]{64}$"))
                  and (.artifacts.frontendSha256 | test("^[0-9a-f]{64}$"))
                  and (.artifacts.sbomSha256 | test("^[0-9a-f]{64}$"))
                  and .authenticatedSmokeStatus == "passed"
                  and .telemetryStatus == "passed"' \
                "$provenance_file" >/dev/null; then
                echo "Production sourceRef must match the exact pinned successful Deploy Test provenance." >&2
                exit 1
              fi
              {
                echo "approved_function_digest=$(jq -r '.artifacts.functionappSha256' "$provenance_file")"
                echo "approved_frontend_digest=$(jq -r '.artifacts.sourceFrontendSha256' "$provenance_file")"
                echo "approved_sbom_digest=$(jq -r '.artifacts.sbomSha256' "$provenance_file")"
              } >> "$GITHUB_OUTPUT"
              echo "Validated exact Deploy Test provenance from run $TEST_DELIVERY_RUN_ID."
            fi
          fi
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID repository variable is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID repository variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID repository variable is required}"
          : "${AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID:?AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID environment variable is required}"
          : "${AZURE_RESOURCE_GROUP:?azureResourceGroup input is required}"
          case "$ENVIRONMENT_NAME" in
            test|prod) ;;
            *) echo "environmentName must be test or prod." >&2; exit 1 ;;
          esac
          if [[ ! "$DELIVERY_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]; then
            echo "deliveryCorrelation must be an opaque 8-128 character identifier." >&2
            exit 1
          fi
          if [ "$ENVIRONMENT_NAME" = "prod" ] && [ "${DEPLOY_PRODUCTION_ENABLED:-false}" != "true" ]; then
            echo "DEPLOY_PRODUCTION_ENABLED must be true for production deployment." >&2
            exit 1
          fi
          : "${AUTH_ENABLED:?AUTH_ENABLED repository variable is required for $ENVIRONMENT_NAME}"
          if [ "$AUTH_ENABLED" != "true" ]; then
            echo "AUTH_ENABLED must be true for $ENVIRONMENT_NAME deployment after the auth milestone." >&2
            exit 1
          fi
          : "${OIDC_ISSUER:?OIDC_ISSUER repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_AUDIENCE:?OIDC_AUDIENCE repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_REQUIRED_SCOPES:?OIDC_REQUIRED_SCOPES repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_ALLOWED_OBJECT_IDS:?OIDC_ALLOWED_OBJECT_IDS repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_ALLOWED_TENANTS:?OIDC_ALLOWED_TENANTS repository variable is required for $ENVIRONMENT_NAME}"
          : "${MCP_RESOURCE_ORIGIN:?MCP_RESOURCE_ORIGIN environment variable is required for $ENVIRONMENT_NAME}"
          : "${MCP_ALLOWED_ORIGINS:?MCP_ALLOWED_ORIGINS environment variable is required for $ENVIRONMENT_NAME}"
          : "${OPERATOR_ALERT_EMAIL:?OPERATOR_ALERT_EMAIL environment variable is required for $ENVIRONMENT_NAME}"
          if ! node --input-type=module --eval '
            const resourceOrigin = process.env.MCP_RESOURCE_ORIGIN;
            const allowedOrigins = process.env.MCP_ALLOWED_ORIGINS
              .split(",")
              .map((entry) => entry.trim())
              .filter(Boolean);
            const isExactHttpsOrigin = (value) => {
              try {
                const parsed = new URL(value);
                return parsed.protocol === "https:" && parsed.origin === value && parsed.hostname !== "null";
              } catch {
                return false;
              }
            };
            if (!isExactHttpsOrigin(resourceOrigin) ||
                allowedOrigins.length === 0 ||
                allowedOrigins.some((origin) => origin === "*" || !isExactHttpsOrigin(origin))) {
              process.exit(1);
            }
          '; then
            echo "MCP origins must be non-empty exact HTTPS origins without paths, credentials, query strings, fragments, or wildcards." >&2
            exit 1
          fi
          : "${WLH_BASE_URL:?WLH_BASE_URL environment secret is required for $ENVIRONMENT_NAME}"
          : "${WLH_CATEGORY_BLOB_CONTAINER:?WLH_CATEGORY_BLOB_CONTAINER variable is required for $ENVIRONMENT_NAME}"
          : "${WLH_CATEGORY_BLOB_NAME:?WLH_CATEGORY_BLOB_NAME variable is required for $ENVIRONMENT_NAME}"
          : "${WEB_AUTH_ENABLED:?WEB_AUTH_ENABLED repository variable is required for $ENVIRONMENT_NAME}"
          if [ "$WEB_AUTH_ENABLED" != "true" ]; then
            echo "WEB_AUTH_ENABLED must be true for $ENVIRONMENT_NAME deployment after the auth milestone." >&2
            exit 1
          fi
          : "${WEB_AUTH_CLIENT_ID:?WEB_AUTH_CLIENT_ID repository variable is required for $ENVIRONMENT_NAME}"
          : "${WEB_AUTH_AUTHORITY:?WEB_AUTH_AUTHORITY repository variable is required for $ENVIRONMENT_NAME}"
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            : "${WEB_AUTH_REDIRECT_URI:?WEB_AUTH_REDIRECT_URI repository variable is required for production}"
          fi
          : "${WEB_AUTH_API_SCOPE:?WEB_AUTH_API_SCOPE repository variable is required for $ENVIRONMENT_NAME}"
          : "${REDDIT_CLIENT_ID:?REDDIT_CLIENT_ID environment variable is required for $ENVIRONMENT_NAME}"
          : "${REDDIT_USER_AGENT:?REDDIT_USER_AGENT environment variable is required for $ENVIRONMENT_NAME}"
          : "${BRING_ENABLED:?BRING_ENABLED environment variable must be explicitly true or false}"
          : "${BRING_ADD_ENABLED:?BRING_ADD_ENABLED environment variable must be explicitly true or false}"
          : "${BRING_DESTRUCTIVE_ENABLED:?BRING_DESTRUCTIVE_ENABLED environment variable must be explicitly true or false}"
          for flag in "$BRING_ENABLED" "$BRING_ADD_ENABLED" "$BRING_DESTRUCTIVE_ENABLED"; do
            if [ "$flag" != "true" ] && [ "$flag" != "false" ]; then
              echo "Bring enablement flags must be true or false." >&2
              exit 1
            fi
          done
          if [ "$BRING_ENABLED" != "true" ] &&
             { [ "$BRING_ADD_ENABLED" = "true" ] || [ "$BRING_DESTRUCTIVE_ENABLED" = "true" ]; }; then
            echo "Bring write flags require BRING_ENABLED=true." >&2
            exit 1
          fi
          if [ "$ENVIRONMENT_NAME" = "test" ] &&
             { [ "$BRING_ADD_ENABLED" != "false" ] || [ "$BRING_DESTRUCTIVE_ENABLED" != "false" ]; }; then
            echo "Bring writes are prohibited in test because test reuses the production technical account." >&2
            exit 1
          fi
          if [ "$BRING_ENABLED" = "true" ]; then
            : "${BRING_EXPECTED_ACCOUNT_FINGERPRINT:?BRING_EXPECTED_ACCOUNT_FINGERPRINT is required when Bring is enabled}"
            : "${BRING_READABLE_LIST_UUIDS:?BRING_READABLE_LIST_UUIDS is required when Bring is enabled}"
          fi
          if [ "$BRING_ADD_ENABLED" = "true" ] || [ "$BRING_DESTRUCTIVE_ENABLED" = "true" ]; then
            : "${BRING_WRITABLE_LIST_UUIDS:?BRING_WRITABLE_LIST_UUIDS is required when Bring writes are enabled}"
          fi
          if [ "${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" = "true" ]; then
            : "${REPAIRABLE_ERRORS_LLM_MODEL:?REPAIRABLE_ERRORS_LLM_MODEL repository variable is required when Repairable Error LLM diagnostics are enabled}"
          fi
      - name: Azure OIDC login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # tag=v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Download immutable CI release bundle
        if: ${{ !inputs.allowRollback }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag=v4
        with:
          name: release-${{ inputs.sourceRef || github.sha }}
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.ci_run_id }}
      - name: Download exact accepted production release bundle
        if: ${{ inputs.allowRollback }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag=v4
        with:
          name: production-release-${{ inputs.sourceRef }}-${{ inputs.rollbackReleaseCorrelation }}
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rollbackReleaseRunId }}
      - name: Verify immutable release bundle
        shell: bash
        env:
          APPROVED_FUNCTION_DIGEST: ${{ steps.source.outputs.approved_function_digest }}
          APPROVED_FRONTEND_DIGEST: ${{ steps.source.outputs.approved_frontend_digest }}
          APPROVED_SBOM_DIGEST: ${{ steps.source.outputs.approved_sbom_digest }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          node scripts/verify-release-artifacts.mjs "$release_dir" "${SOURCE_REF:-${GITHUB_SHA}}" > "$RUNNER_TEMP/release-manifest-verified.json"
          function_digest="$(jq -r '.artifacts.functionapp.sha256' "$release_dir/release-manifest.json")"
          frontend_digest="$(jq -r '.artifacts.frontend.sha256' "$release_dir/release-manifest.json")"
          sbom_digest="$(jq -r '.artifacts.sbom.sha256' "$release_dir/release-manifest.json")"
          {
            echo "FUNCTION_ARTIFACT_SHA256=$function_digest"
            echo "FRONTEND_SOURCE_ARTIFACT_SHA256=$frontend_digest"
            echo "FRONTEND_ARTIFACT_SHA256=$frontend_digest"
            echo "SBOM_SHA256=$sbom_digest"
          } >> "$GITHUB_ENV"
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            # APPROVED_* values are assigned through the workflow step environment.
            # shellcheck disable=SC2153
            approved_function_digest="$APPROVED_FUNCTION_DIGEST"
            # shellcheck disable=SC2153
            approved_frontend_digest="$APPROVED_FRONTEND_DIGEST"
            # shellcheck disable=SC2153
            approved_sbom_digest="$APPROVED_SBOM_DIGEST"
            if [ "$function_digest" != "$approved_function_digest" ] ||
               [ "$frontend_digest" != "$approved_frontend_digest" ] ||
               [ "$sbom_digest" != "$approved_sbom_digest" ]; then
              echo "Production release artifacts do not match the exact accepted deployment evidence." >&2
              exit 1
            fi
          fi
      - name: Deploy Bicep infrastructure
        if: ${{ !inputs.allowRollback }}
        id: infra
        shell: bash
        env:
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_CLIENT_API_KEY: ${{ secrets.BRING_CLIENT_API_KEY }}
          BRING_CONFIRMATION_HMAC_KEY: ${{ secrets.BRING_CONFIRMATION_HMAC_KEY }}
          BRING_MUTATION_ENCRYPTION_KEY: ${{ secrets.BRING_MUTATION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          : "${REDDIT_CLIENT_SECRET:?REDDIT_CLIENT_SECRET environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_EMAIL:?BRING_EMAIL environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_PASSWORD:?BRING_PASSWORD environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_CLIENT_API_KEY:?BRING_CLIENT_API_KEY environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_CONFIRMATION_HMAC_KEY:?BRING_CONFIRMATION_HMAC_KEY environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_MUTATION_ENCRYPTION_KEY:?BRING_MUTATION_ENCRYPTION_KEY environment secret is required for $ENVIRONMENT_NAME}"
          openai_secret_name='OPENAI_API_KEY'
          openai_credential=""
          if [ "${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" = "true" ]; then
            if [ -z "${!openai_secret_name:-}" ]; then
              echo "OpenAI repository secret is required when Repairable Error LLM diagnostics are enabled." >&2
              exit 1
            fi
            openai_credential="${!openai_secret_name}"
          fi
          if [ -f infra/main.bicep ]; then
            api_cors_redirect_uri=""
            if [ "$ENVIRONMENT_NAME" = "prod" ]; then
              api_cors_redirect_uri="${WEB_AUTH_REDIRECT_URI:-}"
            else
              api_cors_redirect_uri="${TEST_WEB_AUTH_REDIRECT_URI:-}"
            fi
            api_cors_allowed_origins=""
            if [ -n "$api_cors_redirect_uri" ]; then
              api_cors_allowed_origins="$(API_CORS_REDIRECT_URI="$api_cors_redirect_uri" node --input-type=module --eval "process.stdout.write(new URL(process.env.API_CORS_REDIRECT_URI).origin)")"
            fi
            monthly_budget_eur=10
            if [ "$ENVIRONMENT_NAME" = "prod" ]; then
              monthly_budget_eur=15
            fi
            budget_resource_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Consumption/budgets/budget-api-catalogue-${ENVIRONMENT_NAME}"
            budget_start_date="$(node scripts/resolve-budget-start-date.mjs \
              --resource-id "$budget_resource_id" \
              --current-month "$(date -u +%Y-%m-01T00:00:00Z)")"

            node scripts/assert-current-main.mjs
            deployment_outputs=$(az deployment group create \
              --name "main-${ENVIRONMENT_NAME}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters environmentName="$ENVIRONMENT_NAME" \
                authEnabled="$AUTH_ENABLED" \
                oidcIssuer="${OIDC_ISSUER:-}" \
                oidcAudience="${OIDC_AUDIENCE:-}" \
                oidcJwksUri="${OIDC_JWKS_URI:-}" \
                oidcRequiredScopes="${OIDC_REQUIRED_SCOPES:-catalogue.read,reddit.read,wlh.read,bring.read,bring.write,bring.complete,bring.remove}" \
                oidcAllowedObjectIds="${OIDC_ALLOWED_OBJECT_IDS:-}" \
                oidcAllowedSubjects="${OIDC_ALLOWED_SUBJECTS:-}" \
                oidcAllowedAppObjectIds="${OIDC_ALLOWED_APP_OBJECT_IDS:-}" \
                oidcAllowedClientIds="${OIDC_ALLOWED_CLIENT_IDS:-}" \
                oidcAllowedDelegatedClientIds="${OIDC_ALLOWED_DELEGATED_CLIENT_IDS:-}" \
                oidcAllowedTenants="${OIDC_ALLOWED_TENANTS:-}" \
                authDebug="${AUTH_DEBUG:-false}" \
                apiCorsAllowedOrigins="$api_cors_allowed_origins" \
                mcpResourceOrigin="$MCP_RESOURCE_ORIGIN" \
                mcpAllowedOrigins="$MCP_ALLOWED_ORIGINS" \
                deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
                operatorAlertEmail="$OPERATOR_ALERT_EMAIL" \
                monthlyBudgetEur="$monthly_budget_eur" \
                budgetStartDate="$budget_start_date" \
                redditClientId="${REDDIT_CLIENT_ID:-}" \
                redditOAuthSecret="${REDDIT_CLIENT_SECRET:-}" \
                redditUserAgent="${REDDIT_USER_AGENT:-}" \
                bringBaseUrl="${BRING_BASE_URL:-https://api.getbring.com/rest/}" \
                bringClientApiKey="$BRING_CLIENT_API_KEY" \
                bringCountry="${BRING_COUNTRY:-AT}" \
                bringEmail="$BRING_EMAIL" \
                bringPassword="$BRING_PASSWORD" \
                bringEnabled="$BRING_ENABLED" \
                bringAddEnabled="$BRING_ADD_ENABLED" \
                bringDestructiveEnabled="$BRING_DESTRUCTIVE_ENABLED" \
                bringExpectedAccountFingerprint="${BRING_EXPECTED_ACCOUNT_FINGERPRINT:-}" \
                bringDefaultListUuid="${BRING_DEFAULT_LIST_UUID:-}" \
                bringReadableListUuids="${BRING_READABLE_LIST_UUIDS:-}" \
                bringWritableListUuids="${BRING_WRITABLE_LIST_UUIDS:-}" \
                bringSessionCacheEnabled="${BRING_SESSION_CACHE_ENABLED:-true}" \
                bringSessionCacheContainer="${BRING_SESSION_CACHE_CONTAINER:-bring-private}" \
                bringSessionCacheBlob="${BRING_SESSION_CACHE_BLOB:-session-v1.json}" \
                bringMutationContainer="${BRING_MUTATION_CONTAINER:-bring-mutations}" \
                bringAuditContainer="${BRING_AUDIT_CONTAINER:-bring-audit}" \
                bringConfirmationHmacKey="$BRING_CONFIRMATION_HMAC_KEY" \
                bringMutationEncryptionKey="$BRING_MUTATION_ENCRYPTION_KEY" \
                wlhBaseUrl="${WLH_BASE_URL:-}" \
                wlhCategoryBlobContainer="${WLH_CATEGORY_BLOB_CONTAINER:-wlh-reference}" \
                wlhCategoryBlobName="${WLH_CATEGORY_BLOB_NAME:-categories-marketplace.v1.json.gz}" \
                openAiCredential="$openai_credential" \
                repairableErrorsLlmEnabled="${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" \
                repairableErrorsLlmModel="${REPAIRABLE_ERRORS_LLM_MODEL:-}" \
              --query properties.outputs \
              -o json)

            {
              echo "function_app_name=$(jq -r '.functionAppResourceName.value // empty' <<< "$deployment_outputs")"
              echo "host_storage_account_name=$(jq -r '.hostStorageAccountResourceName.value // empty' <<< "$deployment_outputs")"
              echo "release_storage_account_name=$(jq -r '.releaseStorageAccountResourceName.value // empty' <<< "$deployment_outputs")"
              echo "static_storage_account_name=$(jq -r '.staticWebStorageAccountResourceName.value // empty' <<< "$deployment_outputs")"
              echo "private_storage_account_name=$(jq -r '.privateStorageAccountResourceName.value // empty' <<< "$deployment_outputs")"
              echo "application_insights_name=$(jq -r '.applicationInsightsResourceName.value // empty' <<< "$deployment_outputs")"
              echo "key_vault_name=$(jq -r '.keyVaultResourceName.value // empty' <<< "$deployment_outputs")"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No infra/main.bicep found; skipping infrastructure deployment."
          fi
      - name: Resolve runtime settings
        id: resolve
        shell: bash
        env:
          INFRA_FUNCTION_APP_NAME: ${{ steps.infra.outputs.function_app_name }}
          INFRA_RELEASE_STORAGE_ACCOUNT_NAME: ${{ steps.infra.outputs.release_storage_account_name }}
          INFRA_STATIC_STORAGE_ACCOUNT_NAME: ${{ steps.infra.outputs.static_storage_account_name }}
          INFRA_PRIVATE_STORAGE_ACCOUNT_NAME: ${{ steps.infra.outputs.private_storage_account_name }}
          INFRA_HOST_STORAGE_ACCOUNT_NAME: ${{ steps.infra.outputs.host_storage_account_name }}
          INFRA_APPLICATION_INSIGHTS_NAME: ${{ steps.infra.outputs.application_insights_name }}
          INFRA_KEY_VAULT_NAME: ${{ steps.infra.outputs.key_vault_name }}
        run: |
          set -euo pipefail
          effective_functionapp_name="$INFRA_FUNCTION_APP_NAME"
          effective_release_storage="$INFRA_RELEASE_STORAGE_ACCOUNT_NAME"
          effective_static_storage="$INFRA_STATIC_STORAGE_ACCOUNT_NAME"
          effective_private_storage="$INFRA_PRIVATE_STORAGE_ACCOUNT_NAME"
          effective_host_storage="$INFRA_HOST_STORAGE_ACCOUNT_NAME"
          effective_app_insights="$INFRA_APPLICATION_INSIGHTS_NAME"
          effective_key_vault="$INFRA_KEY_VAULT_NAME"

          resolve_storage_by_purpose() {
            local purpose="$1"
            local -a matches=()
            mapfile -t matches < <(az storage account list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?tags.purpose=='$purpose'].name" \
              -o tsv)
            if [ "${#matches[@]}" -ne 1 ] || [ -z "${matches[0]}" ]; then
              echo "Expected exactly one storage account tagged purpose=$purpose in $AZURE_RESOURCE_GROUP." >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          resolve_single_resource_by_type() {
            local resource_type="$1"
            local description="$2"
            local -a matches=()
            mapfile -t matches < <(az resource list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --resource-type "$resource_type" \
              --query '[].name' \
              -o tsv)
            if [ "${#matches[@]}" -ne 1 ] || [ -z "${matches[0]}" ]; then
              echo "Expected exactly one $description in $AZURE_RESOURCE_GROUP." >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          resolve_key_vault_by_purpose() {
            local -a matches=()
            mapfile -t matches < <(az keyvault list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?tags.purpose=='provider-secrets'].name" \
              -o tsv)
            if [ "${#matches[@]}" -ne 1 ] || [ -z "${matches[0]}" ]; then
              echo "Expected exactly one Key Vault tagged purpose=provider-secrets in $AZURE_RESOURCE_GROUP." >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          if [ "$ALLOW_ROLLBACK" = "true" ]; then
            if [ "$ENVIRONMENT_NAME" != "prod" ]; then
              echo "Package-only rollback is restricted to production." >&2
              exit 1
            fi
            effective_functionapp_name="${AZURE_FUNCTIONAPP_NAME:-}"
            effective_release_storage="$(resolve_storage_by_purpose immutable-release-packages)"
            discovered_static_storage="$(resolve_storage_by_purpose public-static-site)"
            effective_private_storage="$(resolve_storage_by_purpose private-integration-state)"
            effective_host_storage="$(resolve_storage_by_purpose function-host)"
            effective_static_storage="${AZURE_STATIC_WEB_STORAGE_ACCOUNT:-$discovered_static_storage}"
            if [ "$effective_static_storage" != "$discovered_static_storage" ]; then
              echo "Configured production static account does not match the uniquely tagged deployed resource." >&2
              exit 1
            fi
            effective_base_url="${PRODUCTION_BASE_URL:-}"
            : "${effective_functionapp_name:?AZURE_FUNCTIONAPP_NAME is required for package-only rollback}"
            az functionapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$effective_functionapp_name" \
              --query name \
              -o tsv >/dev/null
          elif [ "$ENVIRONMENT_NAME" = "prod" ]; then
            effective_functionapp_name="${effective_functionapp_name:-${AZURE_FUNCTIONAPP_NAME:-}}"
            effective_static_storage="${effective_static_storage:-${AZURE_STATIC_WEB_STORAGE_ACCOUNT:-}}"
            effective_base_url="${PRODUCTION_BASE_URL:-}"
          else
            effective_base_url=""
          fi

          discovered_app_insights="$(resolve_single_resource_by_type Microsoft.Insights/components 'Application Insights component')"
          if [ -n "$effective_app_insights" ] && [ "$effective_app_insights" != "$discovered_app_insights" ]; then
            echo "Bicep Application Insights output does not match the uniquely deployed component." >&2
            exit 1
          fi
          effective_app_insights="$discovered_app_insights"
          discovered_key_vault="$(resolve_key_vault_by_purpose)"
          if [ -n "$effective_key_vault" ] && [ "$effective_key_vault" != "$discovered_key_vault" ]; then
            echo "Bicep Key Vault output does not match the uniquely tagged deployed vault." >&2
            exit 1
          fi
          effective_key_vault="$discovered_key_vault"

          : "${effective_functionapp_name:?Function App name could not be resolved}"
          : "${effective_release_storage:?Release storage account name could not be resolved}"
          : "${effective_static_storage:?Static-web storage account name could not be resolved}"
          : "${effective_private_storage:?Private integration storage account name could not be resolved}"
          : "${effective_host_storage:?Function host storage account name could not be resolved}"

          effective_frontend_url=""
          if [ -n "$effective_static_storage" ]; then
            effective_frontend_url="$(az storage account show --resource-group "$AZURE_RESOURCE_GROUP" --name "$effective_static_storage" --query primaryEndpoints.web -o tsv 2>/dev/null || true)"
            effective_frontend_url="${effective_frontend_url%/}"
          fi

          if [ -z "$effective_base_url" ]; then
            default_host_name=$(az functionapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$effective_functionapp_name" \
              --query defaultHostName \
              -o tsv)
            : "${default_host_name:?Unable to discover Function App default hostname}"
            effective_base_url="https://$default_host_name"
          fi

          {
            echo "EFFECTIVE_FUNCTIONAPP_NAME=$effective_functionapp_name"
            echo "EFFECTIVE_RELEASE_STORAGE_ACCOUNT=$effective_release_storage"
            echo "EFFECTIVE_STATIC_STORAGE_ACCOUNT=$effective_static_storage"
            echo "EFFECTIVE_PRIVATE_STORAGE_ACCOUNT=$effective_private_storage"
            echo "EFFECTIVE_HOST_STORAGE_ACCOUNT=$effective_host_storage"
            echo "EFFECTIVE_BASE_URL=$effective_base_url"
            echo "FRONTEND_BASE_URL=$effective_frontend_url"
            echo "EFFECTIVE_APPLICATIONINSIGHTS_NAME=$effective_app_insights"
            echo "EFFECTIVE_KEY_VAULT_NAME=$effective_key_vault"
          } >> "$GITHUB_ENV"

          {
            echo "function_app_name=$effective_functionapp_name"
            echo "storage_account_name=$effective_static_storage"
            echo "release_storage_account_name=$effective_release_storage"
            echo "effective_base_url=$effective_base_url"
            echo "frontend_base_url=$effective_frontend_url"
            echo "application_insights_name=$effective_app_insights"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Effective $ENVIRONMENT_NAME deployment settings"
            echo "- Base URL: $effective_base_url"
            echo "- Function App name: $effective_functionapp_name"
            echo "- Function host storage account: $effective_host_storage"
            echo "- Release storage account: $effective_release_storage"
            echo "- Static web storage account: $effective_static_storage"
            echo "- Private integration storage account: $effective_private_storage"
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Source ref: ${SOURCE_REF:-${GITHUB_SHA}}"
            echo "- Application Insights: ${effective_app_insights:-<not resolved>}"
            echo "- Frontend URL: ${effective_frontend_url:-<not resolved>}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify complete deployed runtime safety policy
        if: ${{ inputs.deployFunctions }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EFFECTIVE_FUNCTIONAPP_NAME:?Function App name is required to validate runtime safety settings}"
          : "${EFFECTIVE_APPLICATIONINSIGHTS_NAME:?Application Insights name is required to validate runtime safety settings}"
          : "${EFFECTIVE_KEY_VAULT_NAME:?Key Vault name is required to validate runtime safety settings}"
          app_insights_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Insights/components/$EFFECTIVE_APPLICATIONINSIGHTS_NAME?api-version=2020-02-02"
          expected_app_insights_connection="$(az rest \
            --method get \
            --url "$app_insights_url" \
            --query properties.ConnectionString \
            -o tsv)"
          : "${expected_app_insights_connection:?Application Insights connection string metadata could not be resolved}"

          key_vault_reference() {
            local secret_name="$1"
            local secret_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.KeyVault/vaults/$EFFECTIVE_KEY_VAULT_NAME/secrets/$secret_name?api-version=2023-07-01"
            local secret_uri
            secret_uri="$(az rest \
              --method get \
              --url "$secret_url" \
              --query properties.secretUriWithVersion \
              -o tsv)"
            if [ -z "$secret_uri" ]; then
              echo "Managed Key Vault secret metadata is missing: $secret_name" >&2
              return 1
            fi
            printf '@Microsoft.KeyVault(SecretUri=%s)' "$secret_uri"
          }

          expected_reddit_reference="$(key_vault_reference reddit-client-secret)"
          expected_wlh_reference="$(key_vault_reference wlh-base-url)"
          expected_bring_api_reference="$(key_vault_reference bring-client-api-key)"
          expected_bring_email_reference="$(key_vault_reference bring-email)"
          expected_bring_password_reference="$(key_vault_reference bring-password)"
          expected_bring_confirmation_reference="$(key_vault_reference bring-confirmation-hmac-key)"
          expected_bring_encryption_reference="$(key_vault_reference bring-mutation-encryption-key)"
          expected_openai_reference=""
          if [ "${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" = "true" ]; then
            expected_openai_reference="$(key_vault_reference openai-api-key)"
          fi

          settings_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$EFFECTIVE_FUNCTIONAPP_NAME/config/appsettings/list?api-version=2023-12-01"
          az rest \
            --method post \
            --url "$settings_url" \
            --body '{}' \
            --output json \
            | EXPECTED_APPLICATIONINSIGHTS_CONNECTION_STRING="$expected_app_insights_connection" \
              EXPECTED_REDDIT_CLIENT_SECRET_REFERENCE="$expected_reddit_reference" \
              EXPECTED_WLH_BASE_URL_REFERENCE="$expected_wlh_reference" \
              EXPECTED_BRING_CLIENT_API_KEY_REFERENCE="$expected_bring_api_reference" \
              EXPECTED_BRING_EMAIL_REFERENCE="$expected_bring_email_reference" \
              EXPECTED_BRING_PASSWORD_REFERENCE="$expected_bring_password_reference" \
              EXPECTED_BRING_CONFIRMATION_HMAC_KEY_REFERENCE="$expected_bring_confirmation_reference" \
              EXPECTED_BRING_MUTATION_ENCRYPTION_KEY_REFERENCE="$expected_bring_encryption_reference" \
              EXPECTED_OPENAI_API_KEY_REFERENCE="$expected_openai_reference" \
              node scripts/validate-deployed-runtime-settings.mjs --arm-response
      - name: Verify private WLH reference data is present
        if: ${{ inputs.deployFunctions }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EFFECTIVE_PRIVATE_STORAGE_ACCOUNT:?Private integration storage account is required}"
          blob_exists="$(az storage blob exists \
            --auth-mode login \
            --account-name "$EFFECTIVE_PRIVATE_STORAGE_ACCOUNT" \
            --container-name "$WLH_CATEGORY_BLOB_CONTAINER" \
            --name "$WLH_CATEGORY_BLOB_NAME" \
            --query exists \
            -o tsv)"
          if [ "$blob_exists" != "true" ]; then
            echo "Required WLH reference blob is absent from the private integration account." >&2
            echo "Run the explicit Private Storage Migration workflow and verify its digest before deployment." >&2
            exit 1
          fi
      - name: Prepare exact deployable frontend bundle
        if: ${{ inputs.deployFrontend }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          frontend_archive="$release_dir/frontend.tar.gz"
          [ -f "$frontend_archive" ] || { echo "Frontend release archive is missing." >&2; exit 1; }

          if [ "$ALLOW_ROLLBACK" = "true" ]; then
            validation_dir="$(mktemp -d "$RUNNER_TEMP/frontend-rollback-validate.XXXXXX")"
            tar -xzf "$frontend_archive" -C "$validation_dir"
            [ -f "$validation_dir/index.html" ] || { echo "Accepted rollback frontend lacks index.html." >&2; exit 1; }
            [ -f "$validation_dir/assets/config.js" ] || { echo "Accepted rollback frontend lacks assets/config.js." >&2; exit 1; }
            [ -f "$validation_dir/assets/build-info.json" ] || { echo "Accepted rollback frontend lacks assets/build-info.json." >&2; exit 1; }
            if ! jq -e \
              --arg source_ref "${SOURCE_REF:-${GITHUB_SHA}}" \
              '.deployedCommitSha == ($source_ref | ascii_downcase) and .environmentName == "prod"' \
              "$validation_dir/assets/build-info.json" >/dev/null; then
              echo "Accepted rollback frontend metadata does not match the selected production release." >&2
              exit 1
            fi
            echo "Rollback preserves the previously accepted production frontend archive byte-for-byte."
            exit 0
          fi

          output_dir="$(mktemp -d "$RUNNER_TEMP/frontend-render.XXXXXX")"
          tar -xzf "$frontend_archive" -C "$output_dir"
          [ -f "$output_dir/index.html" ] || { echo "Frontend release lacks index.html." >&2; exit 1; }
          mkdir -p "$output_dir/assets"
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            effective_web_api_base_url="${WEB_API_BASE_URL:-$EFFECTIVE_BASE_URL}"
            effective_web_redirect_uri="${WEB_AUTH_REDIRECT_URI:-}"
            : "${effective_web_redirect_uri:?WEB_AUTH_REDIRECT_URI is required for production frontend auth}"
          else
            effective_web_api_base_url="$EFFECTIVE_BASE_URL"
            effective_web_redirect_uri="${TEST_WEB_AUTH_REDIRECT_URI:-}"
          fi
          export EFFECTIVE_WEB_API_BASE_URL="$effective_web_api_base_url"
          export EFFECTIVE_WEB_REDIRECT_URI="$effective_web_redirect_uri"
          export EFFECTIVE_DEPLOYED_AT_UTC="${DEPLOYED_AT_UTC:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
          echo "EFFECTIVE_DEPLOYED_AT_UTC=$EFFECTIVE_DEPLOYED_AT_UTC" >> "$GITHUB_ENV"
          node --input-type=module --eval "const config={authEnabled:process.env.WEB_AUTH_ENABLED==='true',authClientId:process.env.WEB_AUTH_CLIENT_ID||'',authAuthority:process.env.WEB_AUTH_AUTHORITY||'',authRedirectUri:process.env.EFFECTIVE_WEB_REDIRECT_URI||'',authApiScope:process.env.WEB_AUTH_API_SCOPE||'',apiBaseUrl:process.env.EFFECTIVE_WEB_API_BASE_URL||'',deployedCommitSha:(process.env.SOURCE_REF||process.env.GITHUB_SHA||'').toLowerCase(),environmentName:process.env.ENVIRONMENT_NAME||'unknown',deploymentRunId:process.env.GITHUB_RUN_ID||'unknown',deployedAtUtc:process.env.EFFECTIVE_DEPLOYED_AT_UTC||'unknown'}; process.stdout.write('window.API_CATALOGUE_CONFIG = '+JSON.stringify(config)+';\\n');" > "$output_dir/assets/config.js"
          jq -n --arg deployedCommitSha "${SOURCE_REF:-${GITHUB_SHA}}" --arg environmentName "$ENVIRONMENT_NAME" --arg deploymentRunId "$GITHUB_RUN_ID" --arg deployedAtUtc "$EFFECTIVE_DEPLOYED_AT_UTC" '{service:"api-catalogue-web", deployedCommitSha:($deployedCommitSha|ascii_downcase), environmentName:$environmentName, deploymentRunId:$deploymentRunId, deployedAtUtc:$deployedAtUtc}' > "$output_dir/assets/build-info.json"

          rendered_archive="$RUNNER_TEMP/frontend-rendered.tar.gz"
          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH:-0}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$rendered_archive" \
            -C "$output_dir" \
            .
          mv "$rendered_archive" "$frontend_archive"
          frontend_digest="$(sha256sum "$frontend_archive" | awk '{print $1}')"
          manifest_tmp="$(mktemp "$RUNNER_TEMP/release-manifest.XXXXXX")"
          jq --arg digest "$frontend_digest" '.artifacts.frontend.sha256 = $digest' \
            "$release_dir/release-manifest.json" > "$manifest_tmp"
          mv "$manifest_tmp" "$release_dir/release-manifest.json"
          (
            cd "$release_dir"
            sha256sum functionapp.zip frontend.tar.gz sbom.cdx.json > SHA256SUMS
          )
          node scripts/verify-release-artifacts.mjs "$release_dir" "${SOURCE_REF:-${GITHUB_SHA}}" > "$RUNNER_TEMP/release-manifest-rendered.json"
          echo "FRONTEND_ARTIFACT_SHA256=$frontend_digest" >> "$GITHUB_ENV"
      - name: Package and deploy Azure Functions
        if: ${{ inputs.deployFunctions }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/release/functionapp.zip" ]; then
            : "${EFFECTIVE_FUNCTIONAPP_NAME:?EFFECTIVE_FUNCTIONAPP_NAME is required when Azure Functions are present}"
            : "${EFFECTIVE_RELEASE_STORAGE_ACCOUNT:?EFFECTIVE_RELEASE_STORAGE_ACCOUNT is required for run-from-package deployment}"
            : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

            release_container="function-releases"
            release_blob="functionapp-${FUNCTION_ARTIFACT_SHA256}.zip"

            if [ "$ALLOW_ROLLBACK" != "true" ]; then
              node scripts/assert-current-main.mjs
              az storage container create \
                --auth-mode login \
                --account-name "$EFFECTIVE_RELEASE_STORAGE_ACCOUNT" \
                --name "$release_container" \
                --public-access off \
                -o none
            fi
            blob_exists="$(az storage blob exists \
              --auth-mode login \
              --account-name "$EFFECTIVE_RELEASE_STORAGE_ACCOUNT" \
              --container-name "$release_container" \
              --name "$release_blob" \
              --query exists \
              -o tsv)"
            if [ "$blob_exists" != "true" ]; then
              if [ "$ALLOW_ROLLBACK" = "true" ]; then
                echo "Rollback requires the accepted digest-addressed Function package to already exist." >&2
                exit 1
              fi
              node scripts/assert-current-main.mjs
              az storage blob upload \
                --auth-mode login \
                --account-name "$EFFECTIVE_RELEASE_STORAGE_ACCOUNT" \
                --container-name "$release_container" \
                --name "$release_blob" \
                --file "$RUNNER_TEMP/release/functionapp.zip" \
                --overwrite false \
                -o none
            fi
            release_version_id="$(az storage blob show \
              --auth-mode login \
              --account-name "$EFFECTIVE_RELEASE_STORAGE_ACCOUNT" \
              --container-name "$release_container" \
              --name "$release_blob" \
              --query versionId \
              -o tsv)"
            if [ -z "$release_version_id" ]; then
              echo "Release storage did not return an immutable version ID for the Function package." >&2
              exit 1
            fi
            verified_package="$RUNNER_TEMP/verified-functionapp.zip"
            az storage blob download \
              --auth-mode login \
              --account-name "$EFFECTIVE_RELEASE_STORAGE_ACCOUNT" \
              --container-name "$release_container" \
              --name "$release_blob" \
              --version-id "$release_version_id" \
              --file "$verified_package" \
              --overwrite true \
              -o none
            verified_package_digest="$(sha256sum "$verified_package" | awk '{print $1}')"
            if [ "$verified_package_digest" != "$FUNCTION_ARTIFACT_SHA256" ]; then
              echo "Immutable release blob content does not match its approved digest." >&2
              exit 1
            fi

            encoded_release_version_id="$(node --input-type=module --eval 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$release_version_id")"
            package_url="https://$EFFECTIVE_RELEASE_STORAGE_ACCOUNT.blob.core.windows.net/$release_container/$release_blob?versionid=$encoded_release_version_id"
            deployed_at_utc="${EFFECTIVE_DEPLOYED_AT_UTC:-${DEPLOYED_AT_UTC:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}}"
            package_settings=(
              "WEBSITE_RUN_FROM_PACKAGE=$package_url"
              "WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned"
              "DEPLOYED_COMMIT_SHA=${SOURCE_REF:-${GITHUB_SHA}}"
              "DEPLOYED_SOURCE_REF=${SOURCE_REF:-${GITHUB_SHA}}"
              "DEPLOYMENT_RUN_ID=$GITHUB_RUN_ID"
              "DEPLOYED_AT_UTC=$deployed_at_utc"
              "BUILD_TIMESTAMP_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              "RELEASE_FUNCTION_SHA256=$FUNCTION_ARTIFACT_SHA256"
              "RELEASE_FRONTEND_SHA256=$FRONTEND_ARTIFACT_SHA256"
              "RELEASE_SBOM_SHA256=$SBOM_SHA256"
            )
            if [ "$ALLOW_ROLLBACK" != "true" ]; then
              package_settings+=("DEPLOYED_ENVIRONMENT_NAME=$ENVIRONMENT_NAME")
            fi

            node scripts/assert-current-main.mjs
            az functionapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$EFFECTIVE_FUNCTIONAPP_NAME" \
              --settings "${package_settings[@]}" \
              -o none
            settings_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$EFFECTIVE_FUNCTIONAPP_NAME/config/appsettings/list?api-version=2023-12-01"
            if ! az rest \
              --method post \
              --url "$settings_url" \
              --body '{}' \
              --output json \
              | jq -e \
                --arg package_url "$package_url" \
                '.properties.WEBSITE_RUN_FROM_PACKAGE == $package_url and .properties.WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID == "SystemAssigned"' \
                >/dev/null; then
              echo "Function App did not retain the exact immutable package-version pointer." >&2
              exit 1
            fi
            function_app_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$EFFECTIVE_FUNCTIONAPP_NAME"
            node scripts/assert-current-main.mjs
            az rest \
              --method post \
              --url "https://management.azure.com${function_app_id}/restart?api-version=2023-12-01" \
              --body '{}' \
              -o none
            for attempt in {1..12}; do
              node scripts/assert-current-main.mjs
              if az rest \
                --method post \
                --url "https://management.azure.com${function_app_id}/syncfunctiontriggers?api-version=2023-12-01" \
                --body '{}' \
                -o none; then
                echo "Function trigger sync succeeded on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Function trigger sync failed after 12 attempts." >&2
                exit 1
              fi
              echo "Function trigger sync not ready yet (attempt $attempt/12). Retrying in 10s..."
              sleep 10
            done
          else
            echo "No Azure Functions host.json found; skipping Functions deployment."
          fi
      - name: Deploy Angular static site with Azure OIDC
        if: ${{ inputs.deployFrontend }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/release/frontend.tar.gz" ]; then
            : "${EFFECTIVE_STATIC_STORAGE_ACCOUNT:?EFFECTIVE_STATIC_STORAGE_ACCOUNT is required when Angular is present}"
            output_dir="$(mktemp -d "$RUNNER_TEMP/frontend-release.XXXXXX")"
            tar -xzf "$RUNNER_TEMP/release/frontend.tar.gz" -C "$output_dir"
            : "${output_dir:?Frontend release extraction failed}"
            [ -f "$output_dir/index.html" ] || { echo "Frontend release lacks index.html." >&2; exit 1; }
            [ -f "$output_dir/assets/config.js" ] || { echo "Exact frontend release lacks assets/config.js." >&2; exit 1; }
            [ -f "$output_dir/assets/build-info.json" ] || { echo "Exact frontend release lacks assets/build-info.json." >&2; exit 1; }
            if ! jq -e \
              --arg source_ref "${SOURCE_REF:-${GITHUB_SHA}}" \
              --arg environment_name "$ENVIRONMENT_NAME" \
              '.deployedCommitSha == ($source_ref | ascii_downcase) and .environmentName == $environment_name' \
              "$output_dir/assets/build-info.json" >/dev/null; then
              echo "Exact frontend build metadata does not match the selected release." >&2
              exit 1
            fi
            frontend_inventory="$RUNNER_TEMP/frontend-inventory.json"
            non_entrypoint_inventory="$RUNNER_TEMP/frontend-non-entrypoint-inventory.json"
            current_blob_names="$RUNNER_TEMP/frontend-current-blob-names.json"
            stale_blob_plan="$RUNNER_TEMP/frontend-stale-blob-plan.json"
            stale_blob_lines="$RUNNER_TEMP/frontend-stale-blob-lines.txt"
            node scripts/frontend-inventory.mjs create "$output_dir" "$frontend_inventory"
            if [ "$ALLOW_ROLLBACK" != "true" ]; then
              node scripts/assert-current-main.mjs
              az storage blob service-properties update \
                --auth-mode login \
                --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
                --static-website true \
                --index-document index.html \
                -o none
            fi

            verify_expected_frontend_content() {
              local expected_inventory="$1"
              local verified_directory="$2"
              local expected_blob_lines="$3"
              mkdir -p "$verified_directory"
              jq -r '.files[].name' "$expected_inventory" > "$expected_blob_lines"
              while IFS= read -r expected_blob; do
                local verified_file="$verified_directory/$expected_blob"
                mkdir -p -- "$(dirname -- "$verified_file")"
                # shellcheck disable=SC2016
                az storage blob download \
                  --auth-mode login \
                  --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
                  --container-name '$web' \
                  --name "$expected_blob" \
                  --file "$verified_file" \
                  --overwrite true \
                  -o none
              done < "$expected_blob_lines"
              node scripts/frontend-inventory.mjs compare-directory "$expected_inventory" "$verified_directory"
            }

            # Keep the previously active entrypoint intact until every replacement dependency is uploaded and verified.
            entrypoint_file="$RUNNER_TEMP/frontend-entrypoint.html"
            mv "$output_dir/index.html" "$entrypoint_file"
            node scripts/frontend-inventory.mjs create "$output_dir" "$non_entrypoint_inventory"
            node scripts/assert-current-main.mjs
            # shellcheck disable=SC2016
            az storage blob upload-batch \
              --auth-mode login \
              --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
              --destination '$web' \
              --source "$output_dir" \
              --overwrite \
              -o none
            verified_non_entrypoint_dir="$(mktemp -d "$RUNNER_TEMP/frontend-non-entrypoint-verified.XXXXXX")"
            verify_expected_frontend_content \
              "$non_entrypoint_inventory" \
              "$verified_non_entrypoint_dir" \
              "$RUNNER_TEMP/frontend-non-entrypoint-lines.txt"

            mv "$entrypoint_file" "$output_dir/index.html"
            node scripts/assert-current-main.mjs
            # shellcheck disable=SC2016
            az storage blob upload \
              --auth-mode login \
              --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
              --container-name '$web' \
              --name index.html \
              --file "$output_dir/index.html" \
              --content-type 'text/html; charset=utf-8' \
              --content-cache-control no-cache \
              --overwrite true \
              -o none
            verified_expected_dir="$(mktemp -d "$RUNNER_TEMP/frontend-expected-verified.XXXXXX")"
            verify_expected_frontend_content \
              "$frontend_inventory" \
              "$verified_expected_dir" \
              "$RUNNER_TEMP/frontend-expected-lines.txt"

            # Only after the complete replacement is live and content-verified may stale blobs be removed.
            # $web is Azure's literal static-site container.
            # shellcheck disable=SC2016
            az storage blob list \
              --auth-mode login \
              --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
              --container-name '$web' \
              --query '[].name' \
              -o json > "$current_blob_names"
            node scripts/frontend-inventory.mjs plan-stale \
              "$frontend_inventory" \
              "$current_blob_names" \
              "$stale_blob_plan"
            jq -r '.[]' "$stale_blob_plan" > "$stale_blob_lines"
            while IFS= read -r stale_blob; do
              node scripts/assert-current-main.mjs
              # shellcheck disable=SC2016
              az storage blob delete \
                --auth-mode login \
                --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
                --container-name '$web' \
                --name "$stale_blob" \
                -o none
            done < "$stale_blob_lines"

            deployed_blob_names="$RUNNER_TEMP/frontend-deployed-blob-names.json"
            verified_blob_names="$RUNNER_TEMP/frontend-verified-blob-names.json"
            verified_frontend_dir="$(mktemp -d "$RUNNER_TEMP/frontend-verified.XXXXXX")"
            # shellcheck disable=SC2016
            az storage blob list \
              --auth-mode login \
              --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
              --container-name '$web' \
              --query '[].name' \
              -o json > "$deployed_blob_names"
            node scripts/frontend-inventory.mjs compare-names "$frontend_inventory" "$deployed_blob_names"
            # shellcheck disable=SC2016
            az storage blob download-batch \
              --auth-mode login \
              --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
              --source '$web' \
              --destination "$verified_frontend_dir" \
              --overwrite
            node scripts/frontend-inventory.mjs compare-directory "$frontend_inventory" "$verified_frontend_dir"
            # A second exact-name read detects additions or deletions during content verification.
            # shellcheck disable=SC2016
            az storage blob list \
              --auth-mode login \
              --account-name "$EFFECTIVE_STATIC_STORAGE_ACCOUNT" \
              --container-name '$web' \
              --query '[].name' \
              -o json > "$verified_blob_names"
            node scripts/frontend-inventory.mjs compare-names "$frontend_inventory" "$verified_blob_names"
          else
            echo "No angular.json found; skipping Angular static site deployment."
          fi
      - name: Verify current generation before runtime acceptance
        shell: bash
        run: node scripts/assert-current-main.mjs
      - name: Run runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          : "${EFFECTIVE_BASE_URL:?EFFECTIVE_BASE_URL is required for smoke tests}"
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          smoke_run_id="smoke-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SMOKE_RUN_ID=$smoke_run_id" >> "$GITHUB_ENV"
          export API_BASE_URL="$EFFECTIVE_BASE_URL"
          export EXPECTED_DEPLOYED_COMMIT_SHA="${SOURCE_REF:-${GITHUB_SHA}}"
          export ENVIRONMENT_NAME
          export RUNTIME_HEALTH_RETRY_ATTEMPTS="${RUNTIME_HEALTH_RETRY_ATTEMPTS:-60}"
          export RUNTIME_HEALTH_RETRY_DELAY_MS="${RUNTIME_HEALTH_RETRY_DELAY_MS:-5000}"
          export SMOKE_RUN_ID="$smoke_run_id"
          export AUTH_ENABLED
          if [ "${DEPLOY_FRONTEND:-false}" = "true" ] && [ -n "${FRONTEND_BASE_URL:-}" ]; then export FRONTEND_BASE_URL; fi
          npm run --silent ops:smoke | tee "$smoke_dir/runtime-smoke.json"
          echo "SMOKE_RESULTS_PATH=$smoke_dir/runtime-smoke.json" >> "$GITHUB_ENV"

          api_cors_redirect_uri=""
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            api_cors_redirect_uri="${WEB_AUTH_REDIRECT_URI:-}"
          else
            api_cors_redirect_uri="${TEST_WEB_AUTH_REDIRECT_URI:-}"
          fi
          api_cors_origin=""
          if [ -n "$api_cors_redirect_uri" ]; then
            api_cors_origin="$(API_CORS_REDIRECT_URI="$api_cors_redirect_uri" node --input-type=module --eval "process.stdout.write(new URL(process.env.API_CORS_REDIRECT_URI).origin)")"
            headers_file="$RUNNER_TEMP/api-cors-preflight-headers.txt"
            preflight_ok=false
            for attempt in {1..12}; do
              preflight_status=$(curl --show-error --silent --output /dev/null --dump-header "$headers_file" --write-out '%{http_code}' --max-time 20 \
                -X OPTIONS "$EFFECTIVE_BASE_URL/api/hello" \
                -H "Origin: $api_cors_origin" \
                -H "Access-Control-Request-Method: GET" \
                -H "Access-Control-Request-Headers: authorization")
              allow_origin_header="$(tr -d '\r' < "$headers_file" | awk 'BEGIN { IGNORECASE=1 } /^access-control-allow-origin:/ { sub(/^[^:]*:[[:space:]]*/, ""); value=$0 } END { print value }')"
              if { [ "$preflight_status" = "204" ] || [ "$preflight_status" = "200" ]; } && [ "$allow_origin_header" = "$api_cors_origin" ]; then
                preflight_ok=true
                break
              fi
              echo "Waiting for CORS preflight to allow $api_cors_origin (attempt $attempt/12, status $preflight_status)."
              sleep 5
            done
            if [ "$preflight_ok" != "true" ]; then
              echo "Expected CORS preflight for /api/hello to allow origin $api_cors_origin; got status $preflight_status and allow-origin '${allow_origin_header:-<missing>}'." >&2
              exit 1
            fi
          fi

          {
            echo "### Runtime smoke tests passed"
            echo "- $EFFECTIVE_BASE_URL/health reported ${SOURCE_REF:-${GITHUB_SHA}}"
            echo "- Unauthenticated /api/hello auth gate verified"
            if [ -n "$api_cors_origin" ]; then
              echo "- $EFFECTIVE_BASE_URL/api/hello CORS preflight allowed $api_cors_origin"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mint authenticated smoke token with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          export ENVIRONMENT_NAME
          export REQUIRE_AUTH_SMOKE=true
          npm run --silent ops:mint-smoke-token
      - name: Run authenticated smoke tests
        shell: bash
        env:
          REDDIT_SHARE_URL_SMOKE_REQUESTED: ${{ inputs.redditShareUrlSmokeEnabled && 'true' || 'false' }}
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          export API_BASE_URL="$EFFECTIVE_BASE_URL"
          export EXPECTED_DEPLOYED_COMMIT_SHA="${SOURCE_REF:-${GITHUB_SHA}}"
          export ENVIRONMENT_NAME
          export SMOKE_RUN_ID
          export REQUIRE_AUTH_SMOKE=true
          export REDDIT_SHARE_URL_SMOKE_ENABLED="$REDDIT_SHARE_URL_SMOKE_REQUESTED"
          export REDDIT_SHARE_URL_SMOKE_URL="https://www.reddit.com/r/macbookpro/s/nnlryuZCNX"
          export REDDIT_SHARE_URL_SMOKE_EXPECTED_POST_ID="1tryldy"
          npm run --silent ops:smoke:auth | tee "$smoke_dir/auth-smoke.json"
          echo "AUTH_SMOKE_RESULTS_PATH=$smoke_dir/auth-smoke.json" >> "$GITHUB_ENV"
      - name: Run telemetry gate
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          export APPLICATIONINSIGHTS_NAME="${EFFECTIVE_APPLICATIONINSIGHTS_NAME:-${APPLICATIONINSIGHTS_NAME:-}}"
          export AZURE_RESOURCE_GROUP
          export ENVIRONMENT_NAME
          export SMOKE_RUN_ID
          export REQUIRE_TELEMETRY_CHECK=true
          export TELEMETRY_REQUIRE_SMOKE_CORRELATION=true
          export TELEMETRY_TIMESPAN_MINUTES=45
          export TELEMETRY_RESULTS_PATH="$smoke_dir/telemetry.json"
          npm run --silent ops:check-telemetry
          echo "TELEMETRY_RESULTS_PATH=$smoke_dir/telemetry.json" >> "$GITHUB_ENV"
      - name: Verify current generation before evidence publication
        shell: bash
        run: node scripts/assert-current-main.mjs
      - name: Write release ledger
        shell: bash
        if: ${{ always() }}
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP:-.}/smoke"
          mkdir -p "$smoke_dir"
          export API_BASE_URL="${EFFECTIVE_BASE_URL:-}"
          export FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-}"
          export EXPECTED_DEPLOYED_COMMIT_SHA="${SOURCE_REF:-${GITHUB_SHA}}"
          export DEPLOYED_SOURCE_REF="${SOURCE_REF:-${GITHUB_SHA}}"
          export ENVIRONMENT_NAME
          export EFFECTIVE_FUNCTIONAPP_NAME="${EFFECTIVE_FUNCTIONAPP_NAME:-}"
          export RELEASE_FUNCTION_SHA256="$FUNCTION_ARTIFACT_SHA256"
          export RELEASE_FRONTEND_SHA256="$FRONTEND_ARTIFACT_SHA256"
          export RELEASE_SBOM_SHA256="$SBOM_SHA256"
          export SMOKE_RUN_ID="${SMOKE_RUN_ID:-smoke-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          export RELEASE_LEDGER_PATH="$smoke_dir/release-ledger-${ENVIRONMENT_NAME}.json"
          npm run --silent ops:write-release-ledger -- "$RELEASE_LEDGER_PATH"
          EXPECTED_DELIVERY_CORRELATION="$DELIVERY_CORRELATION" npm run --silent ops:validate-release-ledger -- "$RELEASE_LEDGER_PATH"
          echo "RELEASE_LEDGER_PATH=$RELEASE_LEDGER_PATH" >> "$GITHUB_ENV"
      - name: Upload release ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4
        with:
          name: release-ledger-${{ inputs.environmentName }}-${{ inputs.sourceRef || github.sha }}-${{ inputs.deliveryCorrelation }}
          path: ${{ runner.temp }}/smoke/release-ledger-${{ inputs.environmentName }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve exact accepted production release bundle
        if: ${{ inputs.environmentName == 'prod' && !inputs.allowRollback && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4
        with:
          name: production-release-${{ inputs.sourceRef || github.sha }}-${{ inputs.deliveryCorrelation }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
      - name: Record test deployment provenance
        if: ${{ inputs.environmentName == 'test' && success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          jq -n \
            --arg environmentName "$ENVIRONMENT_NAME" \
            --arg sourceRef "${SOURCE_REF:-${GITHUB_SHA}}" \
            --arg resolvedHead "$(git rev-parse HEAD)" \
            --arg deployFrontend "$DEPLOY_FRONTEND" \
            --arg deployFunctions "$DEPLOY_FUNCTIONS" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deliveryCorrelation "$DELIVERY_CORRELATION" \
            --arg ciRunId "$CI_RUN_ID" \
            --arg ciDeliveryCorrelation "$CI_DELIVERY_CORRELATION" \
            --arg functionappSha256 "$FUNCTION_ARTIFACT_SHA256" \
            --arg sourceFrontendSha256 "$FRONTEND_SOURCE_ARTIFACT_SHA256" \
            --arg frontendSha256 "$FRONTEND_ARTIFACT_SHA256" \
            --arg sbomSha256 "$SBOM_SHA256" \
            --arg authenticatedSmokeStatus "$(jq -r '.status // "missing"' "$AUTH_SMOKE_RESULTS_PATH")" \
            --arg telemetryStatus "$(jq -r '.status // "missing"' "$TELEMETRY_RESULTS_PATH")" \
            '{
              environmentName: $environmentName,
              sourceRef: $sourceRef,
              resolvedHead: $resolvedHead,
              deployFrontend: $deployFrontend,
              deployFunctions: $deployFunctions,
              eventName: $eventName,
              workflow: $workflow,
              repository: $repository,
              runId: $runId,
              runAttempt: $runAttempt,
              deliveryCorrelation: $deliveryCorrelation,
              ciRunId: $ciRunId,
              ciDeliveryCorrelation: $ciDeliveryCorrelation,
              artifacts: {
                functionappSha256: $functionappSha256,
                sourceFrontendSha256: $sourceFrontendSha256,
                frontendSha256: $frontendSha256,
                sbomSha256: $sbomSha256
              },
              authenticatedSmokeStatus: $authenticatedSmokeStatus,
              telemetryStatus: $telemetryStatus
            }' > .github/deploy-test-provenance.json
      - name: Upload test deployment provenance
        if: ${{ inputs.environmentName == 'test' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4
        with:
          name: deploy-test-provenance-${{ inputs.sourceRef || github.sha }}-${{ inputs.deliveryCorrelation }}
          path: .github/deploy-test-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Report production deployment values after smoke tests
        if: ${{ inputs.updateProductionVariables }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Production deployment values"
            echo "- PRODUCTION_BASE_URL: $EFFECTIVE_BASE_URL"
            echo "- AZURE_FUNCTIONAPP_NAME: $EFFECTIVE_FUNCTIONAPP_NAME"
            echo "- AZURE_STATIC_WEB_STORAGE_ACCOUNT: $EFFECTIVE_STATIC_STORAGE_ACCOUNT"
            echo ""
            echo "Repository variables are treated as operator-provided defaults and are not mutated by the workflow token."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Production values resolved::Smoke tests passed for $EFFECTIVE_BASE_URL using Function App $EFFECTIVE_FUNCTIONAPP_NAME and static storage account $EFFECTIVE_STATIC_STORAGE_ACCOUNT."
      - name: Create production issue on failed deploy or smoke
        if: ${{ failure() && inputs.environmentName == 'prod' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # tag=v8
        with:
          script: |
            const title = `Production deployment failed for ${context.sha.substring(0, 7)}`;
            const body = [
              'Production deployment or smoke tests failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Automation must fail closed. Investigate logs and create a bounded repair PR if safe.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['production-failure', 'codex-repair']
            });

  prepare-private-storage:
    if: ${{ inputs.preparePrivateStorageOnly }}
    name: prepare private storage ${{ inputs.environmentName }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.githubEnvironment }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
      AZURE_RESOURCE_GROUP: ${{ inputs.azureResourceGroup }}
      ENVIRONMENT_NAME: ${{ inputs.environmentName }}
      GITHUB_ENVIRONMENT_NAME: ${{ inputs.githubEnvironment }}
      SOURCE_REF: ${{ inputs.sourceRef }}
      CONTROLLER_REF: ${{ inputs.controllerRef }}
      CONTROLLER_WORKFLOW_SHA: ${{ inputs.controllerWorkflowSha }}
      DELIVERY_CORRELATION: ${{ inputs.deliveryCorrelation }}
      CI_RUN_ID: ${{ inputs.ciRunId }}
      CI_DELIVERY_CORRELATION: ${{ inputs.ciDeliveryCorrelation }}
      TEST_DELIVERY_CORRELATION: ${{ inputs.testDeliveryCorrelation }}
      TEST_DELIVERY_RUN_ID: ${{ inputs.testDeliveryRunId }}
      DEPLOY_PRODUCTION_ENABLED: ${{ vars.DEPLOY_PRODUCTION_ENABLED }}
      WLH_CATEGORY_BLOB_NAME: ${{ vars.WLH_CATEGORY_BLOB_NAME }}
      WLH_CATEGORY_BLOB_CONTAINER: ${{ vars.WLH_CATEGORY_BLOB_CONTAINER }}
      BRING_SESSION_CACHE_CONTAINER: ${{ vars.BRING_SESSION_CACHE_CONTAINER }}
      BRING_MUTATION_CONTAINER: ${{ vars.BRING_MUTATION_CONTAINER }}
      BRING_AUDIT_CONTAINER: ${{ vars.BRING_AUDIT_CONTAINER }}
      MIGRATION_SOURCE_STORAGE_ACCOUNT: ${{ inputs.migrationSourceStorageAccount }}
      MIGRATION_TARGET_STORAGE_ACCOUNT: ${{ inputs.migrationTargetStorageAccount }}
      MIGRATION_EXPECTED_SHA256: ${{ inputs.migrationExpectedSha256 }}
      MIGRATION_CONFIRMATION: ${{ inputs.migrationConfirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current preparation controller
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(pwd -P)" != "$(realpath "$GITHUB_WORKSPACE")" ] ||
             [ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "Preparation controller checkout requires the exact empty GitHub workspace." >&2
            exit 1
          fi

          git init .
          git remote add origin https://github.com/JueZ/api.git
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout --detach refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
          if [ -n "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)" ] ||
             [ -n "$(git clean -ndx)" ]; then
            echo "Preparation controller workspace contains content outside the exact commit." >&2
            exit 1
          fi
      - name: Validate bounded preparation source and evidence
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID environment variable is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID environment variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID environment variable is required}"
          : "${AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID:?AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID environment variable is required}"
          : "${WLH_CATEGORY_BLOB_CONTAINER:?WLH_CATEGORY_BLOB_CONTAINER environment variable is required}"
          : "${WLH_CATEGORY_BLOB_NAME:?WLH_CATEGORY_BLOB_NAME environment variable is required}"
          : "${BRING_SESSION_CACHE_CONTAINER:?BRING_SESSION_CACHE_CONTAINER environment variable is required}"
          : "${BRING_MUTATION_CONTAINER:?BRING_MUTATION_CONTAINER environment variable is required}"
          : "${BRING_AUDIT_CONTAINER:?BRING_AUDIT_CONTAINER environment variable is required}"

          deployment_ref="$SOURCE_REF"
          # CONTROLLER_REF is assigned through the workflow job environment.
          # shellcheck disable=SC2153
          controller_ref="$CONTROLLER_REF"
          checked_out_controller="$(git rev-parse HEAD)"
          expected_title="Prepare Production Private Storage $deployment_ref $DELIVERY_CORRELATION"
          if [ "$ENVIRONMENT_NAME" != "prod" ] ||
             [ "$GITHUB_ENVIRONMENT_NAME" != "production" ] ||
             [ "$AZURE_RESOURCE_GROUP" != "rg-api-prod" ] ||
             [ "${DEPLOY_PRODUCTION_ENABLED:-false}" != "true" ] ||
             [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Private-storage preparation is restricted to first-attempt guarded production runs." >&2
            exit 1
          fi
          if [[ ! "$deployment_ref" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$controller_ref" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$controller_ref" != "$CONTROLLER_WORKFLOW_SHA" ] ||
             [ "$controller_ref" != "$GITHUB_SHA" ] ||
             [ "$controller_ref" != "$checked_out_controller" ] ||
             [ "$deployment_ref" != "$controller_ref" ]; then
            echo "Preparation source and controller must equal the exact current-main workflow generation." >&2
            exit 1
          fi
          if [[ ! "$DELIVERY_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]] ||
             [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$CI_DELIVERY_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]] ||
             [[ ! "$TEST_DELIVERY_RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$TEST_DELIVERY_CORRELATION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]; then
            echo "Preparation requires exact CI/test run IDs and opaque correlations." >&2
            exit 1
          fi
          if [ "$MIGRATION_CONFIRMATION" != "PREPARE_PRODUCTION_PRIVATE_STORAGE" ] ||
             [ "$MIGRATION_SOURCE_STORAGE_ACCOUNT" != "stapicatalogueprodbfjsts" ] ||
             [ "$MIGRATION_TARGET_STORAGE_ACCOUNT" != "stapicatalogueprodpbfjst" ] ||
             [ "$MIGRATION_EXPECTED_SHA256" != "4b2651b8d842854716b4fb2e20ecd9482f59f2ea6ee2352401bec5d42e8c6ed0" ]; then
            echo "The production preparation request does not match the approved one-blob cutover." >&2
            exit 1
          fi

          current_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          if ! jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg controller_ref "$controller_ref" \
            --arg title "$expected_title" \
            '(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .head_sha == $controller_ref
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .path == ".github/workflows/prepare-production-private-storage.yml"
              and (.name == "Prepare Production Private Storage" or .name == $title)
              and .display_title == $title
              and .run_attempt == 1
              and (.status == "queued" or .status == "in_progress")' \
            <<<"$current_run_json" >/dev/null; then
            echo "Current preparation run identity is not the exact trusted caller." >&2
            exit 1
          fi

          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          [ "$controller_ref" = "$(git rev-parse origin/main)" ] || {
            echo "Preparation controller is no longer current main." >&2
            exit 1
          }

          ci_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          expected_ci_title="CI $deployment_ref $CI_DELIVERY_CORRELATION"
          if ! jq -e \
            --arg run_id "$CI_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$deployment_ref" \
            --arg title "$expected_ci_title" \
            '(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .path == ".github/workflows/ci.yml"
              and (.name == "CI" or .name == $title)
              and .event == "workflow_dispatch"
              and .conclusion == "success"
              and .head_branch == "main"
              and .head_sha == $source_ref
              and .display_title == $title
              and .run_attempt == 1' \
            <<<"$ci_run_json" >/dev/null; then
            echo "Pinned CI evidence does not match exact current main." >&2
            exit 1
          fi

          test_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_DELIVERY_RUN_ID}")"
          expected_test_title="Deploy Test $deployment_ref $TEST_DELIVERY_CORRELATION"
          if ! jq -e \
            --arg run_id "$TEST_DELIVERY_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$deployment_ref" \
            --arg title "$expected_test_title" \
            '(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .path == ".github/workflows/deploy-test.yml"
              and (.name == "Deploy Test" or .name == $title)
              and .event == "workflow_dispatch"
              and .conclusion == "success"
              and .head_branch == "main"
              and .head_sha == $source_ref
              and .display_title == $title
              and .run_attempt == 1' \
            <<<"$test_run_json" >/dev/null; then
            echo "Pinned Deploy Test evidence does not match exact current main." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/deploy-test-provenance"
          if find "$RUNNER_TEMP/deploy-test-provenance" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            echo "Deploy Test provenance extraction directory must be empty before download." >&2
            exit 1
          fi
          gh run download "$TEST_DELIVERY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "deploy-test-provenance-${deployment_ref}-${TEST_DELIVERY_CORRELATION}" \
            --dir "$RUNNER_TEMP/deploy-test-provenance"
          provenance_file="$RUNNER_TEMP/deploy-test-provenance/deploy-test-provenance.json"
          if ! jq -e \
            --arg source_ref "$deployment_ref" \
            --arg test_run_id "$TEST_DELIVERY_RUN_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg correlation "$TEST_DELIVERY_CORRELATION" \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg ci_correlation "$CI_DELIVERY_CORRELATION" \
            '.environmentName == "test"
              and .sourceRef == $source_ref
              and .resolvedHead == $source_ref
              and .runId == $test_run_id
              and .workflow == "Deploy Test"
              and .repository == $repository
              and .deliveryCorrelation == $correlation
              and .ciRunId == $ci_run_id
              and .ciDeliveryCorrelation == $ci_correlation
              and .runAttempt == "1"
              and .deployFrontend == "true"
              and .deployFunctions == "true"
              and .eventName == "workflow_dispatch"
              and (.artifacts.functionappSha256 | test("^[0-9a-f]{64}$"))
              and (.artifacts.sourceFrontendSha256 | test("^[0-9a-f]{64}$"))
              and (.artifacts.frontendSha256 | test("^[0-9a-f]{64}$"))
              and (.artifacts.sbomSha256 | test("^[0-9a-f]{64}$"))
              and .authenticatedSmokeStatus == "passed"
              and .telemetryStatus == "passed"' \
            "$provenance_file" >/dev/null; then
            echo "Pinned test provenance is not acceptable for production preparation." >&2
            exit 1
          fi
      - name: Azure OIDC login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # tag=v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Capture unchanged production runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t function_hosts < <(az functionapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[].defaultHostName' \
            -o tsv)
          if [ "${#function_hosts[@]}" -ne 1 ] || [ -z "${function_hosts[0]}" ]; then
            echo "Expected exactly one production Function App hostname." >&2
            exit 1
          fi
          production_function_host="${function_hosts[0]}"
          curl --fail --silent --show-error --max-time 30 \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "https://${production_function_host}/health" > "$RUNNER_TEMP/production-health-before.json"
          jq -e '
            .status == "ok"
            and .environmentName == "prod"
            and (.deployedCommitSha | test("^[0-9a-f]{40}$"))
            and (.deploymentRunId | test("^[0-9]+$"))
          ' "$RUNNER_TEMP/production-health-before.json" >/dev/null
          echo "PRODUCTION_FUNCTION_HOST=$production_function_host" >> "$GITHUB_ENV"
      - name: Preview bounded private-storage preparation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-current-main.mjs
          expected_target_id="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Storage/storageAccounts/${MIGRATION_TARGET_STORAGE_ACCOUNT}"
          az deployment group what-if \
            --name prepare-private-storage-prod \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/prepare-private-storage.bicep \
            --parameters environmentName=prod \
              deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
              wlhCategoryBlobContainer="$WLH_CATEGORY_BLOB_CONTAINER" \
              bringSessionCacheContainer="$BRING_SESSION_CACHE_CONTAINER" \
              bringMutationContainer="$BRING_MUTATION_CONTAINER" \
              bringAuditContainer="$BRING_AUDIT_CONTAINER" \
            --result-format ResourceIdOnly \
            -o json > "$RUNNER_TEMP/private-storage-what-if.json"
          jq -e --arg prefix "${expected_target_id,,}" '
            [(.properties.changes // .changes // [])[]
              | select(.changeType != "Ignore" and .changeType != "NoChange")]
            | all(.[];
                .changeType != "Delete"
                and ((.resourceId // .id // "") | ascii_downcase | startswith($prefix)))
          ' "$RUNNER_TEMP/private-storage-what-if.json" >/dev/null || {
            echo "Private-storage what-if contained an out-of-bound or destructive resource change." >&2
            exit 1
          }
      - name: Provision bounded private-storage boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-current-main.mjs
          deployment_outputs="$(az deployment group create \
            --name prepare-private-storage-prod \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/prepare-private-storage.bicep \
            --parameters environmentName=prod \
              deploymentPrincipalObjectId="$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
              wlhCategoryBlobContainer="$WLH_CATEGORY_BLOB_CONTAINER" \
              bringSessionCacheContainer="$BRING_SESSION_CACHE_CONTAINER" \
              bringMutationContainer="$BRING_MUTATION_CONTAINER" \
              bringAuditContainer="$BRING_AUDIT_CONTAINER" \
            --query properties.outputs \
            -o json)"
          prepared_name="$(jq -r '.privateStorageAccountResourceName.value // empty' <<<"$deployment_outputs")"
          prepared_id="$(jq -r '.privateStorageAccountResourceId.value // empty' <<<"$deployment_outputs")"
          if [ "$prepared_name" != "$MIGRATION_TARGET_STORAGE_ACCOUNT" ] || [ -z "$prepared_id" ]; then
            echo "Shared Bicep resolved an unexpected production private-storage target." >&2
            exit 1
          fi
          {
            echo "PREPARED_PRIVATE_STORAGE_ACCOUNT=$prepared_name"
            echo "PREPARED_PRIVATE_STORAGE_ID=$prepared_id"
          } >> "$GITHUB_ENV"
      - name: Migrate one digest-pinned WLH reference blob
        shell: bash
        run: |
          set -euo pipefail
          migration_dir="$(mktemp -d)"
          source_file="$migration_dir/source.bin"
          target_file="$migration_dir/target.bin"
          az storage blob download \
            --auth-mode login \
            --account-name "$MIGRATION_SOURCE_STORAGE_ACCOUNT" \
            --container-name "$WLH_CATEGORY_BLOB_CONTAINER" \
            --name "$WLH_CATEGORY_BLOB_NAME" \
            --file "$source_file" \
            --overwrite true \
            -o none
          source_digest="$(sha256sum "$source_file" | awk '{print $1}')"
          [ "$source_digest" = "$MIGRATION_EXPECTED_SHA256" ] || {
            echo "Production source blob digest does not match the approved digest." >&2
            exit 1
          }

          target_exists=''
          for _ in $(seq 1 18); do
            if target_exists="$(az storage blob exists \
              --auth-mode login \
              --account-name "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
              --container-name "$WLH_CATEGORY_BLOB_CONTAINER" \
              --name "$WLH_CATEGORY_BLOB_NAME" \
              --query exists \
              -o tsv 2>/dev/null)"; then
              break
            fi
            sleep 10
          done
          if [ "$target_exists" != "true" ] && [ "$target_exists" != "false" ]; then
            echo "Azure RBAC did not become ready for the prepared private container." >&2
            exit 1
          fi
          if [ "$target_exists" = "true" ]; then
            migration_result='already-present'
          else
            node scripts/assert-current-main.mjs
            az storage blob upload \
              --auth-mode login \
              --account-name "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
              --container-name "$WLH_CATEGORY_BLOB_CONTAINER" \
              --name "$WLH_CATEGORY_BLOB_NAME" \
              --file "$source_file" \
              --overwrite false \
              -o none
            migration_result='migrated'
          fi

          az storage blob download \
            --auth-mode login \
            --account-name "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
            --container-name "$WLH_CATEGORY_BLOB_CONTAINER" \
            --name "$WLH_CATEGORY_BLOB_NAME" \
            --file "$target_file" \
            --overwrite true \
            -o none
          target_digest="$(sha256sum "$target_file" | awk '{print $1}')"
          [ "$target_digest" = "$MIGRATION_EXPECTED_SHA256" ] || {
            echo "Prepared target blob digest does not match the approved digest." >&2
            exit 1
          }
          exact_blob_count="$(az storage blob list \
            --auth-mode login \
            --account-name "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
            --container-name "$WLH_CATEGORY_BLOB_CONTAINER" \
            --prefix "$WLH_CATEGORY_BLOB_NAME" \
            --query "[?name=='$WLH_CATEGORY_BLOB_NAME'] | length(@)" \
            -o tsv)"
          [ "$exact_blob_count" = "1" ] || {
            echo "Expected exactly one approved WLH target blob." >&2
            exit 1
          }
          echo "MIGRATION_RESULT=$migration_result" >> "$GITHUB_ENV"
      - name: Verify private-storage policy and unchanged production runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-current-main.mjs
          az storage account show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
            -o json > "$RUNNER_TEMP/private-storage-account.json"
          jq -e '
            .allowBlobPublicAccess == false
            and .allowCrossTenantReplication == false
            and .allowSharedKeyAccess == false
            and .defaultToOAuthAuthentication == true
            and .minimumTlsVersion == "TLS1_2"
            and .publicNetworkAccess == "Enabled"
            and .enableHttpsTrafficOnly == true
            and .sku.name == "Standard_LRS"
            and .kind == "StorageV2"
            and .tags.environment == "prod"
            and .tags.dataBoundary == "prod"
            and .tags.purpose == "private-integration-state"
            and .tags.managedBy == "bicep"
          ' "$RUNNER_TEMP/private-storage-account.json" >/dev/null
          az storage account blob-service-properties show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
            -o json > "$RUNNER_TEMP/private-storage-blob-policy.json"
          jq -e '
            .isVersioningEnabled == true
            and .deleteRetentionPolicy.enabled == true
            and .deleteRetentionPolicy.days == 30
            and .containerDeleteRetentionPolicy.enabled == true
            and .containerDeleteRetentionPolicy.days == 30
          ' "$RUNNER_TEMP/private-storage-blob-policy.json" >/dev/null
          for container in \
            "$WLH_CATEGORY_BLOB_CONTAINER" \
            "$BRING_SESSION_CACHE_CONTAINER" \
            "$BRING_MUTATION_CONTAINER" \
            "$BRING_AUDIT_CONTAINER"; do
            container_id="${PREPARED_PRIVATE_STORAGE_ID}/blobServices/default/containers/${container}"
            public_access="$(az resource show \
              --ids "$container_id" \
              --api-version 2023-05-01 \
              --query properties.publicAccess \
              -o tsv)"
            [ "$public_access" = "None" ] || {
              echo "Prepared private container does not deny public access." >&2
              exit 1
            }
          done
          wlh_container_id="${PREPARED_PRIVATE_STORAGE_ID}/blobServices/default/containers/${WLH_CATEGORY_BLOB_CONTAINER}"
          writer_count="$(az role assignment list \
            --assignee-object-id "$AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" \
            --scope "$wlh_container_id" \
            --query "[?roleDefinitionName=='Storage Blob Data Contributor'] | length(@)" \
            -o tsv)"
          [ "$writer_count" = "1" ] || {
            echo "Prepared WLH container lacks the exact deployment-writer role." >&2
            exit 1
          }

          curl --fail --silent --show-error --max-time 30 \
            --retry 4 --retry-delay 5 --retry-all-errors \
            "https://${PRODUCTION_FUNCTION_HOST}/health" > "$RUNNER_TEMP/production-health-after.json"
          jq -e --slurpfile before "$RUNNER_TEMP/production-health-before.json" '
            .status == "ok"
            and .environmentName == "prod"
            and .deployedCommitSha == $before[0].deployedCommitSha
            and .deployedSourceRef == $before[0].deployedSourceRef
            and .deploymentRunId == $before[0].deploymentRunId
          ' "$RUNNER_TEMP/production-health-after.json" >/dev/null

          jq -n \
            --arg environmentName "$ENVIRONMENT_NAME" \
            --arg sourceRef "$SOURCE_REF" \
            --arg controllerRef "$CONTROLLER_REF" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deliveryCorrelation "$DELIVERY_CORRELATION" \
            --arg ciRunId "$CI_RUN_ID" \
            --arg ciDeliveryCorrelation "$CI_DELIVERY_CORRELATION" \
            --arg testRunId "$TEST_DELIVERY_RUN_ID" \
            --arg testDeliveryCorrelation "$TEST_DELIVERY_CORRELATION" \
            --arg sourceStorageAccount "$MIGRATION_SOURCE_STORAGE_ACCOUNT" \
            --arg targetStorageAccount "$PREPARED_PRIVATE_STORAGE_ACCOUNT" \
            --arg container "$WLH_CATEGORY_BLOB_CONTAINER" \
            --arg blobName "$WLH_CATEGORY_BLOB_NAME" \
            --arg sha256 "$MIGRATION_EXPECTED_SHA256" \
            --arg migrationResult "$MIGRATION_RESULT" \
            --arg runtimeCommit "$(jq -r '.deployedCommitSha' "$RUNNER_TEMP/production-health-after.json")" \
            --arg runtimeRunId "$(jq -r '.deploymentRunId' "$RUNNER_TEMP/production-health-after.json")" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              environmentName: $environmentName,
              sourceRef: $sourceRef,
              controllerRef: $controllerRef,
              repository: $repository,
              runId: $runId,
              runAttempt: $runAttempt,
              deliveryCorrelation: $deliveryCorrelation,
              ciRunId: $ciRunId,
              ciDeliveryCorrelation: $ciDeliveryCorrelation,
              testRunId: $testRunId,
              testDeliveryCorrelation: $testDeliveryCorrelation,
              migration: {
                sourceStorageAccount: $sourceStorageAccount,
                targetStorageAccount: $targetStorageAccount,
                container: $container,
                blobName: $blobName,
                sha256: $sha256,
                result: $migrationResult,
                status: "passed"
              },
              storagePolicyStatus: "passed",
              productionRuntime: {
                status: "unchanged",
                deployedCommitSha: $runtimeCommit,
                deploymentRunId: $runtimeRunId
              },
              verifiedAt: $verifiedAt
            }' > "$RUNNER_TEMP/production-private-storage-evidence.json"
      - name: Upload production private-storage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4
        with:
          name: production-private-storage-${{ inputs.sourceRef }}-${{ inputs.deliveryCorrelation }}
          path: ${{ runner.temp }}/production-private-storage-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Create production preparation issue on failure
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # tag=v8
        with:
          script: |
            const title = `Production private-storage preparation failed for ${context.sha.substring(0, 7)}`;
            const body = [
              'Production private-storage preparation or digest verification failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'No application deployment is authorized by this workflow. Investigate the bounded storage preparation evidence.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['production-failure', 'codex-repair']
            });
