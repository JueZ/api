name: Deploy Environment

on:
  workflow_call:
    inputs:
      environmentName:
        description: Bicep environment name. Use test or prod.
        required: true
        type: string
      azureResourceGroup:
        description: Azure resource group to deploy into.
        required: true
        type: string
      githubEnvironment:
        description: GitHub Environment name used for deployment history and approvals.
        required: true
        type: string
      deployFrontend:
        description: Deploy Angular static files when present.
        required: false
        default: true
        type: boolean
      deployFunctions:
        description: Deploy Azure Functions package when present.
        required: false
        default: true
        type: boolean
      sourceRef:
        description: Immutable 40-character commit SHA from main to deploy.
        required: false
        default: ''
        type: string
      updateProductionVariables:
        description: Report resolved production values after successful smoke tests.
        required: false
        default: false
        type: boolean
      redditShareUrlSmokeEnabled:
        description: Run the optional authenticated Reddit share URL smoke against the configured /s/ URL.
        required: false
        default: false
        type: boolean
    secrets:
      REDDIT_CLIENT_SECRET:
        description: Reddit OAuth client secret for app-only API access.
        required: true
      OPENAI_API_KEY:
        description: Optional OpenAI API key for Repairable Error Contract LLM-assisted diagnostics.
        required: false
      WLH_BASE_URL:
        description: WLH upstream base URL.
        required: true
      BRING_EMAIL:
        description: Bring! technical account email.
        required: true
      BRING_PASSWORD:
        description: Bring! technical account password.
        required: true
    outputs:
      effectiveBaseUrl:
        description: Resolved Function App base URL.
        value: ${{ jobs.deploy.outputs.effectiveBaseUrl }}
      functionAppName:
        description: Resolved Azure Function App name.
        value: ${{ jobs.deploy.outputs.functionAppName }}
      storageAccountName:
        description: Resolved Azure Storage account name.
        value: ${{ jobs.deploy.outputs.storageAccountName }}

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

jobs:
  deploy:
    name: deploy ${{ inputs.environmentName }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.githubEnvironment }}
      url: ${{ steps.resolve.outputs.effective_base_url }}
    outputs:
      effectiveBaseUrl: ${{ steps.resolve.outputs.effective_base_url }}
      functionAppName: ${{ steps.resolve.outputs.function_app_name }}
      storageAccountName: ${{ steps.resolve.outputs.storage_account_name }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ inputs.azureResourceGroup }}
      ENVIRONMENT_NAME: ${{ inputs.environmentName }}
      DEPLOY_FRONTEND: ${{ inputs.deployFrontend }}
      DEPLOY_FUNCTIONS: ${{ inputs.deployFunctions }}
      SOURCE_REF: ${{ inputs.sourceRef }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_STATIC_WEB_STORAGE_ACCOUNT: ${{ vars.AZURE_STATIC_WEB_STORAGE_ACCOUNT }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      DEPLOY_PRODUCTION_ENABLED: ${{ vars.DEPLOY_PRODUCTION_ENABLED }}
      AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      OIDC_REQUIRED_SCOPES: ${{ vars.OIDC_REQUIRED_SCOPES }}
      OIDC_ALLOWED_OBJECT_IDS: ${{ vars.OIDC_ALLOWED_OBJECT_IDS }}
      OIDC_ALLOWED_SUBJECTS: ${{ vars.OIDC_ALLOWED_SUBJECTS }}
      OIDC_ALLOWED_APP_OBJECT_IDS: ${{ vars.OIDC_ALLOWED_APP_OBJECT_IDS }}
      OIDC_ALLOWED_CLIENT_IDS: ${{ vars.OIDC_ALLOWED_CLIENT_IDS }}
      OIDC_ALLOWED_DELEGATED_CLIENT_IDS: ${{ vars.OIDC_ALLOWED_DELEGATED_CLIENT_IDS }}
      OIDC_ALLOWED_TENANTS: ${{ vars.OIDC_ALLOWED_TENANTS }}
      WEB_AUTH_ENABLED: ${{ vars.WEB_AUTH_ENABLED }}
      WEB_AUTH_CLIENT_ID: ${{ vars.WEB_AUTH_CLIENT_ID }}
      WEB_AUTH_AUTHORITY: ${{ vars.WEB_AUTH_AUTHORITY }}
      WEB_AUTH_REDIRECT_URI: ${{ vars.WEB_AUTH_REDIRECT_URI }}
      TEST_WEB_AUTH_REDIRECT_URI: ${{ vars.TEST_WEB_AUTH_REDIRECT_URI }}
      WEB_AUTH_API_SCOPE: ${{ vars.WEB_AUTH_API_SCOPE }}
      WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL }}
      TEST_WEB_API_BASE_URL: ${{ vars.TEST_WEB_API_BASE_URL }}
      REDDIT_CLIENT_ID: ${{ vars.REDDIT_CLIENT_ID }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      REPAIRABLE_ERRORS_LLM_ENABLED: ${{ vars.REPAIRABLE_ERRORS_LLM_ENABLED }}
      REPAIRABLE_ERRORS_LLM_MODEL: ${{ vars.REPAIRABLE_ERRORS_LLM_MODEL }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      WLH_CATEGORY_VERSION: ${{ vars.WLH_CATEGORY_VERSION }}
      WLH_CATEGORY_BLOB_NAME: ${{ vars.WLH_CATEGORY_BLOB_NAME }}
      WLH_CATEGORY_BLOB_CONTAINER: ${{ vars.WLH_CATEGORY_BLOB_CONTAINER }}
      BRING_BASE_URL: ${{ vars.BRING_BASE_URL }}
      BRING_CLIENT_API_KEY: ${{ vars.BRING_CLIENT_API_KEY }}
      BRING_COUNTRY: ${{ vars.BRING_COUNTRY }}
      BRING_DEFAULT_LIST_UUID: ${{ vars.BRING_DEFAULT_LIST_UUID }}
      BRING_SESSION_CACHE_ENABLED: ${{ vars.BRING_SESSION_CACHE_ENABLED }}
      BRING_SESSION_CACHE_CONTAINER: ${{ vars.BRING_SESSION_CACHE_CONTAINER }}
      BRING_SESSION_CACHE_BLOB: ${{ vars.BRING_SESSION_CACHE_BLOB }}
      DEPLOYED_AT_UTC: ${{ github.event.head_commit.timestamp || '' }}
      DEPLOYMENT_RUN_ID: ${{ github.run_id }}
      APPLICATIONINSIGHTS_NAME: ${{ vars.APPLICATIONINSIGHTS_NAME }}
      TEST_SERVICE_AUTH_CLIENT_ID: ${{ vars.TEST_SERVICE_AUTH_CLIENT_ID }}
      TEST_SERVICE_AUTH_TENANT_ID: ${{ vars.TEST_SERVICE_AUTH_TENANT_ID }}
      TEST_SERVICE_AUTH_SCOPE: ${{ vars.TEST_SERVICE_AUTH_SCOPE }}
      PROD_SERVICE_AUTH_CLIENT_ID: ${{ vars.PROD_SERVICE_AUTH_CLIENT_ID }}
      PROD_SERVICE_AUTH_TENANT_ID: ${{ vars.PROD_SERVICE_AUTH_TENANT_ID }}
      PROD_SERVICE_AUTH_SCOPE: ${{ vars.PROD_SERVICE_AUTH_SCOPE }}
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ inputs.sourceRef || github.sha }}
          fetch-depth: 0
      - name: Validate deployment source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_ref="${SOURCE_REF:-${GITHUB_SHA}}"
          resolved_head="$(git rev-parse HEAD)"

          if [[ ! "$deployment_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "sourceRef must be a full 40-character commit SHA from the main branch." >&2
            exit 1
          fi
          if [ "${deployment_ref,,}" != "$resolved_head" ]; then
            echo "sourceRef must resolve exactly to the checked-out commit." >&2
            exit 1
          fi
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$resolved_head" origin/main; then
            echo "sourceRef must point to a commit already present in the main branch history." >&2
            exit 1
          fi
          successful_ci_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${deployment_ref}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "$successful_ci_runs" -lt 1 ]; then
            echo "sourceRef must match a commit that completed CI successfully." >&2
            exit 1
          fi
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            mapfile -t successful_test_run_ids < <(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml/runs?branch=main&head_sha=${deployment_ref}&status=completed&per_page=20" \
              --jq '.workflow_runs[] | select(.conclusion == "success" and (.event == "workflow_run" or .event == "workflow_dispatch")) | .id')
            valid_test_run_id=""
            provenance_dir="$(mktemp -d)"
            for test_run_id in "${successful_test_run_ids[@]}"; do
              rm -rf "${provenance_dir:?}"/*
              if gh run download "$test_run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "deploy-test-provenance-${deployment_ref}" \
                --dir "$provenance_dir" >/dev/null 2>&1; then
                provenance_file="$provenance_dir/deploy-test-provenance.json"
                if [ -f "$provenance_file" ] && jq -e \
                  --arg source_ref "$deployment_ref" \
                  '.environmentName == "test"
                    and .sourceRef == $source_ref
                    and .resolvedHead == $source_ref
                    and .deployFrontend == "true"
                    and .deployFunctions == "true"
                    and (.eventName == "workflow_run" or .eventName == "workflow_dispatch")' \
                  "$provenance_file" >/dev/null; then
                  valid_test_run_id="$test_run_id"
                  break
                fi
              fi
            done
            if [ -z "$valid_test_run_id" ]; then
              echo "Production sourceRef must match a successful Deploy Test run that uploaded matching full-deployment provenance." >&2
              exit 1
            fi
            echo "Validated Deploy Test provenance from run $valid_test_run_id for production sourceRef $deployment_ref."
          fi
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID repository variable is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID repository variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID repository variable is required}"
          : "${AZURE_RESOURCE_GROUP:?azureResourceGroup input is required}"
          case "$ENVIRONMENT_NAME" in
            test|prod) ;;
            *) echo "environmentName must be test or prod." >&2; exit 1 ;;
          esac
          if [ "$ENVIRONMENT_NAME" = "prod" ] && [ "${DEPLOY_PRODUCTION_ENABLED:-false}" != "true" ]; then
            echo "DEPLOY_PRODUCTION_ENABLED must be true for production deployment." >&2
            exit 1
          fi
          : "${AUTH_ENABLED:?AUTH_ENABLED repository variable is required for $ENVIRONMENT_NAME}"
          if [ "$AUTH_ENABLED" != "true" ]; then
            echo "AUTH_ENABLED must be true for $ENVIRONMENT_NAME deployment after the auth milestone." >&2
            exit 1
          fi
          : "${OIDC_ISSUER:?OIDC_ISSUER repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_AUDIENCE:?OIDC_AUDIENCE repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_REQUIRED_SCOPES:?OIDC_REQUIRED_SCOPES repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_ALLOWED_OBJECT_IDS:?OIDC_ALLOWED_OBJECT_IDS repository variable is required for $ENVIRONMENT_NAME}"
          : "${OIDC_ALLOWED_TENANTS:?OIDC_ALLOWED_TENANTS repository variable is required for $ENVIRONMENT_NAME}"
          : "${WLH_BASE_URL:?WLH_BASE_URL environment secret is required for $ENVIRONMENT_NAME}"
          : "${WLH_CATEGORY_BLOB_CONTAINER:?WLH_CATEGORY_BLOB_CONTAINER variable is required for $ENVIRONMENT_NAME}"
          : "${WLH_CATEGORY_BLOB_NAME:?WLH_CATEGORY_BLOB_NAME variable is required for $ENVIRONMENT_NAME}"
          : "${WEB_AUTH_ENABLED:?WEB_AUTH_ENABLED repository variable is required for $ENVIRONMENT_NAME}"
          if [ "$WEB_AUTH_ENABLED" != "true" ]; then
            echo "WEB_AUTH_ENABLED must be true for $ENVIRONMENT_NAME deployment after the auth milestone." >&2
            exit 1
          fi
          : "${WEB_AUTH_CLIENT_ID:?WEB_AUTH_CLIENT_ID repository variable is required for $ENVIRONMENT_NAME}"
          : "${WEB_AUTH_AUTHORITY:?WEB_AUTH_AUTHORITY repository variable is required for $ENVIRONMENT_NAME}"
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            : "${WEB_AUTH_REDIRECT_URI:?WEB_AUTH_REDIRECT_URI repository variable is required for production}"
          fi
          : "${WEB_AUTH_API_SCOPE:?WEB_AUTH_API_SCOPE repository variable is required for $ENVIRONMENT_NAME}"
          : "${REDDIT_CLIENT_ID:?REDDIT_CLIENT_ID environment variable is required for $ENVIRONMENT_NAME}"
          : "${REDDIT_USER_AGENT:?REDDIT_USER_AGENT environment variable is required for $ENVIRONMENT_NAME}"
          if [ "${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" = "true" ]; then
            : "${REPAIRABLE_ERRORS_LLM_MODEL:?REPAIRABLE_ERRORS_LLM_MODEL repository variable is required when Repairable Error LLM diagnostics are enabled}"
          fi
      - name: Azure OIDC login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # tag=v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Build deployable artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm run build --if-present
            npm run build:api --if-present
            npm run build:functions --if-present
          else
            echo "No root package.json found; skipping application artifact build."
          fi
      - name: Deploy Bicep infrastructure
        id: infra
        shell: bash
        env:
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${REDDIT_CLIENT_SECRET:?REDDIT_CLIENT_SECRET environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_EMAIL:?BRING_EMAIL environment secret is required for $ENVIRONMENT_NAME}"
          : "${BRING_PASSWORD:?BRING_PASSWORD environment secret is required for $ENVIRONMENT_NAME}"
          openai_secret_name='OPENAI_API_KEY'
          openai_credential=""
          if [ "${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" = "true" ]; then
            if [ -z "${!openai_secret_name:-}" ]; then
              echo "OpenAI repository secret is required when Repairable Error LLM diagnostics are enabled." >&2
              exit 1
            fi
            openai_credential="${!openai_secret_name}"
          fi
          if [ -f infra/main.bicep ]; then
            api_cors_redirect_uri=""
            if [ "$ENVIRONMENT_NAME" = "prod" ]; then
              api_cors_redirect_uri="${WEB_AUTH_REDIRECT_URI:-}"
            else
              api_cors_redirect_uri="${TEST_WEB_AUTH_REDIRECT_URI:-}"
            fi
            api_cors_allowed_origins=""
            if [ -n "$api_cors_redirect_uri" ]; then
              api_cors_allowed_origins="$(API_CORS_REDIRECT_URI="$api_cors_redirect_uri" node --input-type=module --eval "process.stdout.write(new URL(process.env.API_CORS_REDIRECT_URI).origin)")"
            fi

            deployment_outputs=$(az deployment group create \
              --name "main-${ENVIRONMENT_NAME}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters environmentName="$ENVIRONMENT_NAME" \
                authEnabled="${AUTH_ENABLED:-false}" \
                oidcIssuer="${OIDC_ISSUER:-}" \
                oidcAudience="${OIDC_AUDIENCE:-}" \
                oidcRequiredScopes="${OIDC_REQUIRED_SCOPES:-api.access}" \
                oidcAllowedObjectIds="${OIDC_ALLOWED_OBJECT_IDS:-}" \
                oidcAllowedSubjects="${OIDC_ALLOWED_SUBJECTS:-}" \
                oidcAllowedAppObjectIds="${OIDC_ALLOWED_APP_OBJECT_IDS:-}" \
                oidcAllowedClientIds="${OIDC_ALLOWED_CLIENT_IDS:-}" \
                oidcAllowedDelegatedClientIds="${OIDC_ALLOWED_DELEGATED_CLIENT_IDS:-}" \
                oidcAllowedTenants="${OIDC_ALLOWED_TENANTS:-}" \
                redditClientId="${REDDIT_CLIENT_ID:-}" \
                redditOAuthSecret="${REDDIT_CLIENT_SECRET:-}" \
                redditUserAgent="${REDDIT_USER_AGENT:-}" \
                bringBaseUrl="${BRING_BASE_URL:-https://api.getbring.com/rest/}" \
                bringClientApiKey="${BRING_CLIENT_API_KEY:-}" \
                bringCountry="${BRING_COUNTRY:-AT}" \
                bringEmail="$BRING_EMAIL" \
                bringPassword="$BRING_PASSWORD" \
                bringDefaultListUuid="${BRING_DEFAULT_LIST_UUID:-}" \
                bringSessionCacheEnabled="${BRING_SESSION_CACHE_ENABLED:-true}" \
                bringSessionCacheContainer="${BRING_SESSION_CACHE_CONTAINER:-bring-private}" \
                bringSessionCacheBlob="${BRING_SESSION_CACHE_BLOB:-session-v1.json}" \
            wlhBaseUrl="${WLH_BASE_URL:-}" \
            wlhCategoryBlobContainer="${WLH_CATEGORY_BLOB_CONTAINER:-wlh-reference}" \
            wlhCategoryBlobName="${WLH_CATEGORY_BLOB_NAME:-categories-marketplace.v1.json.gz}" \
                openAiCredential="$openai_credential" \
                repairableErrorsLlmEnabled="${REPAIRABLE_ERRORS_LLM_ENABLED:-false}" \
                repairableErrorsLlmModel="${REPAIRABLE_ERRORS_LLM_MODEL:-}" \
                apiCorsAllowedOrigins="$api_cors_allowed_origins" \
              --query properties.outputs \
              -o json)

            {
              echo "function_app_name=$(jq -r '.functionAppResourceName.value // empty' <<< "$deployment_outputs")"
              echo "storage_account_name=$(jq -r '.storageAccountResourceName.value // empty' <<< "$deployment_outputs")"
              echo "application_insights_name=$(jq -r '.applicationInsightsResourceName.value // empty' <<< "$deployment_outputs")"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No infra/main.bicep found; skipping infrastructure deployment."
          fi
      - name: Resolve runtime settings
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          effective_functionapp_name="${{ steps.infra.outputs.function_app_name }}"
          effective_storage_account="${{ steps.infra.outputs.storage_account_name }}"
          effective_app_insights="${{ steps.infra.outputs.application_insights_name }}"

          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            effective_functionapp_name="${effective_functionapp_name:-${AZURE_FUNCTIONAPP_NAME:-}}"
            effective_storage_account="${effective_storage_account:-${AZURE_STATIC_WEB_STORAGE_ACCOUNT:-}}"
            effective_base_url="${PRODUCTION_BASE_URL:-}"
            effective_app_insights="${effective_app_insights:-${APPLICATIONINSIGHTS_NAME:-}}"
          else
            effective_base_url=""
          fi

          : "${effective_functionapp_name:?Function App name could not be resolved}"
          : "${effective_storage_account:?Storage account name could not be resolved}"

          effective_frontend_url=""
          if [ -n "$effective_storage_account" ]; then
            effective_frontend_url="$(az storage account show --resource-group "$AZURE_RESOURCE_GROUP" --name "$effective_storage_account" --query primaryEndpoints.web -o tsv 2>/dev/null || true)"
            effective_frontend_url="${effective_frontend_url%/}"
          fi

          if [ -z "$effective_base_url" ]; then
            default_host_name=$(az functionapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$effective_functionapp_name" \
              --query defaultHostName \
              -o tsv)
            : "${default_host_name:?Unable to discover Function App default hostname}"
            effective_base_url="https://$default_host_name"
          fi

          {
            echo "EFFECTIVE_FUNCTIONAPP_NAME=$effective_functionapp_name"
            echo "EFFECTIVE_STORAGE_ACCOUNT=$effective_storage_account"
            echo "EFFECTIVE_BASE_URL=$effective_base_url"
            echo "FRONTEND_BASE_URL=$effective_frontend_url"
            echo "EFFECTIVE_APPLICATIONINSIGHTS_NAME=$effective_app_insights"
          } >> "$GITHUB_ENV"

          {
            echo "function_app_name=$effective_functionapp_name"
            echo "storage_account_name=$effective_storage_account"
            echo "effective_base_url=$effective_base_url"
            echo "frontend_base_url=$effective_frontend_url"
            echo "application_insights_name=$effective_app_insights"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Effective $ENVIRONMENT_NAME deployment settings"
            echo "- Base URL: $effective_base_url"
            echo "- Function App name: $effective_functionapp_name"
            echo "- Static web storage account: $effective_storage_account"
            echo "- Resource group: $AZURE_RESOURCE_GROUP"
            echo "- Source ref: ${SOURCE_REF:-${GITHUB_SHA}}"
            echo "- Application Insights: ${effective_app_insights:-<not resolved>}"
            echo "- Frontend URL: ${effective_frontend_url:-<not resolved>}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package and deploy Azure Functions
        if: ${{ inputs.deployFunctions }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/api/host.json ]; then
            : "${EFFECTIVE_FUNCTIONAPP_NAME:?EFFECTIVE_FUNCTIONAPP_NAME is required when Azure Functions are present}"
            : "${EFFECTIVE_STORAGE_ACCOUNT:?EFFECTIVE_STORAGE_ACCOUNT is required for run-from-package deployment}"
            : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

            package_dir="$RUNNER_TEMP/function-package"
            rm -rf "$package_dir" "$RUNNER_TEMP/functionapp.zip"
            mkdir -p "$package_dir"

            cp apps/api/host.json apps/api/package.json apps/api/package-lock.json "$package_dir/"
            cp -R apps/api/dist "$package_dir/dist"

            npm ci --omit=dev --ignore-scripts --prefix "$package_dir"

            (cd "$package_dir" && zip -r "$RUNNER_TEMP/functionapp.zip" .)

            release_container="function-releases"
            release_blob="functionapp-${GITHUB_SHA}-${GITHUB_RUN_ID}.zip"

            az storage container create \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --name "$release_container" \
              --public-access off \
              -o none
            az storage blob upload \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --container-name "$release_container" \
              --name "$release_blob" \
              --file "$RUNNER_TEMP/functionapp.zip" \
              --overwrite true \
              -o none

            package_url="https://$EFFECTIVE_STORAGE_ACCOUNT.blob.core.windows.net/$release_container/$release_blob"
            deployed_at_utc="${DEPLOYED_AT_UTC:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"

            az functionapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$EFFECTIVE_FUNCTIONAPP_NAME" \
              --settings \
                WEBSITE_RUN_FROM_PACKAGE="$package_url" \
                WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned \
                DEPLOYED_COMMIT_SHA="$(git rev-parse HEAD)" \
                DEPLOYED_SOURCE_REF="${SOURCE_REF:-${GITHUB_SHA}}" \
                DEPLOYMENT_RUN_ID="$GITHUB_RUN_ID" \
                DEPLOYED_ENVIRONMENT_NAME="$ENVIRONMENT_NAME" \
                DEPLOYED_AT_UTC="$deployed_at_utc" \
                BUILD_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              -o none
            function_app_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$EFFECTIVE_FUNCTIONAPP_NAME"
            az rest \
              --method post \
              --url "https://management.azure.com${function_app_id}/restart?api-version=2023-12-01" \
              --body '{}' \
              -o none
            for attempt in {1..12}; do
              if az rest \
                --method post \
                --url "https://management.azure.com${function_app_id}/syncfunctiontriggers?api-version=2023-12-01" \
                --body '{}' \
                -o none; then
                echo "Function trigger sync succeeded on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Function trigger sync failed after 12 attempts." >&2
                exit 1
              fi
              echo "Function trigger sync not ready yet (attempt $attempt/12). Retrying in 10s..."
              sleep 10
            done
          else
            echo "No Azure Functions host.json found; skipping Functions deployment."
          fi
      - name: Deploy Angular static site with Azure OIDC
        if: ${{ inputs.deployFrontend }}
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './node_modules' -prune -o -name angular.json -print -quit | grep -q .; then
            : "${EFFECTIVE_STORAGE_ACCOUNT:?EFFECTIVE_STORAGE_ACCOUNT is required when Angular is present}"
            output_dir=$(find . -path './node_modules' -prune -o -path '*/dist/*' -type f -name index.html -print -quit | xargs -r dirname)
            if [ -z "${output_dir:-}" ]; then
              echo "No Angular dist index.html found after build."
              exit 1
            fi
            mkdir -p "$output_dir/assets"
            if [ "$ENVIRONMENT_NAME" = "prod" ]; then
              effective_web_api_base_url="${WEB_API_BASE_URL:-$EFFECTIVE_BASE_URL}"
              effective_web_redirect_uri="${WEB_AUTH_REDIRECT_URI:-}"
              : "${effective_web_redirect_uri:?WEB_AUTH_REDIRECT_URI is required for production frontend auth}"
            else
              effective_web_api_base_url="${TEST_WEB_API_BASE_URL:-$EFFECTIVE_BASE_URL}"
              effective_web_redirect_uri="${TEST_WEB_AUTH_REDIRECT_URI:-}"
            fi
            export EFFECTIVE_WEB_API_BASE_URL="$effective_web_api_base_url"
            export EFFECTIVE_WEB_REDIRECT_URI="$effective_web_redirect_uri"
            export EFFECTIVE_DEPLOYED_AT_UTC="${DEPLOYED_AT_UTC:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
            node --input-type=module --eval "const config={authEnabled:process.env.WEB_AUTH_ENABLED==='true',authClientId:process.env.WEB_AUTH_CLIENT_ID||'',authAuthority:process.env.WEB_AUTH_AUTHORITY||'',authRedirectUri:process.env.EFFECTIVE_WEB_REDIRECT_URI||'',authApiScope:process.env.WEB_AUTH_API_SCOPE||'',apiBaseUrl:process.env.EFFECTIVE_WEB_API_BASE_URL||'',deployedCommitSha:(process.env.SOURCE_REF||process.env.GITHUB_SHA||'').toLowerCase(),environmentName:process.env.ENVIRONMENT_NAME||'unknown',deploymentRunId:process.env.GITHUB_RUN_ID||'unknown',deployedAtUtc:process.env.EFFECTIVE_DEPLOYED_AT_UTC||'unknown'}; process.stdout.write('window.API_CATALOGUE_CONFIG = '+JSON.stringify(config)+';\n');" > "$output_dir/assets/config.js"
            jq -n --arg deployedCommitSha "${SOURCE_REF:-${GITHUB_SHA}}" --arg environmentName "$ENVIRONMENT_NAME" --arg deploymentRunId "$GITHUB_RUN_ID" --arg deployedAtUtc "$EFFECTIVE_DEPLOYED_AT_UTC" '{service:"api-catalogue-web", deployedCommitSha:($deployedCommitSha|ascii_downcase), environmentName:$environmentName, deploymentRunId:$deploymentRunId, deployedAtUtc:$deployedAtUtc}' > "$output_dir/assets/build-info.json"
            az storage blob service-properties update \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --static-website true \
              --index-document index.html \
              -o none
            az storage blob upload-batch \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --destination '$web' \
              --source "$output_dir" \
              --overwrite
          else
            echo "No angular.json found; skipping Angular static site deployment."
          fi
      - name: Run runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          : "${EFFECTIVE_BASE_URL:?EFFECTIVE_BASE_URL is required for smoke tests}"
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          smoke_run_id="smoke-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SMOKE_RUN_ID=$smoke_run_id" >> "$GITHUB_ENV"
          export API_BASE_URL="$EFFECTIVE_BASE_URL"
          export EXPECTED_DEPLOYED_COMMIT_SHA="${SOURCE_REF:-${GITHUB_SHA}}"
          export ENVIRONMENT_NAME
          export RUNTIME_HEALTH_RETRY_ATTEMPTS="${RUNTIME_HEALTH_RETRY_ATTEMPTS:-60}"
          export RUNTIME_HEALTH_RETRY_DELAY_MS="${RUNTIME_HEALTH_RETRY_DELAY_MS:-5000}"
          export SMOKE_RUN_ID="$smoke_run_id"
          export AUTH_ENABLED
          if [ "${DEPLOY_FRONTEND:-false}" = "true" ] && [ -n "${FRONTEND_BASE_URL:-}" ]; then export FRONTEND_BASE_URL; fi
          npm run --silent ops:smoke | tee "$smoke_dir/runtime-smoke.json"
          echo "SMOKE_RESULTS_PATH=$smoke_dir/runtime-smoke.json" >> "$GITHUB_ENV"

          api_cors_redirect_uri=""
          if [ "$ENVIRONMENT_NAME" = "prod" ]; then
            api_cors_redirect_uri="${WEB_AUTH_REDIRECT_URI:-}"
          else
            api_cors_redirect_uri="${TEST_WEB_AUTH_REDIRECT_URI:-}"
          fi
          api_cors_origin=""
          if [ -n "$api_cors_redirect_uri" ]; then
            api_cors_origin="$(API_CORS_REDIRECT_URI="$api_cors_redirect_uri" node --input-type=module --eval "process.stdout.write(new URL(process.env.API_CORS_REDIRECT_URI).origin)")"
            headers_file="$RUNNER_TEMP/api-cors-preflight-headers.txt"
            preflight_ok=false
            for attempt in {1..12}; do
              preflight_status=$(curl --show-error --silent --output /dev/null --dump-header "$headers_file" --write-out '%{http_code}' --max-time 20 \
                -X OPTIONS "$EFFECTIVE_BASE_URL/api/hello" \
                -H "Origin: $api_cors_origin" \
                -H "Access-Control-Request-Method: GET" \
                -H "Access-Control-Request-Headers: authorization")
              allow_origin_header="$(tr -d '\r' < "$headers_file" | awk 'BEGIN { IGNORECASE=1 } /^access-control-allow-origin:/ { sub(/^[^:]*:[[:space:]]*/, ""); value=$0 } END { print value }')"
              if { [ "$preflight_status" = "204" ] || [ "$preflight_status" = "200" ]; } && { [ "$allow_origin_header" = "*" ] || [ "$allow_origin_header" = "$api_cors_origin" ]; }; then
                preflight_ok=true
                break
              fi
              echo "Waiting for CORS preflight to allow $api_cors_origin (attempt $attempt/12, status $preflight_status)."
              sleep 5
            done
            if [ "$preflight_ok" != "true" ]; then
              echo "Expected CORS preflight for /api/hello to allow origin $api_cors_origin; got status $preflight_status and allow-origin '${allow_origin_header:-<missing>}'." >&2
              exit 1
            fi
          fi

          {
            echo "### Runtime smoke tests passed"
            echo "- $EFFECTIVE_BASE_URL/health reported ${SOURCE_REF:-${GITHUB_SHA}}"
            echo "- Unauthenticated /api/hello auth gate verified"
            if [ -n "$api_cors_origin" ]; then
              echo "- $EFFECTIVE_BASE_URL/api/hello CORS preflight allowed $api_cors_origin"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mint authenticated smoke token with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          export ENVIRONMENT_NAME
          export REQUIRE_AUTH_SMOKE=$([ "$ENVIRONMENT_NAME" = "prod" ] && echo true || echo false)
          npm run --silent ops:mint-smoke-token
      - name: Run authenticated smoke tests
        shell: bash
        continue-on-error: ${{ inputs.environmentName != 'prod' }}
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          export API_BASE_URL="$EFFECTIVE_BASE_URL"
          export EXPECTED_DEPLOYED_COMMIT_SHA="${SOURCE_REF:-${GITHUB_SHA}}"
          export ENVIRONMENT_NAME
          export SMOKE_RUN_ID
          export REQUIRE_AUTH_SMOKE=$([ "$ENVIRONMENT_NAME" = "prod" ] && echo true || echo false)
          export REDDIT_SHARE_URL_SMOKE_ENABLED="${{ inputs.redditShareUrlSmokeEnabled && 'true' || 'false' }}"
          export REDDIT_SHARE_URL_SMOKE_URL="https://www.reddit.com/r/macbookpro/s/nnlryuZCNX"
          export REDDIT_SHARE_URL_SMOKE_EXPECTED_POST_ID="1tryldy"
          npm run --silent ops:smoke:auth | tee "$smoke_dir/auth-smoke.json"
          echo "AUTH_SMOKE_RESULTS_PATH=$smoke_dir/auth-smoke.json" >> "$GITHUB_ENV"
      - name: Run telemetry gate
        shell: bash
        continue-on-error: ${{ inputs.environmentName != 'prod' }}
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          export APPLICATIONINSIGHTS_NAME="${EFFECTIVE_APPLICATIONINSIGHTS_NAME:-${APPLICATIONINSIGHTS_NAME:-}}"
          export AZURE_RESOURCE_GROUP
          export ENVIRONMENT_NAME
          export SMOKE_RUN_ID
          export REQUIRE_TELEMETRY_CHECK=$([ "$ENVIRONMENT_NAME" = "prod" ] && echo true || echo false)
          export TELEMETRY_REQUIRE_SMOKE_CORRELATION=$([ "$ENVIRONMENT_NAME" = "prod" ] && echo true || echo false)
          export TELEMETRY_TIMESPAN_MINUTES=45
          export TELEMETRY_RESULTS_PATH="$smoke_dir/telemetry.json"
          npm run --silent ops:check-telemetry
          echo "TELEMETRY_RESULTS_PATH=$smoke_dir/telemetry.json" >> "$GITHUB_ENV"
      - name: Write release ledger
        shell: bash
        if: ${{ always() }}
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP:-.}/smoke"
          mkdir -p "$smoke_dir"
          export API_BASE_URL="${EFFECTIVE_BASE_URL:-}"
          export FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-}"
          export EXPECTED_DEPLOYED_COMMIT_SHA="${SOURCE_REF:-${GITHUB_SHA}}"
          export DEPLOYED_SOURCE_REF="${SOURCE_REF:-${GITHUB_SHA}}"
          export ENVIRONMENT_NAME
          export EFFECTIVE_FUNCTIONAPP_NAME="${EFFECTIVE_FUNCTIONAPP_NAME:-}"
          export SMOKE_RUN_ID="${SMOKE_RUN_ID:-smoke-${ENVIRONMENT_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          export RELEASE_LEDGER_PATH="$smoke_dir/release-ledger-${ENVIRONMENT_NAME}.json"
          npm run --silent ops:write-release-ledger -- "$RELEASE_LEDGER_PATH"
          npm run --silent ops:validate-release-ledger -- "$RELEASE_LEDGER_PATH"
          echo "RELEASE_LEDGER_PATH=$RELEASE_LEDGER_PATH" >> "$GITHUB_ENV"
      - name: Upload release ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4
        with:
          name: release-ledger-${{ inputs.environmentName }}-${{ inputs.sourceRef || github.sha }}
          path: ${{ runner.temp }}/smoke/release-ledger-${{ inputs.environmentName }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Record test deployment provenance
        if: ${{ inputs.environmentName == 'test' && success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          jq -n \
            --arg environmentName "$ENVIRONMENT_NAME" \
            --arg sourceRef "${SOURCE_REF:-${GITHUB_SHA}}" \
            --arg resolvedHead "$(git rev-parse HEAD)" \
            --arg deployFrontend "$DEPLOY_FRONTEND" \
            --arg deployFunctions "$DEPLOY_FUNCTIONS" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{
              environmentName: $environmentName,
              sourceRef: $sourceRef,
              resolvedHead: $resolvedHead,
              deployFrontend: $deployFrontend,
              deployFunctions: $deployFunctions,
              eventName: $eventName,
              workflow: $workflow,
              repository: $repository,
              runId: $runId,
              runAttempt: $runAttempt
            }' > .github/deploy-test-provenance.json
      - name: Upload test deployment provenance
        if: ${{ inputs.environmentName == 'test' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag=v4
        with:
          name: deploy-test-provenance-${{ inputs.sourceRef || github.sha }}
          path: .github/deploy-test-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Report production deployment values after smoke tests
        if: ${{ inputs.updateProductionVariables }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Production deployment values"
            echo "- PRODUCTION_BASE_URL: $EFFECTIVE_BASE_URL"
            echo "- AZURE_FUNCTIONAPP_NAME: $EFFECTIVE_FUNCTIONAPP_NAME"
            echo "- AZURE_STATIC_WEB_STORAGE_ACCOUNT: $EFFECTIVE_STORAGE_ACCOUNT"
            echo ""
            echo "Repository variables are treated as operator-provided defaults and are not mutated by the workflow token."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Production values resolved::Smoke tests passed for $EFFECTIVE_BASE_URL using Function App $EFFECTIVE_FUNCTIONAPP_NAME and storage account $EFFECTIVE_STORAGE_ACCOUNT."
      - name: Create production issue on failed deploy or smoke
        if: ${{ failure() && inputs.environmentName == 'prod' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # tag=v8
        with:
          script: |
            const title = `Production deployment failed for ${context.sha.substring(0, 7)}`;
            const body = [
              'Production deployment or smoke tests failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Automation must fail closed. Investigate logs and create a bounded repair PR if safe.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['production-failure', 'codex-repair']
            });
