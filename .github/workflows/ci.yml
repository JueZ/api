name: CI
run-name: CI ${{ github.sha }} ${{ inputs.delivery_correlation || github.run_id }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delivery_correlation:
        description: Unique delivery-controller correlation value.
        required: false
        type: string
      validation_profile:
        description: Protected Main Delivery may request exact-head runtime-neutral validation reuse.
        required: false
        default: full
        type: choice
        options:
          - full
          - runtime-neutral-reuse
      source_pr_number:
        description: Exact merged pull request for protected validation reuse.
        required: false
        type: string
      source_pr_head_sha:
        description: Fully validated pull-request head for protected validation reuse.
        required: false
        type: string
      governance_run_id:
        description: Trusted exact-head governance workflow run for validation reuse.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-profile:
    name: validation profile
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      profile: ${{ steps.reuse.outputs.profile || steps.full.outputs.profile }}
      reason: ${{ steps.reuse.outputs.reason || steps.full.outputs.reason }}
    steps:
      - name: Select full validation
        id: full
        if: inputs.validation_profile != 'runtime-neutral-reuse'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'profile=full'
            echo 'reason=full-validation-required'
          } >> "$GITHUB_OUTPUT"
      - name: Checkout protected exact-main verifier
        if: inputs.validation_profile == 'runtime-neutral-reuse'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          persist-credentials: false
      - name: Setup Node.js for protected verifier
        if: inputs.validation_profile == 'runtime-neutral-reuse'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install protected verifier dependencies
        if: inputs.validation_profile == 'runtime-neutral-reuse'
        shell: bash
        run: npm ci --ignore-scripts
      - name: Verify trusted exact-main validation reuse
        id: reuse
        if: inputs.validation_profile == 'runtime-neutral-reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-main-ci-profile.mjs \
            --repository "${{ github.repository }}" \
            --main-sha "${{ github.sha }}" \
            --pr "${{ inputs.source_pr_number }}" \
            --pr-head-sha "${{ inputs.source_pr_head_sha }}" \
            --governance-run-id "${{ inputs.governance_run_id }}"
      - name: Summarize validation profile
        if: always()
        shell: bash
        env:
          RESOLVED_PROFILE: ${{ steps.reuse.outputs.profile || steps.full.outputs.profile }}
          RESOLVED_REASON: ${{ steps.reuse.outputs.reason || steps.full.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo '### CI validation profile'
            echo "- Profile: ${RESOLVED_PROFILE:-invalid}"
            echo "- Reason: ${RESOLVED_REASON:-verification-failed}"
          } >> "$GITHUB_STEP_SUMMARY"

  install:
    name: install
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

  lint:
    name: lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/eslint apps scripts --max-warnings 0
          ./node_modules/.bin/prettier --check .

  type-check:
    name: type-check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run type check
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json --noEmit
          ./node_modules/.bin/ng build --configuration development --no-progress

  unit-tests:
    name: unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          node --test apps/api/test/*.test.mjs apps/web/test/*.test.mjs scripts/test/*.test.mjs

  api-tests:
    name: API tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run API tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          node --test apps/api/test/*.test.mjs

  angular-build:
    name: Angular build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Angular app
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/ng build --configuration production --no-progress

  azure-functions-build:
    name: Azure Functions build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Azure Functions app
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json

  openapi-validation:
    name: OpenAPI validation
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate OpenAPI documents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < <(find . -path './node_modules' -prune -o -type f \( -iname '*openapi*.yml' -o -iname '*openapi*.yaml' -o -iname '*openapi*.json' \) -print)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No OpenAPI document found; OpenAPI validation is not applicable yet."
            exit 0
          fi
          for spec in "${specs[@]}"; do
            echo "Validating $spec"
            ./node_modules/.bin/redocly lint "$spec"
          done
      - name: Check OpenAPI route drift
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-openapi-route-drift.mjs
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          node scripts/check-operation-contract-drift.mjs

  bicep-validation:
    name: Bicep validation
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - name: Setup Azure CLI
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # tag=v2
        with:
          inlineScript: az version
      - name: Validate Bicep files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bicep_files < <(find . -type f -name '*.bicep' -print)
          if [ "${#bicep_files[@]}" -eq 0 ]; then
            echo "No Bicep files found; Bicep validation is not applicable yet."
            exit 0
          fi
          az bicep install
          for file in "${bicep_files[@]}"; do
            echo "Building $file"
            az bicep build --file "$file" --stdout >/dev/null
          done

  workflow-and-shell-lint:
    name: workflow and shell lint
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # tag=v6
        with:
          go-version: 'stable'
          cache: false
      - name: Install pinned actionlint
        shell: bash
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows and embedded shell
        shell: bash
        run: actionlint -shellcheck=shellcheck
      - name: Validate standalone shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts -type f -name '*.sh' -print0)
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

  architecture-validation:
    name: architecture and agent validation
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check dependency directions
        run: node scripts/check-architecture.mjs
      - name: Validate repository agent skills
        run: node scripts/validate-agent-skills.mjs
      - name: Validate versioned agent learning
        run: |
          node scripts/agent-learning/validate-artifacts.mjs
          node scripts/agent-learning/verify-artifacts.mjs --github
          node scripts/agent-learning/generate-index.mjs --check
          node scripts/agent-learning/verify-program-evidence.mjs offline
          node scripts/agent-learning/check-memory-freshness.mjs
          node --test scripts/test/agent-learning-memory.test.mjs
      - name: Validate historical agent-task harness
        run: |
          node scripts/agent-task-evals/validate.mjs
          node --test scripts/agent-task-evals/test/harness.test.mjs
      - name: Run deterministic agent safety evals
        run: |
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          node scripts/run-agent-evals.mjs
      - name: Check generated operation catalogue
        run: |
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          node scripts/generate-operation-docs.mjs --check

  security-scan:
    name: security scan
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - name: Scan workspace with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag=v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: secret scan
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          fetch-depth: 0
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # tag=v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: dependency audit
    if: inputs.validation_profile != 'runtime-neutral-reuse'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          elif [ -f package.json ]; then
            npm install --package-lock-only --ignore-scripts
            npm audit --audit-level=high
          else
            echo "No package files found; dependency audit is not applicable yet."
          fi

  release-artifacts:
    name: release artifacts
    timeout-minutes: 25
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Build the immutable release bundle once
        shell: bash
        env:
          SOURCE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/ng build --configuration production --no-progress
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          bash scripts/build-release-artifacts.sh "$RUNNER_TEMP/release"
          node scripts/verify-release-artifacts.mjs "$RUNNER_TEMP/release" "$GITHUB_SHA"
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
  attest-release-artifacts:
    name: attest release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: release-artifacts
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download immutable release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag=v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Attest release artifacts on main
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # tag=v2
        with:
          subject-path: |
            ${{ runner.temp }}/release/functionapp.zip
            ${{ runner.temp }}/release/frontend.tar.gz
            ${{ runner.temp }}/release/sbom.cdx.json

  ci-complete:
    name: CI complete
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - validation-profile
      - install
      - lint
      - type-check
      - unit-tests
      - api-tests
      - angular-build
      - azure-functions-build
      - openapi-validation
      - bicep-validation
      - workflow-and-shell-lint
      - architecture-validation
      - security-scan
      - secret-scan
      - dependency-audit
      - release-artifacts
    if: always()
    steps:
      - name: Verify all required CI jobs passed
        shell: bash
        run: |
          set -euo pipefail
          results='${{ toJson(needs) }}'
          profile='${{ needs.validation-profile.outputs.profile }}'
          echo "$results"
          if [ "$profile" = 'runtime-neutral-reuse' ] &&
             echo "$results" | jq -e '
               .["validation-profile"].result == "success"
               and (to_entries | all(
                 if .key == "validation-profile"
                 then .value.result == "success"
                 else .value.result == "skipped"
                 end
               ))' >/dev/null; then
            echo "Trusted exact-main validation reuse passed; every full-validation job was explicitly not applicable."
          elif [ "$profile" = 'full' ] &&
               echo "$results" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            echo "All full CI checks passed."
          else
            echo "CI results do not match the verified validation profile."
            exit 1
          fi
