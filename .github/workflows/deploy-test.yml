name: Deploy Test
run-name: Deploy Test ${{ inputs.commit_sha || github.sha }} ${{ inputs.delivery_correlation || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA on main to deploy to test. Defaults to the selected ref SHA.
        required: false
        type: string
      deploy_frontend:
        description: Deploy Angular static files.
        required: false
        default: true
        type: boolean
      deploy_functions:
        description: Deploy Azure Functions package.
        required: false
        default: true
        type: boolean
      reddit_share_url_smoke:
        description: Run optional authenticated Reddit /s/ share URL smoke after deployment.
        required: false
        default: false
        type: boolean
      delivery_correlation:
        description: Unique delivery-controller correlation value.
        required: true
        type: string
      ci_run_id:
        description: Exact successful first-attempt main CI run that produced the release bundle.
        required: true
        type: string
      ci_delivery_correlation:
        description: Exact correlation in the selected main CI run title.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy-test:
    name: deploy test
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
      BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
      BRING_CLIENT_API_KEY: ${{ secrets.BRING_CLIENT_API_KEY }}
      BRING_CONFIRMATION_HMAC_KEY: ${{ secrets.BRING_CONFIRMATION_HMAC_KEY }}
      BRING_MUTATION_ENCRYPTION_KEY: ${{ secrets.BRING_MUTATION_ENCRYPTION_KEY }}
    with:
      environmentName: test
      azureResourceGroup: rg-api-test
      githubEnvironment: test
      deployFrontend: ${{ inputs.deploy_frontend }}
      deployFunctions: ${{ inputs.deploy_functions }}
      sourceRef: ${{ inputs.commit_sha || github.sha }}
      controllerRef: ${{ github.sha }}
      controllerWorkflowSha: ${{ github.workflow_sha }}
      redditShareUrlSmokeEnabled: ${{ inputs.reddit_share_url_smoke }}
      deliveryCorrelation: ${{ inputs.delivery_correlation }}
      ciRunId: ${{ inputs.ci_run_id }}
      ciDeliveryCorrelation: ${{ inputs.ci_delivery_correlation }}
