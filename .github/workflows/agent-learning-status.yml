name: Agent Learning Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate concise learning artifacts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate artifacts and deterministic index
        run: npm run agent:learning:validate
