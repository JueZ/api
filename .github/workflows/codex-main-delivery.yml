name: Codex Main Delivery
run-name: Deliver main ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI, Codex Auto-Merge]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: main-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: >-
      ${{
        github.event.workflow_run.name == 'Codex Auto-Merge' &&
        'run main delivery after Codex auto-merge' ||
        'run main delivery after successful push CI'
      }}
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (
          (
            github.event.workflow_run.name == 'CI' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
          ) ||
          (
            github.event.workflow_run.name == 'Codex Auto-Merge' &&
            github.event.workflow_run.event == 'pull_request_target'
          )
        )
      }}
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted delivery controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact main CI and gated delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_dispatch() {
            local workflow_file="$1"
            local expected_title="$2"
            local started_at="$3"
            local expected_head="$4"
            local expected_workflow_name="$5"
            local expected_path=".github/workflows/$workflow_file"
            local runs_json=""
            local matches_json=""
            local run_json=""
            local run_id=""
            local match_count="0"
            local status=""
            local conclusion=""
            local url=""
            local description="$expected_title"

            for attempt in {1..60}; do
              runs_json="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow_file" \
                --branch main \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,status,conclusion,createdAt,displayTitle,headSha,url)"
              matches_json="$(jq -c \
                --arg title "$expected_title" \
                --arg head "$expected_head" \
                --argjson started_at "$started_at" \
                'map(select(
                  ((.createdAt | fromdateiso8601) >= $started_at)
                  and .displayTitle == $title
                  and .headSha == $head
                ))' <<<"$runs_json")"
              match_count="$(jq 'length' <<<"$matches_json")"
              if [ "$match_count" -gt 1 ]; then
                echo "Dispatch correlation matched more than one $workflow_file run; refusing ambiguity." >&2
                return 1
              fi
              if [ "$match_count" -eq 1 ]; then
                run_id="$(jq -r '.[0].databaseId' <<<"$matches_json")"
                break
              fi
              echo "Waiting for $description to start (attempt $attempt/60)."
              sleep 10
            done
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Timed out waiting for one correlated $description run." >&2
              return 1
            fi

            for attempt in {1..180}; do
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              if ! jq -e \
                --arg run_id "$run_id" \
                --arg title "$expected_title" \
                --arg head "$expected_head" \
                --arg path "$expected_path" \
                --arg workflow_name "$expected_workflow_name" \
                '(.id | tostring) == $run_id
                  and .event == "workflow_dispatch"
                  and .head_sha == $head
                  and .display_title == $title
                  and .path == $path
                  and .name == $workflow_name' <<<"$run_json" >/dev/null; then
                echo "Pinned run $run_id no longer matches the authorized dispatch identity." >&2
                return 1
              fi
              status="$(jq -r '.status // ""' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              url="$(jq -r '.html_url // ""' <<<"$run_json")"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                printf '%s' "$url" > "$RUNNER_TEMP/${workflow_file}.url"
                printf '%s' "$run_id" > "$RUNNER_TEMP/${workflow_file}.id"
                return 0
              fi
              if [ "$status" = "completed" ]; then
                echo "$description run $run_id concluded '$conclusion': $url" >&2
                return 1
              fi
              echo "Waiting for pinned $description run $run_id (status $status, attempt $attempt/180)."
              sleep 10
            done
            echo "Timed out waiting for pinned $description run $run_id." >&2
            return 1
          }

          assert_current_main() {
            local main_sha=""
            git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
            main_sha="$(git rev-parse origin/main)"
            if [ "$main_sha" != "$SOURCE_REF" ]; then
              echo "Delivery source $SOURCE_REF is not the current main head $main_sha; refusing a stale delivery." >&2
              return 1
            fi
          }

          if ! [[ "$TRIGGER_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Triggering workflow did not provide an immutable source SHA." >&2
            exit 1
          fi

          SOURCE_REF="$TRIGGER_HEAD_SHA"
          CI_RUN_URL="$TRIGGER_RUN_URL"
          associated_pr=""

          if [ "$TRIGGER_WORKFLOW" = "Codex Auto-Merge" ]; then
            if ! [[ "$TRIGGER_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "Auto-merge workflow did not provide a valid run ID." >&2
              exit 1
            fi

            review_directory="$RUNNER_TEMP/post-merge-review"
            gh run download "$TRIGGER_RUN_ID" \
              --repo "$REPOSITORY" \
              --pattern 'autonomous-review-*' \
              --dir "$review_directory"
            mapfile -t review_files < <(find "$review_directory" -type f -name autonomous-review.json -print)
            if [ "${#review_files[@]}" -ne 1 ]; then
              echo "Expected exactly one trusted autonomous-review artifact for run $TRIGGER_RUN_ID." >&2
              exit 1
            fi
            review_decision="$(jq -r '.decision // ""' "${review_files[0]}")"
            reviewed_head="$(jq -r '.reviewedHeadSha // ""' "${review_files[0]}")"
            if [ "$review_decision" != "approve" ] || ! [[ "$reviewed_head" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Trusted auto-merge artifact does not contain an approved full reviewed head SHA." >&2
              exit 1
            fi

            pr_number="$(jq -r '.workflow_run.pull_requests[0].number // ""' "$GITHUB_EVENT_PATH")"
            if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
              pulls_json="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/commits/$reviewed_head/pulls")"
              pr_number="$(jq -r \
                --arg head "$reviewed_head" \
                'map(select(.head.sha == $head and .base.ref == "main")) | sort_by(.number) | last.number // ""' \
                <<<"$pulls_json")"
            fi
            if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
              echo "Could not bind the completed auto-merge run to a pull request." >&2
              exit 1
            fi

            associated_pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/pulls/$pr_number")"
            merged="$(jq -r '.merged' <<<"$associated_pr")"
            state="$(jq -r '.state' <<<"$associated_pr")"
            pr_head="$(jq -r '.head.sha // ""' <<<"$associated_pr")"
            base_ref="$(jq -r '.base.ref // ""' <<<"$associated_pr")"
            SOURCE_REF="$(jq -r '.merge_commit_sha // ""' <<<"$associated_pr")"
            if [ "$merged" != "true" ] || [ "$state" != "closed" ] ||
               [ "$pr_head" != "$reviewed_head" ] || [ "$base_ref" != "main" ] ||
               ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Completed auto-merge run does not prove an exact-head merge into main." >&2
              exit 1
            fi

            assert_current_main
            ci_correlation="$(openssl rand -hex 24)"
            ci_title="CI $SOURCE_REF $ci_correlation"
            ci_started_at="$(date -u +%s)"
            gh workflow run ci.yml \
              --repo "$REPOSITORY" \
              --ref main \
              -f delivery_correlation="$ci_correlation"
            wait_for_dispatch ci.yml "$ci_title" "$ci_started_at" "$SOURCE_REF" "CI"
            CI_RUN_URL="$(cat "$RUNNER_TEMP/ci.yml.url")"
          else
            associated_pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/commits/$SOURCE_REF/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | sort_by(.merged_at) | last // {}')"
          fi

          # CI can take long enough for main to advance. Never deploy a source
          # that stopped being the current generation while checks were running.
          assert_current_main

          skip_autodeploy="$(jq -r '(
            ([.labels[]?.name] | map(ascii_downcase) | index("skip-autodeploy")) != null
            or ((.body // "") | test("\\[skip deploy\\]|\\[skip autodeploy\\]"; "i"))
          )' <<<"$associated_pr")"
          if [ "$skip_autodeploy" = "true" ]; then
            echo "The PR associated with $SOURCE_REF explicitly skipped deployment."
            exit 0
          fi

          test_correlation="$(openssl rand -hex 24)"
          test_title="Deploy Test $SOURCE_REF $test_correlation"
          test_started_at="$(date -u +%s)"
          gh workflow run deploy-test.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f commit_sha="$SOURCE_REF" \
            -f deploy_frontend=true \
            -f deploy_functions=true \
            -f delivery_correlation="$test_correlation"
          wait_for_dispatch deploy-test.yml "$test_title" "$test_started_at" "$SOURCE_REF" "Deploy Test"
          test_url="$(cat "$RUNNER_TEMP/deploy-test.yml.url")"
          test_run_id="$(cat "$RUNNER_TEMP/deploy-test.yml.id")"
          test_provenance_dir="$RUNNER_TEMP/test-provenance-$test_correlation"
          mkdir -p "$test_provenance_dir"
          gh run download "$test_run_id" \
            --repo "$REPOSITORY" \
            --name "deploy-test-provenance-$SOURCE_REF" \
            --dir "$test_provenance_dir"
          if ! jq -e \
            --arg source_ref "$SOURCE_REF" \
            --arg run_id "$test_run_id" \
            --arg correlation "$test_correlation" \
            '.environmentName == "test"
              and .sourceRef == $source_ref
              and .resolvedHead == $source_ref
              and .runId == $run_id
              and .deliveryCorrelation == $correlation
              and .workflow == "Deploy Test"
              and .deployFrontend == "true"
              and .deployFunctions == "true"
              and .eventName == "workflow_dispatch"
              and .authenticatedSmokeStatus == "passed"
              and .telemetryStatus == "passed"' \
            "$test_provenance_dir/deploy-test-provenance.json" >/dev/null; then
            echo "Pinned Deploy Test run did not emit matching successful provenance." >&2
            exit 1
          fi

          # Production must not follow a successful older test generation after
          # another change has reached main.
          assert_current_main
          production_correlation="$(openssl rand -hex 24)"
          production_title="Promote Production $SOURCE_REF $production_correlation"
          production_started_at="$(date -u +%s)"
          gh workflow run promote-production.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f commit_sha="$SOURCE_REF" \
            -f deploy_frontend=true \
            -f deploy_functions=true \
            -f delivery_correlation="$production_correlation" \
            -f test_delivery_correlation="$test_correlation" \
            -f test_run_id="$test_run_id"
          wait_for_dispatch promote-production.yml "$production_title" "$production_started_at" "$SOURCE_REF" "Promote Production"
          production_url="$(cat "$RUNNER_TEMP/promote-production.yml.url")"
          production_run_id="$(cat "$RUNNER_TEMP/promote-production.yml.id")"
          production_ledger_dir="$RUNNER_TEMP/production-ledger-$production_correlation"
          mkdir -p "$production_ledger_dir"
          gh run download "$production_run_id" \
            --repo "$REPOSITORY" \
            --name "release-ledger-prod-$SOURCE_REF" \
            --dir "$production_ledger_dir"
          if ! jq -e \
            --arg source_ref "$SOURCE_REF" \
            --arg run_id "$production_run_id" \
            --arg correlation "$production_correlation" \
            '.environment == "prod"
              and .sourceRef == $source_ref
              and .deployedCommit == $source_ref
              and .workflowRunId == $run_id
              and .deliveryCorrelation == $correlation
              and .smokeResults.status == "passed"
              and .authenticatedSmokeResults.status == "passed"
              and .telemetryCheckResult.status == "passed"' \
            "$production_ledger_dir/release-ledger-prod.json" >/dev/null; then
            echo "Pinned production run did not emit matching successful runtime-truth evidence." >&2
            exit 1
          fi

          {
            echo "### Main delivery completed"
            echo "- Source SHA: $SOURCE_REF"
            echo "- CI: $CI_RUN_URL"
            echo "- Deploy Test: $test_url"
            echo "- Promote Production: $production_url"
          } >> "$GITHUB_STEP_SUMMARY"
