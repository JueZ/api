name: Codex Main Delivery
run-name: Deliver main ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: main-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: run main delivery after successful push CI
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted delivery controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Dispatch exactly one test deployment and one production promotion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "CI workflow_run did not provide an immutable source SHA." >&2
            exit 1
          fi

          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$SOURCE_REF" origin/main; then
            echo "Successful CI source $SOURCE_REF is not in main history." >&2
            exit 1
          fi

          associated_pr="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/commits/$SOURCE_REF/pulls" \
            --jq 'map(select(.merged_at != null and .base.ref == "main")) | sort_by(.merged_at) | last // {}')"
          skip_autodeploy="$(jq -r '(
            ([.labels[]?.name] | map(ascii_downcase) | index("skip-autodeploy")) != null
            or ((.body // "") | test("\\[skip deploy\\]|\\[skip autodeploy\\]"; "i"))
          )' <<<"$associated_pr")"
          if [ "$skip_autodeploy" = "true" ]; then
            echo "The PR associated with $SOURCE_REF explicitly skipped deployment."
            exit 0
          fi

          wait_for_dispatch() {
            local workflow_file="$1"
            local expected_title="$2"
            local started_at="$3"
            local run_json=""

            for attempt in {1..180}; do
              run_json="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow_file" \
                --branch main \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,status,conclusion,createdAt,displayTitle,url \
                --jq "map(select(.displayTitle == \"$expected_title\" and ((.createdAt | fromdateiso8601) >= $started_at))) | sort_by(.createdAt) | last // {}")"
              run_id="$(jq -r '.databaseId // ""' <<<"$run_json")"
              status="$(jq -r '.status // ""' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              url="$(jq -r '.url // ""' <<<"$run_json")"

              if [ -z "$run_id" ]; then
                echo "Waiting for $expected_title to start (attempt $attempt/180)."
              elif [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                printf '%s' "$url" > "$RUNNER_TEMP/${workflow_file}.url"
                return 0
              elif [ "$status" = "completed" ]; then
                echo "$expected_title concluded '$conclusion': $url" >&2
                return 1
              else
                echo "Waiting for $expected_title run $run_id (status $status)."
              fi
              sleep 10
            done
            echo "Timed out waiting for $expected_title." >&2
            return 1
          }

          test_title="Deploy Test $SOURCE_REF"
          test_started_at="$(date -u +%s)"
          gh workflow run deploy-test.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f commit_sha="$SOURCE_REF" \
            -f deploy_frontend=true \
            -f deploy_functions=true
          wait_for_dispatch deploy-test.yml "$test_title" "$test_started_at"
          test_url="$(cat "$RUNNER_TEMP/deploy-test.yml.url")"

          production_title="Promote Production $SOURCE_REF"
          production_started_at="$(date -u +%s)"
          gh workflow run promote-production.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f commit_sha="$SOURCE_REF" \
            -f deploy_frontend=true \
            -f deploy_functions=true
          wait_for_dispatch promote-production.yml "$production_title" "$production_started_at"
          production_url="$(cat "$RUNNER_TEMP/promote-production.yml.url")"

          {
            echo "### Main delivery completed"
            echo "- Source SHA: $SOURCE_REF"
            echo "- CI: $CI_RUN_URL"
            echo "- Deploy Test: $test_url"
            echo "- Promote Production: $production_url"
          } >> "$GITHUB_STEP_SUMMARY"
