name: Codex Main Delivery
run-name: Deliver trigger ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [CI, Codex Auto-Merge]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: main-delivery
  cancel-in-progress: false

jobs:
  deliver:
    name: >-
      ${{
        github.event.workflow_run.path == '.github/workflows/codex-automerge.yml' &&
        'run main delivery after Codex auto-merge' ||
        'run main delivery after successful push CI'
      }}
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.run_attempt == 1 &&
        github.event.workflow_run.run_attempt == 1 &&
        (
          (
            github.event.workflow_run.path == '.github/workflows/ci.yml' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
          ) ||
          (
            github.event.workflow_run.path == '.github/workflows/codex-automerge.yml' &&
            github.event.workflow_run.event == 'pull_request_target'
          )
        )
      }}
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted delivery controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact main CI and gated delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_dispatch() {
            local workflow_file="$1"
            local expected_title="$2"
            local started_at="$3"
            local expected_head="$4"
            local expected_workflow_name="$5"
            local expected_event="${6:-workflow_dispatch}"
            local expected_path=".github/workflows/$workflow_file"
            local runs_json=""
            local matches_json=""
            local run_json=""
            local run_id=""
            local match_count="0"
            local status=""
            local conclusion=""
            local url=""
            local description="$expected_workflow_name: $expected_title"

            for attempt in {1..60}; do
              runs_json="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow_file" \
                --branch main \
                --event "$expected_event" \
                --limit 50 \
                --json databaseId,status,conclusion,createdAt,displayTitle,headSha,url)"
              matches_json="$(jq -c \
                --arg title "$expected_title" \
                --arg head "$expected_head" \
                --argjson started_at "$started_at" \
                'map(select(
                  ((.createdAt | fromdateiso8601) >= $started_at)
                  and .displayTitle == $title
                  and .headSha == $head
                ))' <<<"$runs_json")"
              match_count="$(jq 'length' <<<"$matches_json")"
              if [ "$match_count" -gt 1 ]; then
                echo "Dispatch correlation matched more than one $workflow_file run; refusing ambiguity." >&2
                return 1
              fi
              if [ "$match_count" -eq 1 ]; then
                run_id="$(jq -r '.[0].databaseId' <<<"$matches_json")"
                break
              fi
              echo "Waiting for $description to start (attempt $attempt/60)."
              sleep 10
            done
            if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
              echo "Timed out waiting for one correlated $description run." >&2
              return 1
            fi

            for attempt in {1..180}; do
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
              # GitHub has exposed either the static workflow name or the
              # resolved run-name in .name; path and display_title stay exact.
              if ! jq -e \
                --arg run_id "$run_id" \
                --arg title "$expected_title" \
                --arg head "$expected_head" \
                --arg path "$expected_path" \
                --arg repository "$REPOSITORY" \
                --arg workflow_name "$expected_workflow_name" \
                --arg expected_event "$expected_event" \
                '(.id | tostring) == $run_id
                  and .event == $expected_event
                  and .head_sha == $head
                  and .display_title == $title
                  and .path == $path
                  and (.name == $workflow_name or .name == $title)
                  and .repository.full_name == $repository
                  and .head_branch == "main"
                  and .run_attempt == 1' <<<"$run_json" >/dev/null; then
                echo "Pinned run $run_id no longer matches the authorized dispatch identity." >&2
                return 1
              fi
              status="$(jq -r '.status // ""' <<<"$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
              url="$(jq -r '.html_url // ""' <<<"$run_json")"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                printf '%s' "$url" > "$RUNNER_TEMP/${workflow_file}.url"
                printf '%s' "$run_id" > "$RUNNER_TEMP/${workflow_file}.id"
                return 0
              fi
              if [ "$status" = "completed" ]; then
                echo "$description run $run_id concluded '$conclusion': $url" >&2
                return 1
              fi
              echo "Waiting for pinned $description run $run_id (status $status, attempt $attempt/180)."
              sleep 10
            done
            echo "Timed out waiting for pinned $description run $run_id." >&2
            return 1
          }

          assert_current_main() {
            local main_sha=""
            git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
            main_sha="$(git rev-parse origin/main)"
            if [ "$main_sha" != "$SOURCE_REF" ]; then
              echo "Delivery source $SOURCE_REF is not the current main head $main_sha; refusing a stale delivery." >&2
              return 1
            fi
          }

          if ! [[ "$TRIGGER_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Triggering workflow did not provide an immutable source SHA." >&2
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ] || [ "$TRIGGER_RUN_ATTEMPT" != "1" ]; then
            echo "Main delivery and its triggering workflow must both be first attempts." >&2
            exit 1
          fi

          current_delivery_json="$(gh api "repos/$REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          expected_delivery_title="Deliver trigger $TRIGGER_RUN_ID attempt $TRIGGER_RUN_ATTEMPT"
          # Accept both documented/observed .name representations while the
          # immutable path and correlation-bearing display_title remain exact.
          if ! jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg repository "$REPOSITORY" \
            --arg workflow_name "Codex Main Delivery" \
            --arg title "$expected_delivery_title" \
            '(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .path == ".github/workflows/codex-main-delivery.yml"
              and .event == "workflow_run"
              and .head_branch == "main"
              and .display_title == $title
              and (.name == $workflow_name or .name == $title)
              and .run_attempt == 1
              and (.status == "queued" or .status == "in_progress")' \
            <<<"$current_delivery_json" >/dev/null; then
            echo "Current main-delivery run identity is not the authorized first-attempt workflow generation." >&2
            exit 1
          fi

          trigger_run_json="$(gh api "repos/$REPOSITORY/actions/runs/$TRIGGER_RUN_ID")"
          if [ "$TRIGGER_WORKFLOW_PATH" = ".github/workflows/codex-automerge.yml" ]; then
            # shellcheck disable=SC2016
            trigger_identity_filter='(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .path == ".github/workflows/codex-automerge.yml"
              and .name == "Codex Auto-Merge"
              and .event == "pull_request_target"
              and .conclusion == "success"
              and .head_sha == $head_sha
              and .run_attempt == 1'
          else
            # shellcheck disable=SC2016
            trigger_identity_filter='(.id | tostring) == $run_id
              and .repository.full_name == $repository
              and .path == ".github/workflows/ci.yml"
              and .event == "push"
              and .conclusion == "success"
              and .head_branch == "main"
              and .head_sha == $head_sha
              and .run_attempt == 1'
          fi
          if ! jq -e \
            --arg run_id "$TRIGGER_RUN_ID" \
            --arg repository "$REPOSITORY" \
            --arg head_sha "$TRIGGER_HEAD_SHA" \
            "$trigger_identity_filter" \
            <<<"$trigger_run_json" >/dev/null; then
            echo "Triggering workflow metadata does not match the exact authorized first-attempt run." >&2
            exit 1
          fi

          prior_delivery_count="$(gh api --paginate --slurp \
            "repos/$REPOSITORY/actions/workflows/codex-main-delivery.yml/runs?event=workflow_run&per_page=100" \
            | jq \
              --arg current_run_id "$GITHUB_RUN_ID" \
              --arg title "$expected_delivery_title" \
              '[.[]?.workflow_runs[]? | select((.id | tostring) != $current_run_id and .display_title == $title)] | length')"
          if [ "$prior_delivery_count" -gt 0 ]; then
            echo "A main-delivery run already consumed trigger $TRIGGER_RUN_ID; treating this duplicate event as a no-op."
            exit 0
          fi

          SOURCE_REF="$TRIGGER_HEAD_SHA"
          CI_RUN_URL="$TRIGGER_RUN_URL"
          CI_RUN_ID=""
          CI_DELIVERY_CORRELATION=""
          associated_pr=""
          PR_NUMBER=""
          PR_HEAD_SHA=""
          GOVERNANCE_RUN_ID=""

          if [ "$TRIGGER_WORKFLOW_PATH" = ".github/workflows/codex-automerge.yml" ]; then
            if ! [[ "$TRIGGER_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "Auto-merge workflow did not provide a valid run ID." >&2
              exit 1
            fi

            governance_directory="$RUNNER_TEMP/post-merge-governance"
            gh run download "$TRIGGER_RUN_ID" \
              --repo "$REPOSITORY" \
              --name "autonomous-governance-$TRIGGER_HEAD_SHA" \
              --dir "$governance_directory"
            mapfile -t governance_files < <(find "$governance_directory" -type f -name autonomous-governance.json -print)
            if [ "${#governance_files[@]}" -ne 1 ]; then
              echo "Expected exactly one trusted autonomous-governance artifact for run $TRIGGER_RUN_ID." >&2
              exit 1
            fi
            governance_decision="$(jq -r '.decision // ""' "${governance_files[0]}")"
            verified_head="$(jq -r '.verifiedHeadSha // ""' "${governance_files[0]}")"
            governance_evaluator="$(jq -r '.evaluator // ""' "${governance_files[0]}")"
            if [ "$governance_decision" != "approve" ] ||
               [ "$governance_evaluator" != "deterministic-protected-controller-v1" ] ||
               [ "$verified_head" != "$TRIGGER_HEAD_SHA" ]; then
              echo "Trusted auto-merge artifact does not contain approved deterministic governance for the exact trigger head." >&2
              exit 1
            fi

            pr_number="$(jq -r '.workflow_run.pull_requests[0].number // ""' "$GITHUB_EVENT_PATH")"
            if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
              pulls_json="$(gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/commits/$verified_head/pulls")"
              pr_number="$(jq -r \
                --arg head "$verified_head" \
                'map(select(.head.sha == $head and .base.ref == "main")) | sort_by(.number) | last.number // ""' \
                <<<"$pulls_json")"
            fi
            if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
              echo "Could not bind the completed auto-merge run to a pull request." >&2
              exit 1
            fi

            associated_pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/pulls/$pr_number")"
            merged="$(jq -r '.merged' <<<"$associated_pr")"
            state="$(jq -r '.state' <<<"$associated_pr")"
            pr_head="$(jq -r '.head.sha // ""' <<<"$associated_pr")"
            base_ref="$(jq -r '.base.ref // ""' <<<"$associated_pr")"
            SOURCE_REF="$(jq -r '.merge_commit_sha // ""' <<<"$associated_pr")"
            if [ "$merged" != "true" ] || [ "$state" != "closed" ] ||
               [ "$pr_head" != "$verified_head" ] || [ "$base_ref" != "main" ] ||
               ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Completed auto-merge run does not prove an exact-head merge into main." >&2
              exit 1
            fi
            PR_NUMBER="$pr_number"
            PR_HEAD_SHA="$verified_head"
            GOVERNANCE_RUN_ID="$TRIGGER_RUN_ID"
          else
            CI_RUN_ID="$TRIGGER_RUN_ID"
            CI_DELIVERY_CORRELATION="$TRIGGER_RUN_ID"
            associated_pr="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/commits/$SOURCE_REF/pulls" \
              --jq 'map(select(.merged_at != null and .base.ref == "main")) | sort_by(.merged_at) | last // {}')"
          fi

          # Classification and any later CI must bind the current main generation.
          assert_current_main

          automatic_skip_autodeploy="false"
          deployment_classification_reason="unavailable-associated-pull-request"
          associated_pr_number="$(jq -r '.number // ""' <<<"$associated_pr")"
          associated_pr_merge="$(jq -r '.merge_commit_sha // ""' <<<"$associated_pr")"
          expected_changed_files="$(jq -r '.changed_files // ""' <<<"$associated_pr")"
          if [[ "$associated_pr_number" =~ ^[0-9]+$ ]] &&
             [ "$associated_pr_merge" = "$SOURCE_REF" ] &&
             [[ "$expected_changed_files" =~ ^[1-9][0-9]*$ ]]; then
            changed_file_pages="$RUNNER_TEMP/associated-pr-file-pages.json"
            changed_files="$RUNNER_TEMP/associated-pr-files.json"
            if gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/pulls/$associated_pr_number/files?per_page=100" > "$changed_file_pages" &&
               jq -e '[.[] | .[]]' "$changed_file_pages" > "$changed_files"; then
              actual_changed_files="$(jq 'length' "$changed_files")"
              if [ "$actual_changed_files" = "$expected_changed_files" ]; then
                if deployment_classification="$(node scripts/classify-deployment-impact.mjs "$changed_files")" &&
                   jq -e '
                     type == "object"
                     and (.valid | type == "boolean")
                     and (.deploymentRequired | type == "boolean")
                     and (.reason | type == "string")
                     and (.fileCount | type == "number")
                     and (.impactPathCount | type == "number")' \
                     <<<"$deployment_classification" >/dev/null; then
                  deployment_classification_reason="$(jq -r '.reason' <<<"$deployment_classification")"
                  automatic_skip_autodeploy="$(jq -r \
                    --argjson expected "$expected_changed_files" \
                    '.valid == true
                      and .deploymentRequired == false
                      and .reason == "runtime-neutral-only"
                      and .fileCount == $expected
                      and .impactPathCount == 0' \
                    <<<"$deployment_classification")"
                else
                  deployment_classification_reason="malformed-classifier-result"
                fi
              else
                deployment_classification_reason="changed-file-count-mismatch"
              fi
            else
              deployment_classification_reason="changed-file-list-unavailable"
            fi
          fi

          explicit_skip_autodeploy="$(jq -r '(
            ([.labels[]?.name] | map(ascii_downcase) | index("skip-autodeploy")) != null
            or ((.body // "") | test("\\[skip deploy\\]|\\[skip autodeploy\\]"; "i"))
          )' <<<"$associated_pr")"

          skip_reason=""
          if [ "$explicit_skip_autodeploy" = "true" ]; then
            skip_reason="explicit PR marker or label"
          elif [ "$automatic_skip_autodeploy" = "true" ]; then
            skip_reason="trusted runtime-neutral path classification"
          else
            echo "Environment deployment remains required: $deployment_classification_reason."
          fi

          if [ "$TRIGGER_WORKFLOW_PATH" = ".github/workflows/codex-automerge.yml" ]; then
            ci_correlation="$(openssl rand -hex 24)"
            ci_title="CI $SOURCE_REF $ci_correlation"
            ci_started_at="$(date -u +%s)"
            if [ "$automatic_skip_autodeploy" = "true" ]; then
              gh workflow run ci.yml \
                --repo "$REPOSITORY" \
                --ref main \
                -f delivery_correlation="$ci_correlation" \
                -f validation_profile=runtime-neutral-reuse \
                -f source_pr_number="$PR_NUMBER" \
                -f source_pr_head_sha="$PR_HEAD_SHA" \
                -f governance_run_id="$GOVERNANCE_RUN_ID"
            else
              gh workflow run ci.yml \
                --repo "$REPOSITORY" \
                --ref main \
                -f delivery_correlation="$ci_correlation"
            fi
            wait_for_dispatch ci.yml "$ci_title" "$ci_started_at" "$SOURCE_REF" "CI"
            CI_RUN_URL="$(cat "$RUNNER_TEMP/ci.yml.url")"
            CI_RUN_ID="$(cat "$RUNNER_TEMP/ci.yml.id")"
            CI_DELIVERY_CORRELATION="$ci_correlation"
          fi

          # CI can take long enough for main to advance. Never deploy a source
          # that stopped being the current generation while checks were running.
          assert_current_main

          if [ -n "$skip_reason" ]; then
            echo "The PR associated with $SOURCE_REF skipped environment deployment: $skip_reason."
            {
              echo "### Main delivery environment deployment skipped"
              echo "- Source SHA: $SOURCE_REF"
              echo "- CI: $CI_RUN_URL"
              echo "- Reason: $skip_reason"
              echo "- Classification: $deployment_classification_reason"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          test_correlation="$(openssl rand -hex 24)"
          test_title="Deploy Test $SOURCE_REF $test_correlation"
          test_started_at="$(date -u +%s)"
          gh api --method POST "repos/$REPOSITORY/dispatches" \
            -f event_type=deploy-test \
            -f "client_payload[commit_sha]=$SOURCE_REF" \
            -f 'client_payload[deploy_frontend]=true' \
            -f 'client_payload[deploy_functions]=true' \
            -f 'client_payload[reddit_share_url_smoke]=false' \
            -f "client_payload[delivery_correlation]=$test_correlation" \
            -f "client_payload[ci_run_id]=$CI_RUN_ID" \
            -f "client_payload[ci_delivery_correlation]=$CI_DELIVERY_CORRELATION"
          wait_for_dispatch \
            deploy-test.yml "$test_title" "$test_started_at" "$SOURCE_REF" "Deploy Test" repository_dispatch
          test_url="$(cat "$RUNNER_TEMP/deploy-test.yml.url")"
          test_run_id="$(cat "$RUNNER_TEMP/deploy-test.yml.id")"
          test_provenance_dir="$RUNNER_TEMP/test-provenance-$test_correlation"
          mkdir -p "$test_provenance_dir"
          gh run download "$test_run_id" \
            --repo "$REPOSITORY" \
            --name "deploy-test-provenance-$SOURCE_REF-$test_correlation" \
            --dir "$test_provenance_dir"
          if ! jq -e \
            --arg source_ref "$SOURCE_REF" \
            --arg run_id "$test_run_id" \
            --arg correlation "$test_correlation" \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg ci_correlation "$CI_DELIVERY_CORRELATION" \
            '.environmentName == "test"
              and .sourceRef == $source_ref
              and .resolvedHead == $source_ref
              and .runId == $run_id
              and .deliveryCorrelation == $correlation
              and .ciRunId == $ci_run_id
              and .ciDeliveryCorrelation == $ci_correlation
              and .workflow == "Deploy Test"
              and .deployFrontend == "true"
              and .deployFunctions == "true"
              and .eventName == "repository_dispatch"
              and .authenticatedSmokeStatus == "passed"
              and .telemetryStatus == "passed"' \
            "$test_provenance_dir/deploy-test-provenance.json" >/dev/null; then
            echo "Pinned Deploy Test run did not emit matching successful provenance." >&2
            exit 1
          fi

          # Production must not follow a successful older test generation after
          # another change has reached main.
          assert_current_main
          production_correlation="$(openssl rand -hex 24)"
          production_title="Promote Production $SOURCE_REF $production_correlation"
          production_started_at="$(date -u +%s)"
          gh api --method POST "repos/$REPOSITORY/dispatches" \
            -f event_type=promote-production \
            -f "client_payload[commit_sha]=$SOURCE_REF" \
            -f "client_payload[delivery_correlation]=$production_correlation" \
            -f "client_payload[test_delivery_correlation]=$test_correlation" \
            -f "client_payload[test_run_id]=$test_run_id" \
            -f "client_payload[ci_run_id]=$CI_RUN_ID" \
            -f "client_payload[ci_delivery_correlation]=$CI_DELIVERY_CORRELATION"
          wait_for_dispatch \
            promote-production.yml "$production_title" "$production_started_at" "$SOURCE_REF" \
            "Promote Production" repository_dispatch
          assert_current_main
          production_url="$(cat "$RUNNER_TEMP/promote-production.yml.url")"
          production_run_id="$(cat "$RUNNER_TEMP/promote-production.yml.id")"
          production_ledger_dir="$RUNNER_TEMP/production-ledger-$production_correlation"
          mkdir -p "$production_ledger_dir"
          gh run download "$production_run_id" \
            --repo "$REPOSITORY" \
            --name "release-ledger-prod-$SOURCE_REF-$production_correlation" \
            --dir "$production_ledger_dir"
          if ! jq -e \
            --arg source_ref "$SOURCE_REF" \
            --arg run_id "$production_run_id" \
            --arg correlation "$production_correlation" \
            '.environment == "prod"
              and .sourceRef == $source_ref
              and .deployedCommit == $source_ref
              and .workflowRunId == $run_id
              and .deliveryCorrelation == $correlation
              and .smokeResults.status == "passed"
              and .authenticatedSmokeResults.status == "passed"
              and .telemetryCheckResult.status == "passed"' \
            "$production_ledger_dir/release-ledger-prod.json" >/dev/null; then
            echo "Pinned production run did not emit matching successful runtime-truth evidence." >&2
            exit 1
          fi

          {
            echo "### Main delivery completed"
            echo "- Source SHA: $SOURCE_REF"
            echo "- CI: $CI_RUN_URL"
            echo "- Deploy Test: $test_url"
            echo "- Promote Production: $production_url"
          } >> "$GITHUB_STEP_SUMMARY"
