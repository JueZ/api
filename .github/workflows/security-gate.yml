name: Security Gate
run-name: Security Gate ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify security coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      flags_json: ${{ steps.classify.outputs.flags_json }}
      started_at_epoch: ${{ steps.classify.outputs.started_at_epoch }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      codeql_javascript: ${{ steps.classify.outputs.codeql_javascript }}
      codeql_actions: ${{ steps.classify.outputs.codeql_actions }}
      trivy: ${{ steps.classify.outputs.trivy }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify security coverage
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'schedule' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
            node scripts/classify-pr-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --full scheduled-complete-scan --output "$GITHUB_OUTPUT"
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = '0000000000000000000000000000000000000000' ]; then
            BASE_SHA="$HEAD_SHA"
            node scripts/classify-pr-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --full missing-base-sha --output "$GITHUB_OUTPUT"
          else
            node scripts/classify-pr-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Gitleaks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # tag=v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencyAudit:
    name: dependency audit
    if: needs.classify.outputs.dependencies == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
      - name: Audit registry dependencies
        run: |
          audit_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" = "3" ]; then return 1; fi
              sleep $((attempt * 10))
            done
          }
          audit_with_retry npm audit --audit-level=high
          # Rebuild npm's logical tree for the independently deployed Function
          # manifest before its audit. This installs nothing and runs no scripts.
          npm --prefix apps/api install --package-lock-only --ignore-scripts --no-audit
          audit_with_retry npm --prefix apps/api audit --omit=dev --audit-level=high

  codeqlJavascript:
    name: CodeQL javascript-typescript
    if: needs.classify.outputs.codeql_javascript == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # tag=v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # tag=v4
        with:
          category: /language:javascript-typescript

  codeqlActions:
    name: CodeQL actions
    if: needs.classify.outputs.codeql_actions == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # tag=v4
        with:
          languages: actions
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # tag=v4
        with:
          category: /language:actions

  trivy:
    name: Trivy
    if: needs.classify.outputs.trivy == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ needs.classify.outputs.head_sha }}
          persist-credentials: false
      - name: Scan relevant workspace
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag=v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  aggregate:
    name: Security Gate
    if: always()
    needs:
      - classify
      - gitleaks
      - dependencyAudit
      - codeqlJavascript
      - codeqlActions
      - trivy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ needs.classify.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify explicit Security Gate dependencies
        env:
          EXACT_SHA: ${{ needs.classify.outputs.head_sha }}
          FLAGS_JSON: ${{ needs.classify.outputs.flags_json }}
          GATE: security
          NEEDS_JSON: ${{ toJson(needs) }}
          PROFILE: ${{ needs.classify.outputs.profile }}
          STARTED_AT_EPOCH: ${{ needs.classify.outputs.started_at_epoch }}
        run: node scripts/verify-gate-results.mjs
