name: Codex Autofix

on:
  workflow_run:
    workflows: [CI, Policy Check]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to repair
        required: true
        type: number
      attempt:
        description: Repair attempt number, maximum 2
        required: true
        default: '1'
        type: choice
        options: ['1', '2']

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: codex-autofix-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  bounded-autofix:
    name: bounded Codex repair task
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0].number != '')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and attempt
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(core.getInput('pr_number'))
              : context.payload.workflow_run.pull_requests[0].number;
            const requestedAttempt = context.eventName === 'workflow_dispatch'
              ? Number(core.getInput('attempt'))
              : 1;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const prior = comments.filter(c => c.body && c.body.includes('Codex autofix attempt')).length;
            const attempt = Math.max(requestedAttempt, prior + 1);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('attempt', String(attempt));
            if (attempt > 2) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: 'Codex autofix stopped: maximum 2 repair attempts reached.'
              });
              core.setFailed('Maximum 2 repair attempts reached.');
            }
      - name: Checkout PR branch
        if: steps.resolve.outputs.attempt <= '2'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.resolve.outputs.pr_number }}/head
          fetch-depth: 0
      - name: Capture failing workflow context
        if: steps.resolve.outputs.attempt <= '2'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `Codex autofix attempt ${core.getInput('attempt') || '${{ steps.resolve.outputs.attempt }}'} started.`,
              '',
              'This workflow is intentionally bounded to two attempts and must not disable checks, weaken auth, remove policy checks, or commit secrets.',
              '',
              `Failed workflow run: ${context.payload.workflow_run?.html_url || 'manual dispatch'}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve.outputs.pr_number }}'),
              body
            });
      - name: Create repair task issue
        if: steps.resolve.outputs.attempt <= '2'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Codex repair needed for PR #${{ steps.resolve.outputs.pr_number }} attempt ${{ steps.resolve.outputs.attempt }}`;
            const body = [
              `PR #${{ steps.resolve.outputs.pr_number }} has failing CI or policy checks.`,
              '',
              `Attempt: ${{ steps.resolve.outputs.attempt }} of 2`,
              `Workflow run: ${context.payload.workflow_run?.html_url || 'manual dispatch'}`,
              '',
              'A Codex agent may inspect logs and push the smallest safe fix to the PR branch.',
              'Do not disable tests, weaken authentication, remove policy checks, or commit secrets.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['codex-repair']
            });
