name: Codex Autofix

on:
  workflow_run:
    workflows: [CI, Policy Check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: codex-autofix-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  bounded-autofix:
    name: bounded Codex repair task
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        contains(fromJSON('["CI","Policy Check"]'), github.event.workflow_run.name) &&
        github.event.workflow_run.pull_requests[0].number > 0
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and attempt
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const allowedWorkflowNames = new Set(['CI', 'Policy Check']);
            if (context.eventName !== 'workflow_run') {
              core.setFailed('Codex Autofix only handles workflow_run events.');
              return;
            }
            if (run.conclusion !== 'failure') {
              core.setFailed(`Codex Autofix only repairs failed workflow runs; received ${run.conclusion}.`);
              return;
            }
            if (!allowedWorkflowNames.has(run.name)) {
              core.setFailed(`Codex Autofix ignores workflow ${run.name}.`);
              return;
            }
            const prNumber = run.pull_requests?.[0]?.number;
            if (!prNumber) {
              core.setFailed('Codex Autofix only repairs failed CI or Policy Check runs associated with a pull request.');
              return;
            }
            const requestedAttempt = 1;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const prior = comments.filter(c => c.body && c.body.includes('Codex autofix attempt')).length;
            const attempt = Math.max(requestedAttempt, prior + 1);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('attempt', String(attempt));
            if (attempt > 2) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: 'Codex autofix stopped: maximum 2 repair attempts reached.'
              });
              core.setFailed('Maximum 2 repair attempts reached.');
            }
      - name: Checkout PR branch
        if: steps.resolve.outputs.attempt <= '2'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.resolve.outputs.pr_number }}/head
          fetch-depth: 0
      - name: Capture failing workflow context
        if: steps.resolve.outputs.attempt <= '2'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              `Codex autofix attempt ${{ steps.resolve.outputs.attempt }} started.`,
              '',
              'This workflow is intentionally bounded to two attempts and must not disable checks, weaken auth, remove policy checks, or commit secrets.',
              '',
              `Failed workflow run: ${context.payload.workflow_run.html_url}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve.outputs.pr_number }}'),
              body
            });
      - name: Create repair task issue
        if: steps.resolve.outputs.attempt <= '2'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Codex repair needed for PR #${{ steps.resolve.outputs.pr_number }} attempt ${{ steps.resolve.outputs.attempt }}`;
            const body = [
              `PR #${{ steps.resolve.outputs.pr_number }} has failing CI or policy checks.`,
              '',
              `Attempt: ${{ steps.resolve.outputs.attempt }} of 2`,
              `Workflow run: ${context.payload.workflow_run.html_url}`,
              '',
              'A Codex agent may inspect logs and push the smallest safe fix to the PR branch.',
              'Do not disable tests, weaken authentication, remove policy checks, or commit secrets.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['codex-repair']
            });
