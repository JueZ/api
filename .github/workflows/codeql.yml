name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # tag=v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # tag=v4
        with:
          category: /language:${{ matrix.language }}

  codeql-complete:
    name: CodeQL complete
    if: always()
    needs:
      - analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every CodeQL matrix analysis passed
        shell: bash
        run: |
          set -euo pipefail
          results='${{ toJson(needs) }}'
          if echo "$results" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            echo "All CodeQL analyses passed."
          else
            echo "One or more CodeQL analyses did not pass."
            exit 1
          fi
