name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Previous immutable 40-character commit SHA from main to redeploy to production.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  rollback-production:
    name: rollback production
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTH_ACCESS_TOKEN: ${{ secrets.AUTH_ACCESS_TOKEN }}
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: true
      deployFunctions: true
      sourceRef: ${{ inputs.commit_sha }}
      updateProductionVariables: true
