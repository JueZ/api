name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Previous commit SHA, branch, or tag to redeploy to production.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: write
  issues: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  rollback-production:
    name: rollback production
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: true
      deployFunctions: true
      sourceRef: ${{ inputs.commit_sha }}
      updateProductionVariables: true
