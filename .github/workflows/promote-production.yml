name: Promote Production

on:
  workflow_run:
    workflows: [Deploy Test]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA on main to promote. Defaults to the selected ref SHA.
        required: false
        type: string
      deploy_frontend:
        description: Deploy Angular static files.
        required: false
        default: true
        type: boolean
      deploy_functions:
        description: Deploy Azure Functions package.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote-production:
    name: promote production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_run')
      }}
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_frontend }}
      deployFunctions: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_functions }}
      sourceRef: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
      updateProductionVariables: true
