name: Promote Production
run-name: Promote Production ${{ inputs.commit_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable 40-character commit SHA from main to promote. Defaults to the selected ref SHA.
        required: false
        type: string
      deploy_frontend:
        description: Deploy Angular static files.
        required: false
        default: true
        type: boolean
      deploy_functions:
        description: Deploy Azure Functions package.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote-production:
    name: promote production
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
      BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
      BRING_CLIENT_API_KEY: ${{ secrets.BRING_CLIENT_API_KEY }}
      BRING_CONFIRMATION_HMAC_KEY: ${{ secrets.BRING_CONFIRMATION_HMAC_KEY }}
      BRING_MUTATION_ENCRYPTION_KEY: ${{ secrets.BRING_MUTATION_ENCRYPTION_KEY }}
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: ${{ inputs.deploy_frontend }}
      deployFunctions: ${{ inputs.deploy_functions }}
      sourceRef: ${{ inputs.commit_sha || github.sha }}
      updateProductionVariables: true
