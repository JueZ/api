name: Promote Production
run-name: Promote Production ${{ github.event.client_payload.commit_sha || github.sha }} ${{ github.event.client_payload.delivery_correlation }}

on:
  repository_dispatch:
    types: [promote-production]

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote-production:
    name: promote production
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
      BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
      BRING_CLIENT_API_KEY: ${{ secrets.BRING_CLIENT_API_KEY }}
      BRING_CONFIRMATION_HMAC_KEY: ${{ secrets.BRING_CONFIRMATION_HMAC_KEY }}
      BRING_MUTATION_ENCRYPTION_KEY: ${{ secrets.BRING_MUTATION_ENCRYPTION_KEY }}
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: true
      deployFunctions: true
      sourceRef: ${{ github.event.client_payload.commit_sha || github.sha }}
      controllerRef: ${{ github.sha }}
      controllerWorkflowSha: ${{ github.workflow_sha }}
      updateProductionVariables: true
      deliveryCorrelation: ${{ github.event.client_payload.delivery_correlation }}
      testDeliveryCorrelation: ${{ github.event.client_payload.test_delivery_correlation }}
      testDeliveryRunId: ${{ github.event.client_payload.test_run_id }}
      ciRunId: ${{ github.event.client_payload.ci_run_id }}
      ciDeliveryCorrelation: ${{ github.event.client_payload.ci_delivery_correlation }}
