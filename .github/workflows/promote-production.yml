name: Promote Production
run-name: Promote Production ${{ inputs.commit_sha || github.sha }} ${{ inputs.delivery_correlation || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable 40-character commit SHA from main to promote. Defaults to the selected ref SHA.
        required: false
        type: string
      delivery_correlation:
        description: Unique delivery-controller correlation value.
        required: false
        type: string
      test_delivery_correlation:
        description: Exact correlation from the successful Deploy Test run being promoted.
        required: true
        type: string
      test_run_id:
        description: Exact successful Deploy Test workflow run being promoted.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  promote-production:
    name: promote production
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
      BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
      BRING_CLIENT_API_KEY: ${{ secrets.BRING_CLIENT_API_KEY }}
      BRING_CONFIRMATION_HMAC_KEY: ${{ secrets.BRING_CONFIRMATION_HMAC_KEY }}
      BRING_MUTATION_ENCRYPTION_KEY: ${{ secrets.BRING_MUTATION_ENCRYPTION_KEY }}
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: true
      deployFunctions: true
      sourceRef: ${{ inputs.commit_sha || github.sha }}
      controllerRef: ${{ github.sha }}
      controllerWorkflowSha: ${{ github.workflow_sha }}
      updateProductionVariables: true
      deliveryCorrelation: ${{ inputs.delivery_correlation || format('manual-{0}-{1}', github.run_id, github.run_attempt) }}
      testDeliveryCorrelation: ${{ inputs.test_delivery_correlation }}
      testDeliveryRunId: ${{ inputs.test_run_id }}
