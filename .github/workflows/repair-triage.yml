name: Repair and Learning Queue
run-name: Repair queue for ${{ github.event.workflow_run.id || inputs.source_run_id }}

on:
  workflow_run:
    workflows:
      - PR Gate
      - Security Gate
      - Delivery v2
      - Bring Read-Only Canary
      - Private Storage Migration
      - Verify Azure OIDC
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact trusted failed workflow run ID to inspect.
        required: true
        type: string
      dry_run:
        description: Produce a sanitized plan without mutating issues or labels.
        required: true
        default: true
        type: boolean
      repair_progress_json:
        description: Optional public-safe advisory repair progress bound to the exact source run.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: repair-learning-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  queue:
    name: queue bounded repair and learning
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Delivery v2' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event.workflow_run.conclusion != 'success' &&
       github.event.workflow_run.conclusion != 'skipped' &&
       github.event.workflow_run.conclusion != 'neutral')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted protected-main queue
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
      - name: Queue exact failure fingerprint
        id: queue
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          GH_TOKEN: ${{ github.token }}
          REPAIR_PROGRESS_JSON: ${{ inputs.repair_progress_json }}
          REPAIR_SUMMARY_PATH: ${{ runner.temp }}/repair-learning-summary.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: node scripts/triage-repair-issues.mjs
      - name: Upload bounded sanitized result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: repair-learning-${{ github.event.workflow_run.id || inputs.source_run_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-learning-summary.json
          if-no-files-found: warn
          retention-days: 30
