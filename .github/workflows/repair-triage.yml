name: Repair Issue Triage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Normal rollout-bounded triage or an exact-range historical backfill.
        required: true
        default: triage
        type: choice
        options:
          - triage
          - backfill
      dry_run:
        description: Report intended mutations without creating labels, comments, candidates, or closures.
        required: true
        default: true
        type: boolean
      backfill_start:
        description: First exact issue number for backfill mode (required only for backfill).
        required: false
        default: ''
        type: string
      backfill_end:
        description: Last exact issue number for backfill mode (required only for backfill).
        required: false
        default: ''
        type: string
      close_resolved:
        description: Close codex-repair issues only when evidence proves they are resolved.
        required: false
        default: false
        type: boolean
      api_base_url:
        description: Optional API base URL for live /health verification.
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  repair-triage:
    name: triage codex-repair issues
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Triage repair issues
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled triage can create/update idempotent learning candidates but
          # cannot close repairs because close_resolved is always false on schedule.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          REPAIR_TRIAGE_CLOSE_RESOLVED: ${{ github.event_name == 'workflow_dispatch' && inputs.close_resolved || 'false' }}
          REPAIR_TRIAGE_REQUIRE_LEDGER_FOR_PROD: 'true'
          AGENT_LEARNING_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill' && 'true' || 'false' }}
          AGENT_LEARNING_BACKFILL_START: ${{ inputs.backfill_start || '' }}
          AGENT_LEARNING_BACKFILL_END: ${{ inputs.backfill_end || '' }}
          API_BASE_URL: ${{ inputs.api_base_url || '' }}
        run: node scripts/triage-repair-issues.mjs
