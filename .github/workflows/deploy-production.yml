name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  DEPLOY_PRODUCTION_ENABLED: ${{ vars.DEPLOY_PRODUCTION_ENABLED }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
  AZURE_STATIC_WEB_STORAGE_ACCOUNT: ${{ vars.AZURE_STATIC_WEB_STORAGE_ACCOUNT }}
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
  AUTH_ENABLED: ${{ vars.AUTH_ENABLED }}
  OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
  OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
  OIDC_REQUIRED_SCOPES: ${{ vars.OIDC_REQUIRED_SCOPES }}
  OIDC_ALLOWED_OBJECT_IDS: ${{ vars.OIDC_ALLOWED_OBJECT_IDS }}
  OIDC_ALLOWED_SUBJECTS: ${{ vars.OIDC_ALLOWED_SUBJECTS }}
  OIDC_ALLOWED_TENANTS: ${{ vars.OIDC_ALLOWED_TENANTS }}
  WEB_AUTH_ENABLED: ${{ vars.WEB_AUTH_ENABLED }}
  WEB_AUTH_CLIENT_ID: ${{ vars.WEB_AUTH_CLIENT_ID }}
  WEB_AUTH_AUTHORITY: ${{ vars.WEB_AUTH_AUTHORITY }}
  WEB_AUTH_REDIRECT_URI: ${{ vars.WEB_AUTH_REDIRECT_URI }}
  WEB_AUTH_API_SCOPE: ${{ vars.WEB_AUTH_API_SCOPE }}
  WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    environment:
      name: production
      url: ${{ env.PRODUCTION_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID repository variable is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID repository variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID repository variable is required}"
          : "${AZURE_RESOURCE_GROUP:?AZURE_RESOURCE_GROUP repository variable is required}"
          : "${AUTH_ENABLED:?AUTH_ENABLED repository variable is required}"
          if [ "$AUTH_ENABLED" != "true" ]; then
            echo "AUTH_ENABLED must be true for production deployment after the auth milestone."
            exit 1
          fi
          : "${OIDC_ISSUER:?OIDC_ISSUER repository variable is required}"
          : "${OIDC_AUDIENCE:?OIDC_AUDIENCE repository variable is required}"
          : "${OIDC_REQUIRED_SCOPES:?OIDC_REQUIRED_SCOPES repository variable is required}"
          : "${OIDC_ALLOWED_OBJECT_IDS:?OIDC_ALLOWED_OBJECT_IDS repository variable is required}"
          : "${WEB_AUTH_ENABLED:?WEB_AUTH_ENABLED repository variable is required}"
          : "${WEB_AUTH_CLIENT_ID:?WEB_AUTH_CLIENT_ID repository variable is required}"
          : "${WEB_AUTH_AUTHORITY:?WEB_AUTH_AUTHORITY repository variable is required}"
          : "${WEB_AUTH_REDIRECT_URI:?WEB_AUTH_REDIRECT_URI repository variable is required}"
          : "${WEB_AUTH_API_SCOPE:?WEB_AUTH_API_SCOPE repository variable is required}"
          echo "Production deployment is explicitly enabled and auth config variables are present. Continuing with OIDC login."
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Build production artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm run build --if-present
            npm run build:api --if-present
            npm run build:functions --if-present
          else
            echo "No root package.json found; skipping application artifact build."
          fi
      - name: Deploy Bicep infrastructure and resolve runtime settings
        shell: bash
        run: |
          set -euo pipefail

          function_app_output=""
          storage_account_output=""

          if [ -f infra/main.bicep ]; then
            deployment_outputs=$(az deployment group create \
              --name main \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/main.bicep \
              --parameters environmentName=prod \
                authEnabled="$AUTH_ENABLED" \
                oidcIssuer="$OIDC_ISSUER" \
                oidcAudience="$OIDC_AUDIENCE" \
                oidcRequiredScopes="$OIDC_REQUIRED_SCOPES" \
                oidcAllowedObjectIds="$OIDC_ALLOWED_OBJECT_IDS" \
                oidcAllowedSubjects="$OIDC_ALLOWED_SUBJECTS" \
                oidcAllowedTenants="$OIDC_ALLOWED_TENANTS" \
              --query properties.outputs \
              -o json)

            function_app_output=$(jq -r '.functionAppResourceName.value // empty' <<< "$deployment_outputs")
            storage_account_output=$(jq -r '.storageAccountResourceName.value // empty' <<< "$deployment_outputs")
          else
            echo "No infra/main.bicep found; skipping infrastructure deployment."
          fi

          effective_functionapp_name="${AZURE_FUNCTIONAPP_NAME:-$function_app_output}"
          effective_storage_account="${AZURE_STATIC_WEB_STORAGE_ACCOUNT:-$storage_account_output}"
          effective_production_base_url="${PRODUCTION_BASE_URL:-}"

          if [ -z "$effective_production_base_url" ]; then
            : "${effective_functionapp_name:?Function App name is required to discover PRODUCTION_BASE_URL}"
            default_host_name=$(az functionapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$effective_functionapp_name" \
              --query defaultHostName \
              -o tsv)
            : "${default_host_name:?Unable to discover Function App default hostname}"
            effective_production_base_url="https://$default_host_name"
          fi

          {
            echo "EFFECTIVE_FUNCTIONAPP_NAME=$effective_functionapp_name"
            echo "EFFECTIVE_STORAGE_ACCOUNT=$effective_storage_account"
            echo "EFFECTIVE_PRODUCTION_BASE_URL=$effective_production_base_url"
          } >> "$GITHUB_ENV"

          {
            echo "### Effective production deployment settings"
            echo "- Production base URL: $effective_production_base_url"
            echo "- Function App name: $effective_functionapp_name"
            echo "- Static web storage account: ${effective_storage_account:-not set}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Resolved effective deployment settings."
      - name: Package and deploy Azure Functions
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/api/host.json ]; then
            : "${EFFECTIVE_FUNCTIONAPP_NAME:?EFFECTIVE_FUNCTIONAPP_NAME is required when Azure Functions are present}"
            : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

            package_dir="$RUNNER_TEMP/function-package"
            rm -rf "$package_dir" "$RUNNER_TEMP/functionapp.zip"
            mkdir -p "$package_dir"

            cp apps/api/host.json apps/api/package.json "$package_dir/"
            cp -R apps/api/dist "$package_dir/dist"

            npm install --omit=dev --package-lock=false --prefix "$package_dir"

            (cd "$package_dir" && zip -r "$RUNNER_TEMP/functionapp.zip" .)

            : "${EFFECTIVE_STORAGE_ACCOUNT:?EFFECTIVE_STORAGE_ACCOUNT is required for run-from-package deployment}"
            release_container="function-releases"
            release_blob="functionapp-${GITHUB_SHA}-${GITHUB_RUN_ID}.zip"

            az storage container create \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --name "$release_container" \
              --public-access off \
              -o none
            az storage blob upload \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --container-name "$release_container" \
              --name "$release_blob" \
              --file "$RUNNER_TEMP/functionapp.zip" \
              --overwrite true \
              -o none

            package_url="https://$EFFECTIVE_STORAGE_ACCOUNT.blob.core.windows.net/$release_container/$release_blob"

            az functionapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$EFFECTIVE_FUNCTIONAPP_NAME" \
              --settings \
                WEBSITE_RUN_FROM_PACKAGE="$package_url" \
                WEBSITE_RUN_FROM_PACKAGE_BLOB_MI_RESOURCE_ID=SystemAssigned \
              -o none
            az functionapp restart \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$EFFECTIVE_FUNCTIONAPP_NAME" \
              -o none
          else
            echo "No Azure Functions host.json found; skipping Functions deployment."
          fi
      - name: Deploy Angular static site with Azure OIDC
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './node_modules' -prune -o -name angular.json -print -quit | grep -q .; then
            : "${EFFECTIVE_STORAGE_ACCOUNT:?EFFECTIVE_STORAGE_ACCOUNT is required when Angular is present}"
            output_dir=$(find . -path './node_modules' -prune -o -path '*/dist/*' -type f -name index.html -print -quit | xargs -r dirname)
            if [ -z "${output_dir:-}" ]; then
              echo "No Angular dist index.html found after build."
              exit 1
            fi
            mkdir -p "$output_dir/assets"
            effective_web_api_base_url="${WEB_API_BASE_URL:-$EFFECTIVE_PRODUCTION_BASE_URL}"
            effective_web_redirect_uri="$WEB_AUTH_REDIRECT_URI"
            export EFFECTIVE_WEB_API_BASE_URL="$effective_web_api_base_url"
            export EFFECTIVE_WEB_REDIRECT_URI="$effective_web_redirect_uri"
            node --input-type=module --eval "const config={authEnabled:process.env.WEB_AUTH_ENABLED==='true',authClientId:process.env.WEB_AUTH_CLIENT_ID||'',authAuthority:process.env.WEB_AUTH_AUTHORITY||'',authRedirectUri:process.env.EFFECTIVE_WEB_REDIRECT_URI||'',authApiScope:process.env.WEB_AUTH_API_SCOPE||'',apiBaseUrl:process.env.EFFECTIVE_WEB_API_BASE_URL||''}; process.stdout.write('window.API_CATALOGUE_CONFIG = '+JSON.stringify(config)+';\n');" > "$output_dir/assets/config.js"
            az storage blob service-properties update \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --static-website true \
              --index-document index.html \
              -o none
            az storage blob upload-batch \
              --auth-mode login \
              --account-name "$EFFECTIVE_STORAGE_ACCOUNT" \
              --destination '$web' \
              --source "$output_dir" \
              --overwrite
          else
            echo "No angular.json found; skipping Angular static site deployment."
          fi
      - name: Run production smoke tests
        shell: bash
        run: |
          set -euo pipefail
          : "${EFFECTIVE_PRODUCTION_BASE_URL:?EFFECTIVE_PRODUCTION_BASE_URL is required for smoke tests}"
          curl --fail --show-error --silent --max-time 20 "$EFFECTIVE_PRODUCTION_BASE_URL/health"
          hello_status=$(curl --show-error --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$EFFECTIVE_PRODUCTION_BASE_URL/api/hello")
          if [ "$hello_status" != "401" ]; then
            echo "Expected unauthenticated /api/hello to return 401 after auth is enabled; got $hello_status."
            exit 1
          fi
      - name: Create issue on failed smoke or deploy
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Production deployment failed for ${context.sha.substring(0, 7)}`;
            const body = [
              'Production deployment or smoke tests failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'Automation must fail closed. Investigate logs and create a bounded repair PR if safe.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['production-failure', 'codex-repair']
            });
