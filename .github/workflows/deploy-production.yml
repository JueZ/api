name: Deploy Production Legacy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Immutable 40-character commit SHA from main to deploy after CI and Deploy Test succeed. Prefer promote-production.yml for normal promotion.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: deploy-production-legacy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: deploy production legacy wrapper
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WLH_BASE_URL: ${{ secrets.WLH_BASE_URL }}
      BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
      BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
    with:
      environmentName: prod
      azureResourceGroup: rg-api-prod
      githubEnvironment: production
      deployFrontend: true
      deployFunctions: true
      sourceRef: ${{ inputs.commit_sha || github.sha }}
      updateProductionVariables: true
