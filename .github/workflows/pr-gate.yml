name: PR Gate
run-name: PR Gate ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      reason: ${{ steps.classify.outputs.reason }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      flags_json: ${{ steps.classify.outputs.flags_json }}
      started_at_epoch: ${{ steps.classify.outputs.started_at_epoch }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      contracts: ${{ steps.classify.outputs.contracts }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
      workflow: ${{ steps.classify.outputs.workflow }}
      learning: ${{ steps.classify.outputs.learning }}
      privileged: ${{ steps.classify.outputs.privileged }}
      operations: ${{ steps.classify.outputs.operations }}
      agent_environment: ${{ steps.classify.outputs.agent_environment }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = '0000000000000000000000000000000000000000' ]; then
            BASE_SHA="$HEAD_SHA"
            node scripts/classify-pr-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --full missing-base-sha --output "$GITHUB_OUTPUT"
          else
            node scripts/classify-pr-paths.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
          fi
      - name: Summarize classification
        shell: bash
        env:
          PROFILE: ${{ steps.classify.outputs.profile }}
          REASON: ${{ steps.classify.outputs.reason }}
          EXACT_SHA: ${{ steps.classify.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            echo '### Changed-path classification'
            echo "- Profile: $PROFILE"
            echo "- Reason: $REASON"
            echo "- Exact SHA: $EXACT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: policy and diff sanity
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: .candidate
          persist-credentials: false
      - name: Checkout protected base policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
      - name: Install protected base policy dependencies
        if: github.event_name == 'pull_request'
        working-directory: .trusted-base
        run: npm ci --ignore-scripts --workspaces=false
      - name: Verify candidate with protected base policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_CLASSIFIER_OUTPUTS: ${{ toJson(needs.classify.outputs) }}
          CANDIDATE_FLAGS_JSON: ${{ needs.classify.outputs.flags_json }}
          CANDIDATE_ROOT: ${{ github.workspace }}/.candidate
          CLASSIFIED_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          CLASSIFIED_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_ROOT: ${{ github.workspace }}/.trusted-base
        run: |
          set -euo pipefail
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" = "$BASE_SHA"
          test "$CLASSIFIED_BASE_SHA" = "$BASE_SHA"
          test "$CLASSIFIED_HEAD_SHA" = "$HEAD_SHA"

          (
            cd "$CANDIDATE_ROOT"
            REPOSITORY_ROOT="$CANDIDATE_ROOT" \
              POLICY_ROOT="$TRUSTED_ROOT" \
              BASE_REF="$BASE_SHA" \
              node "$TRUSTED_ROOT/scripts/policy-guardrails.mjs"
          )

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const candidateRoot = process.env.CANDIDATE_ROOT;
          const trustedRoot = process.env.TRUSTED_ROOT;
          const trustedModule = (path) => import(pathToFileURL(join(trustedRoot, path)));
          const { classifyGitRange } = await trustedModule('scripts/classify-pr-paths.mjs');
          const { loadAutonomousPolicy } = await trustedModule('scripts/lib/autonomous-policy.mjs');
          const { workflowPolicyFindings } = await trustedModule('scripts/lib/workflow-policy.mjs');

          const trustedClassification = classifyGitRange(process.env.BASE_SHA, process.env.HEAD_SHA, candidateRoot);
          const candidateOutputs = JSON.parse(process.env.CANDIDATE_CLASSIFIER_OUTPUTS);
          assert.deepEqual(
            JSON.parse(process.env.CANDIDATE_FLAGS_JSON),
            trustedClassification.flags,
            'candidate classifier diverged from protected base',
          );
          const consumedFlags = [
            'backend',
            'frontend',
            'contracts',
            'dependencies',
            'infrastructure',
            'workflow',
            'learning',
            'privileged',
            'operations',
            'agentEnvironment',
          ];
          for (const flag of consumedFlags) {
            const expected = trustedClassification.flags[flag];
            const output = flag.replace(/[A-Z]/g, (character) => `_${character.toLowerCase()}`);
            assert.equal(candidateOutputs[output], String(expected), `candidate classifier output ${output} diverged`);
          }
          loadAutonomousPolicy(join(candidateRoot, '.github/autonomous-policy.yml'));
          const baselinePolicy = loadAutonomousPolicy(join(trustedRoot, '.github/autonomous-policy.yml'));
          const findings = await workflowPolicyFindings(join(candidateRoot, '.github/workflows'), baselinePolicy);
          assert.deepEqual(findings, [], `candidate workflow policy findings:\n${findings.join('\n')}`);
          NODE
      - name: Install policy and formatting dependencies
        working-directory: .candidate
        run: npm ci --ignore-scripts
      - name: Check exact diff and changed-file formatting
        working-directory: .candidate
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA...$HEAD_SHA"
          mapfile -d '' changed_files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA")
          format_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.css|*.html|*.js|*.json|*.md|*.mjs|*.ts|*.yaml|*.yml) format_files+=("$file") ;;
            esac
          done
          if [ "${#format_files[@]}" -gt 0 ]; then
            ./node_modules/.bin/prettier --check "${format_files[@]}"
          fi
      - name: Validate deterministic repository policy
        working-directory: .candidate
        shell: bash
        env:
          BASE_REF: ${{ needs.classify.outputs.base_sha }}
          LEARNING: ${{ needs.classify.outputs.learning }}
          PRIVILEGED: ${{ needs.classify.outputs.privileged }}
          WORKFLOW: ${{ needs.classify.outputs.workflow }}
        run: |
          set -euo pipefail
          npm run ops:validate-autonomous-policy
          node scripts/policy-guardrails.mjs
          node --test scripts/test/path-classifier.test.mjs scripts/test/gate-aggregate.test.mjs
          if [ "$LEARNING" = 'true' ]; then
            node scripts/agent-learning/validate-artifacts.mjs
            node scripts/agent-learning/generate-index.mjs --check
            node --test scripts/test/agent-learning-artifacts.test.mjs
          fi
          if [ "$PRIVILEGED" = 'true' ]; then
            node scripts/check-architecture.mjs
            node scripts/validate-agent-skills.mjs
          fi
          if [ "$WORKFLOW" = 'true' ]; then
            node --test \
              scripts/test/deployment-impact.test.mjs \
              scripts/test/deployment-generation.test.mjs \
              scripts/test/delivery-v2-workflow.test.mjs \
              scripts/test/known-good-release.test.mjs \
              scripts/test/agent-learning-triage.test.mjs
          fi
      - name: Enforce cost and dependency policy when applicable
        working-directory: .candidate
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify.outputs.base_sha }}
          DEPENDENCIES: ${{ needs.classify.outputs.dependencies }}
          INFRASTRUCTURE: ${{ needs.classify.outputs.infrastructure }}
          WORKFLOW: ${{ needs.classify.outputs.workflow }}
        run: |
          set -euo pipefail
          if [ "$DEPENDENCIES" = 'true' ]; then
            node --test scripts/test/dependency-supply-chain.test.mjs
            BASE_REF="$BASE_SHA" node scripts/check-lockfile-policy.mjs
          fi
          if [ "$INFRASTRUCTURE" != 'true' ] && [ "$WORKFLOW" != 'true' ]; then
            exit 0
          fi
          paid_patterns='Microsoft.Sql|Microsoft.DocumentDB|Microsoft.ApiManagement|Microsoft.Cdn/profiles|Microsoft.Network/frontDoors|Microsoft.Search|Microsoft.CognitiveServices|Microsoft.MachineLearningServices|Microsoft.ContainerService|Microsoft.App/managedEnvironments'
          if git diff "$BASE_SHA" HEAD -- . ':!docs/cost/**' | grep -E "^\+.*(resource[[:space:]].*'($paid_patterns)|['\"]type['\"]?[[:space:]]*[:=][[:space:]]*['\"]?($paid_patterns))"; then
            git diff --name-only "$BASE_SHA" HEAD | grep -q '^docs/cost/'
          fi

  backend:
    name: backend and contracts
    if: needs.classify.outputs.backend == 'true' || needs.classify.outputs.contracts == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, compile once, and run affected API tests
        shell: bash
        env:
          BACKEND: ${{ needs.classify.outputs.backend }}
        run: |
          set -euo pipefail
          if [ "$BACKEND" = 'true' ]; then
            ./node_modules/.bin/eslint apps/api --max-warnings 0
          fi
          ./node_modules/.bin/tsc -p apps/api/tsconfig.json
          if [ "$BACKEND" = 'true' ]; then
            node --test apps/api/test/*.test.mjs
          fi
      - name: Validate API contracts and operation drift
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < <(find contracts -type f \( -iname '*openapi*.yml' -o -iname '*openapi*.yaml' -o -iname '*openapi*.json' \) -print)
          for spec in "${specs[@]}"; do
            ./node_modules/.bin/redocly lint "$spec"
          done
          node scripts/check-openapi-route-drift.mjs
          node scripts/check-operation-contract-drift.mjs

  operations:
    name: operations validation
    if: needs.classify.outputs.operations == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Compile API prerequisites once and validate repository operations
        run: |
          node node_modules/typescript/bin/tsc -p apps/api/tsconfig.json
          node scripts/run-tests.mjs scripts/test

  frontend:
    name: frontend validation
    if: needs.classify.outputs.frontend == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, test, type-check, and build Angular once
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/eslint apps/web --max-warnings 0
          node --test apps/web/test/*.test.mjs
          ./node_modules/.bin/ng build --configuration production --no-progress

  portability:
    name: local development (${{ matrix.os }})
    if: needs.classify.outputs.agent_environment == 'true'
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify classified candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.classify.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify local process management and frontend tests
        run: >-
          node scripts/run-tests.mjs
          scripts/agent-env/test
          apps/web/test
          scripts/test/run-tests.test.mjs
          scripts/test/setup-codex-env.test.mjs
          scripts/test/maintain-codex-env.test.mjs
      - name: Install pinned Azure Functions Core Tools
        run: npm install --global azure-functions-core-tools@4.13.0
      - name: Start local environment
        run: npm run agent:env:start
      - name: Inspect detached local services
        run: npm run agent:env:status
      - name: Verify running local environment
        run: npm run agent:verify
      - name: Stop local environment
        if: always()
        run: npm run agent:env:stop

  infrastructure:
    name: Bicep validation
    if: needs.classify.outputs.infrastructure == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Azure CLI
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # tag=v2
        with:
          inlineScript: az version
      - name: Build Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          while IFS= read -r -d '' file; do
            az bicep build --file "$file" --stdout >/dev/null
          done < <(find infra -type f -name '*.bicep' -print0)

  workflow:
    name: workflow and shell validation
    if: needs.classify.outputs.workflow == 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # tag=v6
        with:
          go-version: 'stable'
          cache: false
      - name: Validate workflows and shell
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mapfile -t workflow_files < <(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name 'repair-triage.yml' -print | sort
          )
          actionlint -shellcheck=shellcheck "${workflow_files[@]}"
          # actionlint v1.7.7 does not yet recognize GitHub's concurrency.queue key
          # (https://github.com/rhysd/actionlint/issues/680). Scope the compatibility
          # ignore to the one workflow whose exact max/false declaration is regression-tested.
          actionlint -shellcheck=shellcheck \
            -ignore '^unexpected key "queue" for "concurrency" section\.' \
            .github/workflows/repair-triage.yml
          mapfile -d '' shell_files < <(find scripts -type f -name '*.sh' -print0)
          if [ "${#shell_files[@]}" -gt 0 ]; then
            shellcheck "${shell_files[@]}"
          fi

  aggregate:
    name: PR Gate
    if: always()
    needs:
      - classify
      - policy
      - backend
      - operations
      - frontend
      - portability
      - infrastructure
      - workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: .candidate
          persist-credentials: false
      - name: Checkout protected base aggregate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-base
          persist-credentials: false
      - name: Verify explicit PR Gate dependencies
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_ROOT: ${{ github.workspace }}/.candidate
          EVENT_NAME: ${{ github.event_name }}
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FLAGS_JSON: ${{ needs.classify.outputs.flags_json }}
          GATE: pr
          NEEDS_JSON: ${{ toJson(needs) }}
          PROFILE: ${{ needs.classify.outputs.profile }}
          STARTED_AT_EPOCH: ${{ needs.classify.outputs.started_at_epoch }}
          TRUSTED_ROOT: ${{ github.workspace }}/.trusted-base
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            (
              cd "$CANDIDATE_ROOT"
              node scripts/verify-gate-results.mjs
            )
            exit 0
          fi

          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" = "$BASE_SHA"
          trusted_output="$RUNNER_TEMP/pr-gate-trusted-classification"
          rm -f "$trusted_output"
          (
            cd "$CANDIDATE_ROOT"
            node "$TRUSTED_ROOT/scripts/classify-pr-paths.mjs" \
              --base "$BASE_SHA" \
              --head "$EXACT_SHA" \
              --output "$trusted_output" >/dev/null
          )
          trusted_flags_json="$(sed -n 's/^flags_json=//p' "$trusted_output")"
          test -n "$trusted_flags_json"
          FLAGS_JSON="$trusted_flags_json" node "$TRUSTED_ROOT/scripts/verify-gate-results.mjs"
