name: Codex Auto-Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  repository_dispatch:
    types: [codex-automerge]

# pull_request_target is intentional: this workflow executes only the trusted
# controller from main and never checks out or executes pull-request code.
permissions:
  contents: read

concurrency:
  group: codex-automerge-${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve autonomous merge candidate
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve immutable pull-request identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR_NUMBER:-${EVENT_PR_NUMBER:-}}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "A positive pull-request number is required." >&2
            exit 1
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          labels="$(jq -r '[.labels[].name] | join(",")' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name // ""' <<<"$pr_json")"

          eligible=false
          if [ "$draft" = "false" ] && [ "$head_repo" = "$base_repo" ] && {
            [[ "$head_ref" == codex/* ]] ||
            [[ "$head_ref" == codex-* ]] ||
            grep -Eq '(^|,)codex-automerge(,|$)' <<<"$labels"
          }; then
            eligible=true
          fi
          if grep -Eq '(^|,)(do-not-merge|security-hold)(,|$)' <<<"$labels"; then
            eligible=false
          fi

          {
            echo "eligible=$eligible"
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

          if [ "$eligible" != "true" ]; then
            gh api \
              --method POST \
              "repos/$REPOSITORY/check-runs" \
              -f name='Autonomous review complete' \
              -f head_sha="$head_sha" \
              -f status='completed' \
              -f conclusion='failure' \
              -f external_id="juez-autonomous-review-eligibility:v1:$REPOSITORY:pull:$pr_number:head:$head_sha:run:${{ github.run_id }}" \
              -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f 'output[title]=Autonomous review ineligible' \
              -f 'output[summary]=The pull request is draft, forked, outside the allowed branch/label policy, or carries a blocking label.' \
              >/dev/null
          fi

  autonomous-review:
    name: perform autonomous review
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.review.outputs.decision }}
      reviewed_head_sha: ${{ steps.review.outputs.reviewed_head_sha }}
      high_risk: ${{ steps.review.outputs.high_risk }}
      model_invoked: ${{ steps.review.outputs.model_invoked }}
      claim_status: ${{ steps.review.outputs.claim_status }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install trusted controller dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Wait for free deterministic exact-head checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-merge-controller.mjs preflight \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --wait-seconds 3600 \
            --poll-seconds 15
      - name: Claim exact head and run deterministic classification and independent review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTONOMOUS_REVIEW_LIVE_API_ENABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-merge-controller.mjs review \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --run-id "${{ github.run_id }}" \
            --review-file "$RUNNER_TEMP/autonomous-review.json"
      - name: Upload sanitized review evidence
        id: review_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: autonomous-review-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/autonomous-review.json
          if-no-files-found: error
          retention-days: 365

  trusted-program-evidence:
    name: verify trusted agent-learning program evidence
    needs: [resolve, autonomous-review]
    if: >-
      ${{
        needs.resolve.outputs.eligible == 'true' &&
        needs.autonomous-review.result == 'success'
      }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Checkout trusted program-evidence controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install trusted verifier dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Download exact-head reviewed decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag=v4
        with:
          name: autonomous-review-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/autonomous-review
      - name: Verify candidate program evidence with trusted controller code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/agent-learning/verify-program-evidence.mjs trusted-pr \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --controller-run-id "${{ github.run_id }}" \
            --controller-sha "${{ github.workflow_sha }}" \
            --review-file "$RUNNER_TEMP/autonomous-review/autonomous-review.json" \
            --output-file "$RUNNER_TEMP/trusted-program-evidence.json"
      - name: Upload sanitized program-evidence verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: trusted-program-evidence-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/trusted-program-evidence.json
          if-no-files-found: error
          retention-days: 365

  publish-review-check:
    name: publish autonomous review check
    needs: [resolve, autonomous-review, trusted-program-evidence]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.eligible == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Complete exact-head review check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_STATUS: ${{ needs.autonomous-review.outputs.claim_status }}
          REVIEW_RESULT: ${{ needs.autonomous-review.result }}
          REVIEW_DECISION: ${{ needs.autonomous-review.outputs.decision }}
          REVIEWED_HEAD_SHA: ${{ needs.autonomous-review.outputs.reviewed_head_sha }}
          PROGRAM_EVIDENCE_RESULT: ${{ needs.trusted-program-evidence.result }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HIGH_RISK: ${{ needs.autonomous-review.outputs.high_risk }}
          MODEL_INVOKED: ${{ needs.autonomous-review.outputs.model_invoked }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          claim_state_valid=true
          if { [ "$HIGH_RISK" = "true" ] && [ "$CLAIM_STATUS" != "new" ]; } ||
             { [ "$HIGH_RISK" != "true" ] && [ "$CLAIM_STATUS" != "not_required" ]; }; then
            echo "Exact-head review claim state does not match the review path." >&2
            claim_state_valid=false
          fi
          conclusion=failure
          title='Autonomous review failed'
          summary='The review workflow did not approve this exact pull-request head.'
          if [ "$claim_state_valid" = "true" ] &&
             [ "$REVIEW_RESULT" = "success" ] &&
             [ "$REVIEW_DECISION" = "approve" ] &&
             [ "$PROGRAM_EVIDENCE_RESULT" = "success" ] &&
             [ "$REVIEWED_HEAD_SHA" = "$EXPECTED_HEAD_SHA" ]; then
            conclusion=success
            title='Autonomous review approved'
            summary="Exact head $EXPECTED_HEAD_SHA passed autonomous review and trusted program-evidence verification (high-risk: ${HIGH_RISK:-unknown}, model invoked: ${MODEL_INVOKED:-unknown})."
          fi

          gh api \
            --method POST \
            "repos/$REPOSITORY/check-runs" \
            -f name='Autonomous review complete' \
            -f head_sha="$EXPECTED_HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f external_id="juez-autonomous-review-decision:v1:$REPOSITORY:pull:$PR_NUMBER:head:$EXPECTED_HEAD_SHA:run:$RUN_ID" \
            -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" \
            >/dev/null

          if [ "$conclusion" != "success" ]; then
            exit 1
          fi

  exact-head-gate:
    name: merge exact PR head
    needs: [resolve, autonomous-review, trusted-program-evidence, publish-review-check]
    if: >-
      ${{
        needs.resolve.outputs.eligible == 'true' &&
        needs.autonomous-review.result == 'success' &&
        needs.trusted-program-evidence.result == 'success' &&
        needs.publish-review-check.result == 'success'
      }}
    timeout-minutes: 70
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install trusted controller dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Download exact-head review evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag=v4
        with:
          name: autonomous-review-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/autonomous-review
      - name: Wait for required checks and merge the exact reviewed head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-merge-controller.mjs gate \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --review-file "$RUNNER_TEMP/autonomous-review/autonomous-review.json" \
            --wait-seconds 3600 \
            --poll-seconds 15 \
            --merge true
