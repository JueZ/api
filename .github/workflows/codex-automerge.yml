name: Codex Auto-Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  repository_dispatch:
    types: [codex-automerge]

# pull_request_target is intentional: this workflow executes only the trusted
# controller from main and never checks out or executes pull-request code.
permissions:
  contents: read

concurrency:
  group: codex-automerge-${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve autonomous merge candidate
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve immutable pull-request identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR_NUMBER:-${EVENT_PR_NUMBER:-}}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "A positive pull-request number is required." >&2
            exit 1
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          labels="$(jq -r '[.labels[].name] | join(",")' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name // ""' <<<"$pr_json")"

          eligible=false
          if [ "$draft" = "false" ] && [ "$head_repo" = "$base_repo" ] && {
            [[ "$head_ref" == codex/* ]] ||
            [[ "$head_ref" == codex-* ]] ||
            grep -Eq '(^|,)codex-automerge(,|$)' <<<"$labels"
          }; then
            eligible=true
          fi
          if grep -Eq '(^|,)(do-not-merge|security-hold)(,|$)' <<<"$labels"; then
            eligible=false
          fi

          {
            echo "eligible=$eligible"
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

          if [ "$eligible" != "true" ]; then
            gh api \
              --method POST \
              "repos/$REPOSITORY/check-runs" \
              -f name='Autonomous review complete' \
              -f head_sha="$head_sha" \
              -f status='completed' \
              -f conclusion='failure' \
              -f external_id="juez-autonomous-governance-eligibility:v1:$REPOSITORY:pull:$pr_number:head:$head_sha:run:${{ github.run_id }}" \
              -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f 'output[title]=Autonomous governance ineligible' \
              -f 'output[summary]=The pull request is draft, forked, outside the allowed branch/label policy, or carries a blocking label.' \
              >/dev/null
            echo "The pull request is not eligible for autonomous merge; the denial check was published." >&2
            exit 1
          fi

  autonomous-governance:
    name: verify autonomous governance
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.governance.outputs.decision }}
      verified_head_sha: ${{ steps.governance.outputs.verified_head_sha }}
      high_risk: ${{ steps.governance.outputs.high_risk }}
      evaluator: ${{ steps.governance.outputs.evaluator }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install trusted controller dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Wait for free deterministic exact-head checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-merge-controller.mjs preflight \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --wait-seconds 3600 \
            --poll-seconds 15
      - name: Verify exact-head deterministic governance
        id: governance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-merge-controller.mjs governance \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --run-id "${{ github.run_id }}" \
            --governance-file "$RUNNER_TEMP/autonomous-governance.json"
      - name: Verify agent-learning program evidence
        id: program_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/agent-learning/verify-program-evidence.mjs trusted-pr \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --controller-run-id "${{ github.run_id }}" \
            --controller-sha "${{ github.workflow_sha }}" \
            --governance-file "$RUNNER_TEMP/autonomous-governance.json" \
            --output-file "$RUNNER_TEMP/agent-learning-program-verification.json"
      - name: Upload sanitized agent-learning program verification
        if: always() && steps.governance.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: agent-learning-program-verification-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/agent-learning-program-verification.json
          if-no-files-found: error
          retention-days: 365
      - name: Upload sanitized governance evidence
        id: governance_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7.0.1
        with:
          name: autonomous-governance-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/autonomous-governance.json
          if-no-files-found: error
          retention-days: 365

  publish-governance-check:
    name: publish autonomous governance check
    needs: [resolve, autonomous-governance]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.eligible == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Complete exact-head governance check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GOVERNANCE_RESULT: ${{ needs.autonomous-governance.result }}
          GOVERNANCE_DECISION: ${{ needs.autonomous-governance.outputs.decision }}
          VERIFIED_HEAD_SHA: ${{ needs.autonomous-governance.outputs.verified_head_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HIGH_RISK: ${{ needs.autonomous-governance.outputs.high_risk }}
          EVALUATOR: ${{ needs.autonomous-governance.outputs.evaluator }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=failure
          title='Autonomous governance failed'
          summary='The protected controller did not verify this exact pull-request head.'
          if [ "$GOVERNANCE_RESULT" = "success" ] &&
             [ "$GOVERNANCE_DECISION" = "approve" ] &&
             [ "$VERIFIED_HEAD_SHA" = "$EXPECTED_HEAD_SHA" ] &&
             [ "$EVALUATOR" = "deterministic-protected-controller-v1" ]; then
            conclusion=success
            title='Autonomous governance verified'
            summary="Exact head $EXPECTED_HEAD_SHA passed deterministic protected governance (high-risk classification: ${HIGH_RISK:-unknown}); no model was invoked."
          fi

          gh api \
            --method POST \
            "repos/$REPOSITORY/check-runs" \
            -f name='Autonomous review complete' \
            -f head_sha="$EXPECTED_HEAD_SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f external_id="juez-autonomous-governance-decision:v1:$REPOSITORY:pull:$PR_NUMBER:head:$EXPECTED_HEAD_SHA:run:$RUN_ID" \
            -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary" \
            >/dev/null

          if [ "$conclusion" != "success" ]; then
            exit 1
          fi

  exact-head-gate:
    name: merge exact PR head
    needs: [resolve, autonomous-governance, publish-governance-check]
    if: >-
      ${{
        needs.resolve.outputs.eligible == 'true' &&
        needs.autonomous-governance.result == 'success' &&
        needs.publish-governance-check.result == 'success'
      }}
    timeout-minutes: 70
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install trusted controller dependencies
        shell: bash
        run: npm ci --ignore-scripts
      - name: Download exact-head governance evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # tag=v4
        with:
          name: autonomous-governance-${{ needs.resolve.outputs.head_sha }}
          path: ${{ runner.temp }}/autonomous-governance
      - name: Wait for required checks and merge the exact governed head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autonomous-merge-controller.mjs gate \
            --repository "${{ github.repository }}" \
            --pr "${{ needs.resolve.outputs.pr_number }}" \
            --head-sha "${{ needs.resolve.outputs.head_sha }}" \
            --governance-file "$RUNNER_TEMP/autonomous-governance/autonomous-governance.json" \
            --wait-seconds 3600 \
            --poll-seconds 15 \
            --merge true
