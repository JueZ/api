name: Codex Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codex-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory-scan:
    name: advisory Codex Security scan
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.actor != 'dependabot[bot]'
      }}
    # Ubuntu 24.04 restricts unprivileged user namespaces in a way that can
    # prevent the Codex Bubblewrap sandbox from starting. Keep this job on the
    # supported 22.04 image until the upstream sandbox compatibility issue is
    # resolved, and prove sandbox writes before exposing the scan credential.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # tag=v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag=v7
        with:
          python-version: '3.12'

      - name: Fetch the exact-head scanner lock outside the checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          SCANNER_ROOT: ${{ runner.temp }}/codex-security
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull-request head must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [ -e "$SCANNER_ROOT" ]; then
            echo "Codex Security install directory must start absent." >&2
            exit 1
          fi
          install -d -m 700 "$SCANNER_ROOT"

          for manifest_name in package.json package-lock.json; do
            response_file="$RUNNER_TEMP/codex-security-$manifest_name-response.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/contents/.github/codex-security/$manifest_name?ref=$HEAD_SHA" \
              > "$response_file"
            jq -e '
              .type == "file" and
              .encoding == "base64" and
              (.content | type == "string")
            ' "$response_file" >/dev/null
            jq -r '.content' "$response_file" | base64 --decode > "$SCANNER_ROOT/$manifest_name"
          done
          chmod 600 "$SCANNER_ROOT/package.json" "$SCANNER_ROOT/package-lock.json"

          jq -e '
            .private == true and
            (has("scripts") | not) and
            .dependencies == {"@openai/codex-security": "0.1.3"}
          ' "$SCANNER_ROOT/package.json" >/dev/null
          jq -e '
            .lockfileVersion == 3 and
            .packages[""].dependencies == {"@openai/codex-security": "0.1.3"} and
            .packages["node_modules/@openai/codex-security"].version == "0.1.3" and
            all(
              .packages | to_entries[];
              .key == "" or
              (
                (.value.resolved | type == "string") and
                (.value.resolved | startswith("https://registry.npmjs.org/")) and
                (.value.integrity | type == "string") and
                (.value.integrity | startswith("sha512-"))
              )
            )
          ' "$SCANNER_ROOT/package-lock.json" >/dev/null

      - name: Install Codex Security outside the checkout
        shell: bash
        env:
          SCANNER_ROOT: ${{ runner.temp }}/codex-security
        run: |
          set -euo pipefail
          npm ci \
            --prefix "$SCANNER_ROOT" \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Verify the pinned Codex Security CLI
        shell: bash
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
        run: |
          set -euo pipefail
          test -x "$CODEX_SECURITY_BIN"
          installed_version="$("$CODEX_SECURITY_BIN" --version)"
          if [ "$installed_version" != "0.1.3" ]; then
            echo "Unexpected Codex Security version: $installed_version" >&2
            exit 1
          fi
          echo "Verified Codex Security CLI version $installed_version."

      - name: Verify the Codex scan sandbox can write
        shell: bash
        env:
          CODEX_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex
          CODEX_HOME: ${{ runner.temp }}/codex-security-sandbox-probe-home
          SANDBOX_PROBE_DIR: ${{ runner.temp }}/codex-security-sandbox-probe
        run: |
          set -euo pipefail
          umask 077
          test -x "$CODEX_BIN"
          if [ -e "$SANDBOX_PROBE_DIR" ]; then
            echo "Codex sandbox probe directory must start absent." >&2
            exit 1
          fi
          install -d -m 700 "$CODEX_HOME" "$SANDBOX_PROBE_DIR"

          "$CODEX_BIN" sandbox \
            --config 'permissions.codex_security_scan.filesystem={":root"="read",":workspace_roots"="write"}' \
            --permission-profile codex_security_scan \
            --cd "$SANDBOX_PROBE_DIR" \
            /bin/sh -c 'set -eu; : > sandbox-write-probe; test -f sandbox-write-probe'

          test -f "$SANDBOX_PROBE_DIR/sandbox-write-probe"

      - name: Verify sealed-result export without API access
        shell: bash
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          EXAMPLE_SCAN_DIR: ${{ runner.temp }}/codex-security/node_modules/@openai/codex-security/_bundled_plugin/examples/completed-scan
          EXAMPLE_SARIF: ${{ runner.temp }}/codex-security-example.sarif
        run: |
          set -euo pipefail
          umask 077
          test -f "$EXAMPLE_SCAN_DIR/scan-manifest.json"
          test -f "$EXAMPLE_SCAN_DIR/findings.json"
          test -f "$EXAMPLE_SCAN_DIR/coverage.json"
          "$CODEX_SECURITY_BIN" export "$EXAMPLE_SCAN_DIR" \
            --export-format sarif \
            --source-root "$RUNNER_TEMP" \
            --output "$EXAMPLE_SARIF"
          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array") and
            (.runs | length > 0)
          ' "$EXAMPLE_SARIF" >/dev/null

      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the immutable scan target
        id: scan-target
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull-request base and head must be full lowercase commit SHAs." >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The checkout does not match the exact pull-request head SHA." >&2
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          base_revision="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if [[ ! "$base_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Git did not resolve an immutable pull-request merge base." >&2
            exit 1
          fi
          echo "base_revision=$base_revision" >> "$GITHUB_OUTPUT"

      - name: Prepare trusted base knowledge
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_KB_DIR: ${{ runner.temp }}/codex-security-knowledge-base
        run: |
          set -euo pipefail
          umask 077
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pull-request base must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [ -e "$TRUSTED_KB_DIR" ]; then
            echo "Trusted knowledge-base directory must start absent." >&2
            exit 1
          fi

          knowledge_paths=(
            AGENTS.md
            .github/AGENTS.md
            docs/security
            docs/architecture
            docs/project-memory/current-state.md
          )
          unsafe_mode="$(
            git ls-tree -r "$BASE_SHA" -- "${knowledge_paths[@]}" |
              awk '$1 != "100644" && $1 != "100755" { print $1; exit }'
          )"
          if [ -n "$unsafe_mode" ]; then
            echo "Trusted knowledge-base inputs must contain only regular files." >&2
            exit 1
          fi

          archive_file="$RUNNER_TEMP/codex-security-knowledge-base.tar"
          git archive \
            --format=tar \
            --output="$archive_file" \
            "$BASE_SHA" \
            -- "${knowledge_paths[@]}"
          install -d -m 700 "$TRUSTED_KB_DIR"
          tar -xf "$archive_file" -C "$TRUSTED_KB_DIR"
          chmod -R go-rwx "$TRUSTED_KB_DIR"

          test -f "$TRUSTED_KB_DIR/AGENTS.md"
          test -f "$TRUSTED_KB_DIR/.github/AGENTS.md"
          test -d "$TRUSTED_KB_DIR/docs/security"
          test -d "$TRUSTED_KB_DIR/docs/architecture"
          test -f "$TRUSTED_KB_DIR/docs/project-memory/current-state.md"
          if find "$TRUSTED_KB_DIR" -mindepth 1 ! -type d ! -type f -print -quit | grep -q .; then
            echo "Trusted knowledge-base extraction contains a non-regular entry." >&2
            exit 1
          fi

      - name: Validate scan configuration without API access
        shell: bash
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          CODEX_SECURITY_STATE_DIR: ${{ runner.temp }}/codex-security-preflight-state
          BASE_REVISION: ${{ steps.scan-target.outputs.base_revision }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREFLIGHT_DIR: ${{ runner.temp }}/codex-security-preflight-results
          PREFLIGHT_JSON: ${{ runner.temp }}/codex-security-dry-run.json
          TRUSTED_KB_DIR: ${{ runner.temp }}/codex-security-knowledge-base
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$CODEX_SECURITY_STATE_DIR"
          if [ -e "$PREFLIGHT_DIR" ]; then
            echo "Codex Security preflight output directory must start absent." >&2
            exit 1
          fi

          "$CODEX_SECURITY_BIN" scan . \
            --diff "$BASE_REVISION" \
            --head "$HEAD_SHA" \
            --mode standard \
            --model gpt-5.6-luna \
            --effort minimal \
            --max-cost 0.1 \
            --knowledge-base "$TRUSTED_KB_DIR/AGENTS.md" \
            --knowledge-base "$TRUSTED_KB_DIR/.github/AGENTS.md" \
            --knowledge-base "$TRUSTED_KB_DIR/docs/security" \
            --knowledge-base "$TRUSTED_KB_DIR/docs/architecture" \
            --knowledge-base "$TRUSTED_KB_DIR/docs/project-memory/current-state.md" \
            --output-dir "$PREFLIGHT_DIR" \
            --dry-run \
            --json > "$PREFLIGHT_JSON"

      - name: Scan committed pull-request changes
        id: scan
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          CODEX_SECURITY_STATE_DIR: ${{ runner.temp }}/codex-security-state
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REVISION: ${{ steps.scan-target.outputs.base_revision }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
          RESULT_JSON: ${{ runner.temp }}/codex-security.json
          SCAN_LOG: ${{ runner.temp }}/codex-security-scan.log
          TRUSTED_KB_DIR: ${{ runner.temp }}/codex-security-knowledge-base
        run: |
          set -euo pipefail
          umask 077
          : "${OPENAI_API_KEY:?CODEX_SECURITY_API_KEY repository secret is required}"
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The checkout does not match the exact pull-request head SHA." >&2
            exit 1
          fi
          if [ "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" != "$BASE_REVISION" ]; then
            echo "The pull-request merge base changed after preflight." >&2
            exit 1
          fi

          install -d -m 700 "$CODEX_SECURITY_STATE_DIR"
          if [ -e "$SCAN_DIR" ]; then
            echo "Codex Security output directory must start absent." >&2
            exit 1
          fi
          : > "$RESULT_JSON"
          : > "$SCAN_LOG"

          "$CODEX_SECURITY_BIN" scan . \
            --diff "$BASE_REVISION" \
            --head "$HEAD_SHA" \
            --mode standard \
            --auth api-key \
            --model gpt-5.6-luna \
            --effort minimal \
            --max-cost 0.1 \
            --knowledge-base "$TRUSTED_KB_DIR/AGENTS.md" \
            --knowledge-base "$TRUSTED_KB_DIR/.github/AGENTS.md" \
            --knowledge-base "$TRUSTED_KB_DIR/docs/security" \
            --knowledge-base "$TRUSTED_KB_DIR/docs/architecture" \
            --knowledge-base "$TRUSTED_KB_DIR/docs/project-memory/current-state.md" \
            --output-dir "$SCAN_DIR" \
            --json > "$RESULT_JSON" \
            2> >(tee "$SCAN_LOG" >&2)

      - name: Export sealed results to SARIF
        id: export-sarif
        if: always()
        shell: bash
        env:
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
          SARIF_FILE: ${{ runner.temp }}/codex-security.sarif
        run: |
          set -euo pipefail
          umask 077
          if [ ! -f "$SCAN_DIR/scan-manifest.json" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No sealed scan manifest was available for SARIF export."
            exit 0
          fi

          "$CODEX_SECURITY_BIN" export "$SCAN_DIR" \
            --export-format sarif \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$SARIF_FILE"
          test -s "$SARIF_FILE"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload exact-head SARIF
        if: always() && steps.export-sarif.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # tag=v4
        with:
          sarif_file: ${{ runner.temp }}/codex-security.sarif
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
          category: codex-security

      - name: Write safe scan summary
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RESULT_JSON: ${{ runner.temp }}/codex-security.json
          SCAN_LOG: ${{ runner.temp }}/codex-security-scan.log
          SCAN_DIR: ${{ runner.temp }}/codex-security-results
          SARIF_FILE: ${{ runner.temp }}/codex-security.sarif
        run: |
          set -euo pipefail
          scan_status="not sealed"
          coverage="unavailable"
          estimated_cost="unavailable"
          deferred="unavailable"
          findings="unavailable"
          scan_outcome="unknown"

          # SCAN_OUTCOME is assigned through the workflow step environment.
          # shellcheck disable=SC2153
          case "$SCAN_OUTCOME" in
            success|failure|cancelled|skipped) scan_outcome="$SCAN_OUTCOME" ;;
          esac

          manifest_file="$SCAN_DIR/scan-manifest.json"
          coverage_file="$SCAN_DIR/coverage.json"
          findings_file="$SCAN_DIR/findings.json"

          if [ -f "$manifest_file" ] && jq -e '.scan.status == "completed"' "$manifest_file" >/dev/null 2>&1; then
            scan_status="completed"
          fi

          if [ -f "$coverage_file" ] && jq -e '.completeness | type == "string"' "$coverage_file" >/dev/null 2>&1; then
            candidate_coverage="$(jq -r '.completeness' "$coverage_file")"
            case "$candidate_coverage" in
              complete|partial|unknown) coverage="$candidate_coverage" ;;
            esac
            if jq -e '.deferred | type == "array"' "$coverage_file" >/dev/null 2>&1; then
              deferred_count="$(jq -r '.deferred | length' "$coverage_file")"
              if [ "$deferred_count" -gt 0 ]; then
                deferred="yes ($deferred_count)"
              else
                deferred="no"
              fi
            fi
          fi

          if [ -f "$RESULT_JSON" ] && jq -e 'type == "object"' "$RESULT_JSON" >/dev/null 2>&1; then
            if jq -e '.cost.estimatedUsd | type == "number" and . >= 0' "$RESULT_JSON" >/dev/null 2>&1; then
              cost_value="$(jq -r '.cost.estimatedUsd' "$RESULT_JSON")"
              printf -v estimated_cost '%.6f USD' "$cost_value"
            fi
          fi

          if [ -f "$SCAN_LOG" ]; then
            budget_line="$(
              grep -E 'Scan stopped: estimated cost [^0-9]*[0-9]+([.][0-9]+)? exceeded the [^0-9]*[0-9]+([.][0-9]+)? limit' "$SCAN_LOG" |
                tail -n 1 || true
            )"
            if [ -n "$budget_line" ]; then
              budget_cost="$(sed -nE 's/.*estimated cost [^0-9]*([0-9]+([.][0-9]+)?) exceeded.*/\1/p' <<<"$budget_line")"
              if [[ "$budget_cost" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                estimated_cost="$budget_cost USD"
              fi
              scan_status="budget exhausted before sealing"
              coverage="incomplete (budget limit)"
              deferred="unknown (scan incomplete)"
            fi
          fi

          counts_json='{"critical":0,"high":0,"medium":0,"low":0,"informational":0}'
          counts_available=false
          if [ -f "$findings_file" ] && jq -e '.findings | type == "array"' "$findings_file" >/dev/null 2>&1; then
            counts_json="$(jq -c '
              reduce (.findings[]?.severity.level // empty) as $severity
                ({critical: 0, high: 0, medium: 0, low: 0, informational: 0};
                  if has($severity) then .[$severity] += 1 else . end)
            ' "$findings_file")"
            counts_available=true
          elif [ -f "$RESULT_JSON" ] && jq -e '.findings.findings | type == "array"' "$RESULT_JSON" >/dev/null 2>&1; then
            counts_json="$(jq -c '
              reduce (.findings.findings[]?.severity.level // empty) as $severity
                ({critical: 0, high: 0, medium: 0, low: 0, informational: 0};
                  if has($severity) then .[$severity] += 1 else . end)
            ' "$RESULT_JSON")"
            counts_available=true
          fi
          if [ "$counts_available" = "true" ]; then
            findings="critical=$(jq -r '.critical' <<<"$counts_json"), high=$(jq -r '.high' <<<"$counts_json"), medium=$(jq -r '.medium' <<<"$counts_json"), low=$(jq -r '.low' <<<"$counts_json"), informational=$(jq -r '.informational' <<<"$counts_json")"
          fi

          sarif="no"
          if [ -s "$SARIF_FILE" ]; then
            sarif="yes"
          fi

          {
            echo "### Advisory Codex Security scan"
            echo "- Scan status: $scan_status"
            echo "- Scanner step outcome: $scan_outcome"
            echo "- Coverage completeness: $coverage"
            echo "- Estimated cost: $estimated_cost"
            echo "- Configured cost limit: 0.10 USD"
            echo "- Finding counts: $findings"
            echo "- SARIF produced: $sarif"
            echo "- Surfaces deferred: $deferred"
            echo "- Severity policy: advisory; findings do not fail this check"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve private scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # tag=v7
        with:
          name: codex-security-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/codex-security-results
            ${{ runner.temp }}/codex-security.json
            ${{ runner.temp }}/codex-security.sarif
            ${{ runner.temp }}/codex-security-dry-run.json
          if-no-files-found: warn
          retention-days: 7
