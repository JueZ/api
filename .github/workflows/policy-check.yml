name: Policy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cost-policy-check:
    name: cost-policy check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          fetch-depth: 0
      - name: Detect paid Azure service additions without cost note
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            base_ref="HEAD~1"
          fi
          changed=$(git diff --name-only "$base_ref" HEAD || true)
          if ! echo "$changed" | grep -qE '(^infra/|\.bicep$|\.github/workflows/)'; then
            echo "No infrastructure or workflow changes requiring cost-policy review."
            exit 0
          fi
          paid_patterns='Microsoft.Sql|Microsoft.DocumentDB|Microsoft.ApiManagement|Microsoft.Cdn/profiles|Microsoft.Network/frontDoors|Microsoft.Search|Microsoft.CognitiveServices|Microsoft.MachineLearningServices|Microsoft.ContainerService|Microsoft.App/managedEnvironments'
          # Match actual added resource declarations instead of the guardrail's own pattern list.
          if git diff "$base_ref" HEAD -- . ':!docs/cost/**' | grep -E "^\+.*(resource[[:space:]].*'($paid_patterns)|['\"]type['\"]?[[:space:]]*[:=][[:space:]]*['\"]?($paid_patterns))"; then
            if git diff --name-only "$base_ref" HEAD | grep -q '^docs/cost/'; then
              echo "Paid Azure service addition has a docs/cost note."
            else
              echo "Paid Azure service addition requires a docs/cost note."
              exit 1
            fi
          else
            echo "No blocked paid Azure service additions detected."
          fi

  guardrail-policy-check:
    name: guardrail policy check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # tag=v6
        with:
          node-version: '22'
      - name: Fail closed on forbidden security or automation changes
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            base_ref="HEAD~1"
          fi
          BASE_REF="$base_ref" npm run ops:policy-guardrails
          echo "Guardrail policy check passed."

  dependency-lock-policy:
    name: dependency lock policy
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # tag=v6
        with:
          fetch-depth: 0
      - name: Enforce reviewed registry-only lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          if ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            base_ref="HEAD~1"
          fi
          BASE_REF="$base_ref" node scripts/check-lockfile-policy.mjs

  policy-complete:
    name: Policy complete
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - cost-policy-check
      - guardrail-policy-check
      - dependency-lock-policy
    if: always()
    steps:
      - name: Verify all policy jobs passed
        shell: bash
        run: |
          set -euo pipefail
          results='${{ toJson(needs) }}'
          echo "$results"
          if echo "$results" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null; then
            echo "All policy checks passed."
          else
            echo "One or more policy checks failed."
            exit 1
          fi
