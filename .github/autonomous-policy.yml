version: 2

# The only branch-required contexts. Internal jobs stay explicit in their owning
# workflow aggregate; optional checks never become undeclared merge blockers.
requiredChecks:
  - name: PR Gate
    appSlug: github-actions
  - name: Security Gate
    appSlug: github-actions

# Human-readable profiles mirrored by the dependency-free path classifier.
profiles:
  documentation-only:
    - README.md
    - docs/**
    - .github/**/*.md
  api-backend:
    - apps/api/**
  frontend:
    - apps/web/**
  contracts-integrations:
    - contracts/**
  infrastructure-delivery:
    - infra/**
    - .github/workflows/**
    - '**/*.sh'
  privileged:
    - AGENTS.md
    - '**/AGENTS.md'
    - .agents/**
    - .github/autonomous-policy.yml
    - .github/workflows/**
    - .github/actions/**
    - package.json
    - package-lock.json
    - apps/api/package.json
    - apps/api/package-lock.json
    - scripts/**
    - infra/**
    - apps/api/src/shared/security/**
    - apps/api/src/shared/config/**
    - apps/api/src/application/authorization/**
    - apps/api/src/application/auditing/**
    - apps/api/src/application/idempotency/**

merge:
  method: squash
  nativeAutoMerge: true
  exactHeadSha: true
  requireUpToDate: true
  deleteHeadBranch: true
  allowedBranchPrefixes:
    - codex/
  blockedLabels:
    - do-not-merge
    - security-hold
  allowForks: false
  allowAdminBypass: false

repair:
  maxAttemptsPerStrategy: 2
  maxAttemptsPerRepairGeneration: 3
  externalRerunsPerFailure: 1

deployment:
  controllerWorkflow: delivery-v2.yml
  enableVariable: DELIVERY_V2_ENABLED
  productionConcurrencyGroup: production-deployment
  buildOnce: true
  requireExactArtifactDigest: true
  impactPaths:
    - apps/**
    - contracts/**
    - infra/**
    - package.json
    - package-lock.json
    - angular.json
    - tsconfig.json
    - scripts/**
    - .github/workflows/delivery-v2.yml
    - .github/workflows/deploy-environment.yml
  runtimeNeutralPaths:
    - '*.md'
    - docs/**
    - .github/**/*.md
    - .agents/skills/**/*.md
    - scripts/agent-learning/**
    - scripts/test/agent-learning-*.test.mjs

workflowSecurity:
  actionsPinnedToFullSha: true
  explicitPermissions: true
  forbidPullRequestTarget: true
  forbidSecretsInherit: true
  forbidDynamicSecrets: true
  forbidAlternateGitHubTokens: true
  forbidUntrustedCodeWithWriteCredentials: true
  forbidCheckRunWriters: true

authorization:
  permissions:
    - catalogue.read
    - reddit.read
    - wlh.read
    - weather.read
    - bring.read
    - bring.write
    - bring.complete
    - bring.remove
  destructivePermissions:
    - bring.complete
    - bring.remove
  serviceTokenDeniedPermissions:
    - bring.complete
    - bring.remove

retention:
  auditDays: 365
  idempotencyDays: 30
  confirmationTokenMinutes: 5
