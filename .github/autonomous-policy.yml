riskClasses:
  supplyChain:
    - package.json
    - package-lock.json
    - angular.json
    - tsconfig.json
    - eslint.config.js
    - .prettierignore
    - .prettierrc.json
    - apps/**
    - scripts/**
  workflow:
    - .github/workflows/**
    - .github/actions/**
    - scripts/autonomous-merge-controller.mjs
  infrastructure:
    - infra/**
  authentication:
    - apps/api/src/shared/security/**
    - apps/api/src/application/authorization/**
  destructiveIntegration:
    - apps/api/src/shared/bring/**
    - apps/api/src/functions/bring.ts
    - apps/api/src/mcp/**
    - contracts/**
  agentGovernance:
    - .github/autonomous-policy.yml
    - AGENTS.md
    - '**/AGENTS.md'
    - .agents/skills/**

autonomousReview:
  checkName: Autonomous review complete
  requiredForHighRisk: true
  model: gpt-5.6-sol
  reasoningEffort: medium
  maxDiffBytes: 200000
  maxOutputTokens: 3500
  maxEstimatedCostUsd: 0.31
  store: false
  humanApprovalRequired: false
  rejectSeverities:
    - critical
    - high

merge:
  method: squash
  exactHeadSha: true
  requireUpToDate: true
  deleteHeadBranch: true
  allowedBranchPrefixes:
    - codex/
    - codex-
  allowedLabels:
    - codex-automerge
  blockedLabels:
    - do-not-merge
    - security-hold
  allowForks: false
  allowAdminBypass: false
  waitSeconds: 3600
  pollSeconds: 15

deployment:
  controllerWorkflow: codex-main-delivery.yml
  productionConcurrencyGroup: production-deployment
  buildOnce: true
  requireExactArtifactDigest: true
  productionEnabledByDefault: false

authorization:
  permissions:
    - catalogue.read
    - reddit.read
    - wlh.read
    - bring.read
    - bring.write
    - bring.complete
    - bring.remove
  destructivePermissions:
    - bring.complete
    - bring.remove
  serviceTokenDeniedPermissions:
    - bring.complete
    - bring.remove

retention:
  auditDays: 365
  idempotencyDays: 30
  confirmationTokenMinutes: 5
