# This file is the canonical repository policy consumed by CI, the autonomous
# governance workflow, documentation generation, and agent-instruction validation.
# requiredChecks intentionally contains only stable protected-branch aggregates;
# each owning workflow keeps its complete internal validation graph mandatory.
requiredChecks:
  - name: CI complete
    appSlug: github-actions
  - name: Policy complete
    appSlug: github-actions
  - name: CodeQL complete
    appSlug: github-actions
  - name: Autonomous review complete
    appSlug: github-actions

agentLearning:
  # Only normal codex-repair issues created at or after this immutable rollout
  # boundary participate automatically. Earlier issues require exact-range backfill.
  rolloutTimestamp: '2026-08-09T20:24:47Z'

