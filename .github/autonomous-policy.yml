version: 1

# This file is the canonical repository policy consumed by CI, the autonomous
# review workflow, documentation generation, and agent-instruction validation.
trustedCheckApps:
  github-actions: 15368

trustedCheckSources:
  ci:
    kind: actions
    workflowId: 276132079
    workflowPath: .github/workflows/ci.yml
    event: pull_request
    runAttempt: 1
  policy:
    kind: actions
    workflowId: 276132076
    workflowPath: .github/workflows/policy-check.yml
    event: pull_request
    runAttempt: 1
  codeql:
    kind: actions
    workflowId: 324431746
    workflowPath: .github/workflows/codeql.yml
    event: pull_request
    runAttempt: 1
  autonomous-review:
    kind: controller

