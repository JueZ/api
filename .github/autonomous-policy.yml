    - scripts/check-repository-hygiene.mjs
    - scripts/verify-github-deployment-controls.mjs

autonomousReview:
  checkName: Autonomous review complete
  requiredForHighRisk: true
  model: gpt-5.6-sol
  reasoningEffort: high
  maxDiffBytes: 1500000
  store: false
  humanApprovalRequired: false
  rejectSeverities:
    - critical
    - high

merge:
  method: squash
  exactHeadSha: true
  requireUpToDate: true
  deleteHeadBranch: true
  allowedBranchPrefixes:
    - codex/
    - codex-
  allowedLabels:
    - codex-automerge
  blockedLabels:
    - do-not-merge
    - security-hold
  allowForks: false
  allowAdminBypass: false
  # These files define the trust boundary of autonomous delivery. Changes to
  # them require an independent security-control review and cannot be merged by
  # the autonomous controller, even when the model review approves.
  autonomousExcludedPaths:
    - .github/autonomous-policy.yml
    - .github/security-deployment-hold.json
    - .github/workflows/**
    - .github/actions/**
    - package.json
    - package-lock.json
    - .npmrc
    - npm-shrinkwrap.json
    - apps/api/.npmrc
    - apps/api/npm-shrinkwrap.json
    - scripts/autonomous-merge-controller.mjs
    - scripts/lib/autonomous-policy.mjs
    - scripts/lib/smoke-utils.mjs
    - scripts/render-branch-protection.mjs
    - scripts/assert-current-main.mjs
    - scripts/enforce-security-deployment-hold.mjs
    - scripts/assert-current-security-controller.mjs
    - scripts/verify-github-deployment-controls.mjs
    - scripts/build-release-artifacts.sh
    - scripts/verify-release-artifacts.mjs
    - scripts/frontend-inventory.mjs
    - scripts/validate-deployed-runtime-settings.mjs
    - scripts/mint-smoke-token.mjs
    - scripts/smoke-runtime.mjs
    - scripts/smoke-auth.mjs
    - scripts/check-telemetry.mjs
    - scripts/write-release-ledger.mjs
    - scripts/validate-release-ledger.mjs
    - ops/release-ledger/**
  waitSeconds: 3600
  pollSeconds: 15

deployment:
  controllerWorkflow: codex-main-delivery.yml
  productionConcurrencyGroup: production-deployment
  buildOnce: true
  requireExactArtifactDigest: true
  productionEnabledByDefault: false

authorization:
  permissions:
    - catalogue.read
    - reddit.read
    - wlh.read
    - bring.read
    - bring.write
    - bring.complete
    - bring.remove
  destructivePermissions:
    - bring.complete
    - bring.remove
  serviceTokenDeniedPermissions:
    - bring.complete
    - bring.remove

retention:
  auditDays: 365
  idempotencyDays: 30
  confirmationTokenMinutes: 5
