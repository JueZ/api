    - scripts/agent-task-evals/**

autonomousGovernance:
  checkName: Autonomous review complete
  evaluator: deterministic-protected-controller-v1
  humanApprovalRequired: false

merge:
  method: squash
  exactHeadSha: true
  requireUpToDate: true
  deleteHeadBranch: true
  allowedBranchPrefixes:
    - codex/
    - codex-
  allowedLabels:
    - codex-automerge
  blockedLabels:
    - do-not-merge
    - security-hold
  allowForks: false
  allowAdminBypass: false
  waitSeconds: 3600
  pollSeconds: 15

deployment:
  controllerWorkflow: codex-main-delivery.yml
  productionConcurrencyGroup: production-deployment
  buildOnce: true
  requireExactArtifactDigest: true
  productionEnabledByDefault: false
  # These paths can affect repository operation and therefore retain every PR
  # and exact-main validation, but they do not alter deployed application,
  # infrastructure, contract, or runtime configuration bytes.
  runtimeNeutralPaths:
    - '*.md'
    - docs/**
    - .github/**/*.md
    - .agents/skills/**/*.md
    - evals/agent-tasks/**
    - scripts/agent-learning/**
    - scripts/agent-task-evals/**
    - scripts/test/agent-learning-*.test.mjs

authorization:
  permissions:
    - catalogue.read
    - reddit.read
    - wlh.read
    - bring.read
    - bring.write
    - bring.complete
    - bring.remove
  destructivePermissions:
    - bring.complete
    - bring.remove
  serviceTokenDeniedPermissions:
    - bring.complete
    - bring.remove

retention:
  auditDays: 365
  idempotencyDays: 30
  confirmationTokenMinutes: 5
