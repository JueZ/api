openapi: 3.1.0
info:
  title: JueZ API Catalogue (GPT WLH)
  version: 0.1.0
servers:
  - url: https://func-api-catalogue-prod-bfjstshehpbfk.azurewebsites.net
security:
  - entraOAuth2:
      - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/api.access
paths:
  /health:
    get:
      operationId: health
      summary: Health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/hello:
    get:
      operationId: hello
      summary: Hello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelloResponse" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
  /api/wlh/categories/top:
    get:
      operationId: getWlhTopCategories
      summary: Get top categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WlhCategory" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
  /api/wlh/categories/{categoryId}:
    get:
      operationId: getWlhCategory
      summary: Get category by id
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WlhCategory" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/wlh/categories/{categoryId}/children:
    get:
      operationId: getWlhCategoryChildren
      summary: Get category children
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WlhCategory" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/wlh/search:
    post:
      operationId: searchWlh
      summary: Search listings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WlhSearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WlhSearchResponse" }
        "400":
          description: Invalid request payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "404":
          description: Category not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Upstream rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Upstream/content parsing failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/wlh/offers/{adId}:
    get:
      operationId: getWlhOffer
      summary: Get offer detail
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WlhOfferDetail" }
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "429":
          description: Upstream rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Upstream/content parsing failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/wlh/offers/{adId}/images:
    get:
      operationId: getWlhOfferImages
      summary: Get offer images
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  source: { type: string }
                  adId: { type: string }
                  images:
                    type: array
                    items: { $ref: "#/components/schemas/WlhImage" }
                required: [source, adId, images]
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Token valid but caller not allowlisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "429":
          description: Upstream rate limited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Upstream/content parsing failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    entraOAuth2:
      type: oauth2
      description: Microsoft Entra OAuth 2.0 authorization-code flow for the dedicated ChatGPT Action client.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/token
          scopes:
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/api.access: Access protected JueZ API endpoints.
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error: { type: string }
        message: { type: string }
    AuthErrorResponse:
      type: object
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status: { type: string }
        service: { type: string }
        timestamp: { type: string, format: date-time }
      required: [status, service, timestamp]
    HelloResponse:
      type: object
      additionalProperties: true
      properties:
        message: { type: string }
        authenticated: { type: boolean }
      required: [message, authenticated]
    WlhCategory:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        label: { type: string }
        path: { type: string }
        depth: { type: number }
        parentId: { type: string }
        hitCount: { type: number }
        hasChildren: { type: boolean }
        url: { type: string }
      required: [id, label, path, depth, hasChildren]
    WlhSearchRequest:
      type: object
      additionalProperties: false
      properties:
        categoryId: { type: string }
        keyword: { type: string }
        priceFrom: { type: number }
        priceTo: { type: number }
        areaId: { type: string }
        paylivery: { type: boolean }
        rows: { type: integer, minimum: 1, maximum: 100 }
        page: { type: integer, minimum: 1 }
        condition: { type: string, enum: [new, like_new, used, defect] }
        delivery: { type: array, items: { type: string, enum: [pickup, shipping] } }
        requiredTerms: { type: array, items: { type: string } }
      required: [categoryId]
    WlhImage:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        url: { type: string }
      required: [id, url]
    WlhSearchResult:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        priceAmount: { type: [number, "null"] }
        priceDisplay: { type: string }
        location: { type: string }
        postcode: { type: string }
        state: { type: string }
        publishedAt: { type: string }
        changedAt: { type: string }
        paylivery: { type: [boolean, "null"] }
        sellerId: { type: string }
        url: { type: string }
        imageCount: { type: number }
        thumbnailUrl: { type: string }
      required: [id, title, priceAmount, priceDisplay, location, url, imageCount]
    WlhSearchResponse:
      type: object
      additionalProperties: false
      properties:
        source: { type: string }
        fetchedAt: { type: string }
        sourceUrl: { type: string }
        rowsFound: { type: [number, "null"] }
        rowsReturned: { type: number }
        filteredRowsReturned: { type: number }
        category: { $ref: "#/components/schemas/WlhCategory" }
        results:
          type: array
          items: { $ref: "#/components/schemas/WlhSearchResult" }
      required: [source, fetchedAt, sourceUrl, rowsFound, rowsReturned, filteredRowsReturned, category, results]
    WlhOfferDetail:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        priceAmount: { type: [number, "null"] }
        priceDisplay: { type: string }
        location: { type: string }
        postcode: { type: string }
        state: { type: string }
        publishedAt: { type: string }
        changedAt: { type: string }
        status: { type: string }
        seller:
          type: object
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
          required: [id, name]
        paylivery: { type: [boolean, "null"] }
        deliveryOptions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              carrier: { type: string }
              parcelSize: { type: string }
              price: { type: [number, string, "null"] }
              originalPrice: { type: [number, string, "null"] }
              description: { type: string }
              deliveryDays: { type: [number, string, "null"] }
              parcelInsurance: { type: [number, string, "null"] }
        images:
          type: array
          items: { $ref: "#/components/schemas/WlhImage" }
      required: [id, title, description, priceAmount, priceDisplay, location, paylivery, images]
