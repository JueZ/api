      properties:
        action:
          type: string
          enum:
            - provide_missing_value
            - replace_invalid_value
            - remove_unknown_field
            - call_prerequisite_operation
            - retry_with_modified_request
            - retry_later
            - do_not_change_request
            - report_diagnostic_id
        path:
          type: string
          description: Top-level request field path. JSON Pointer (/post) and JSONPath-style ($.post) forms are accepted in
            diagnostic repair plans.
        value_hint:
          type: string
        operation_id:
          type: string
        reason:
          type: string
    JsonPatchOperation:
      type: object
      additionalProperties: true
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
          description: JSON Patch path. Must use JSON Pointer form such as /post, not JSONPath.
        from:
          type: string
          description: JSON Patch source path for move/copy. Must use JSON Pointer form such as /post, not JSONPath.
        value: {}
    RepairableProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - rec_version
        - operation_id
        - diagnostic_id
        - classification
        - repairable
        - confidence
        - retry_policy
        - caller_instruction
        - safe_debug_summary
        - analysis_mode
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Concrete diagnostic occurrence URI in the form urn:diagnostic:<diagnostic_id>.
          example: urn:diagnostic:diag_example_invalid_json
        rec_version:
          type: string
          enum:
            - "1.0"
        operation_id:
          type: string
        diagnostic_id:
          type: string
        trace_id:
          type: string
        classification:
          type: string
          enum:
            - caller_contract_violation
            - semantic_precondition_missing
            - resource_not_found
            - authorization_context_mismatch
            - version_skew
            - dependency_failure
            - capacity_or_timeout
            - service_bug_likely
            - internal_error
            - security_suspicious
            - diagnostic_uncertain
        repairable:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
        retry_policy:
          $ref: "#/components/schemas/RetryPolicy"
        invalid_fields:
          type: array
          items:
            $ref: "#/components/schemas/InvalidField"
        repair_patch:
          type: array
          items:
            $ref: "#/components/schemas/JsonPatchOperation"
        repair_plan:
          type: array
          items:
            $ref: "#/components/schemas/RepairPlanStep"
        correct_request_example: {}
        caller_instruction:
          type: string
        llm_instruction:
          type: string
          description: Optional alias for GPT Actions compatibility.
        safe_debug_summary:
          type: string
        analysis_mode:
          type: string
          enum:
            - deterministic
            - llm_assisted
            - hybrid
            - fallback
    RedditCoverage:
      type: object
      additionalProperties: false
      properties:
        reportedTotal:
          type: integer
        uniqueReturned:
          type: integer
        retrievedUnique:
          type: integer
        deleted:
          type: integer
        unavailable:
          type: integer
          description: Distinct known comment IDs that Reddit did not return from a requested expansion.
        unavailableBranches:
          type: integer
          description: Provider-reported size of inaccessible or empty continue-thread branches; diagnostic only and not
            subtracted from reportedGap because these are not concrete comment IDs.
        knownRemaining:
          type: integer
          description: Backward-compatible alias for reportedGap; Reddit does not guarantee this many comments are retrievable.
        reportedGap:
          type: integer
          description: Maximum of zero and provider-reported total minus unique retrieved comments and distinct unavailable
            comment IDs. This is an arithmetic signal against a moving, potentially stale Reddit counter, not a queue
            size or retrievability guarantee.
        cursorsRemaining:
          type: boolean
        continuationsRemaining:
          type: integer
          description: Number of pending deep continue-thread work items in the durable frontier.
        frontierRemaining:
          type: integer
          description: Total number of pending MoreChildren and continue-thread work items in the durable frontier.
        sortsSampled:
          type: array
          description: Distinct Reddit discovery views seeded so far. Terminal exhaustive traversal samples the requested sort,
            old, new, controversial, top, confidence, and qa, with duplicates removed.
          items:
            type: string
        traversalComplete:
          type: boolean
          description: True when the active Reddit sort frontier is empty; other planned sorts may remain, so this can be true
            while coverageStatus is in_progress.
        coverageComplete:
          type: boolean
          description: True only after all configured sorts are exhausted with no unexplained reported gap.
        coverageStatus:
          type: string
          enum:
            - in_progress
            - complete
            - exhausted_with_reported_gap
            - resource_limited
        snapshotComplete:
          type: boolean
          description: True when Reddit discovery into the durable snapshot is terminal (all planned views exhausted or a resource
            cap reached). Stored comments can still remain to be paged, so page.nextCursor can be non-null.
        complete:
          type: boolean
          description: Backward-compatible alias for coverageComplete.
        stoppedReason:
          type: string
          enum:
            - execution_budget
            - rate_limit
            - snapshot_resource_limit
            - upstream_retryable
        retryAfterSeconds:
          type: integer
      required:
        - reportedTotal
        - uniqueReturned
        - retrievedUnique
        - deleted
        - unavailable
        - unavailableBranches
        - knownRemaining
        - reportedGap
        - cursorsRemaining
        - continuationsRemaining
        - frontierRemaining
        - sortsSampled
        - traversalComplete
        - coverageComplete
        - coverageStatus
        - snapshotComplete
        - complete
