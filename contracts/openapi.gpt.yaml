openapi: 3.1.0
info:
  title: JueZ API Catalogue GPT Action
  version: 0.1.0
  description: Minimal GPT Actions contract for the JueZ API Catalogue. Health is public; Hello and Reddit thread actions require Microsoft Entra OAuth.
servers:
  - url: https://func-api-catalogue-prod-bfjstshehpbfk.azurewebsites.net
    description: Production API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Public health endpoint. No OAuth token is required.
      security: []
      responses:
        '200':
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/hello:
    get:
      operationId: getHello
      summary: Test authenticated access
      description: Protected endpoint used to confirm the GPT Action OAuth token can call the API.
      security:
        - entraOAuth2:
            - api.access
      responses:
        '200':
          description: Authenticated hello response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          description: Missing or invalid OAuth bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Valid token, but caller, tenant, client, scope, or role is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/reddit/thread:
    post:
      operationId: postRedditThread
      summary: Fetch a Reddit thread
      description: Protected endpoint that fetches a Reddit post and comments server-side. The GPT authenticates to this API, not to Reddit.
      security:
        - entraOAuth2:
            - api.access
      x-repairable-error:
        recVersion: "1.0"
        analyzer:
          supportedModes:
            - llm_assisted
            - fallback
          defaultMode: llm_assisted
          llm:
            enabledByEnv: REPAIRABLE_ERRORS_LLM_ENABLED
            input: sanitized_diagnostic_capsule
            output: RepairableProblem
            requiresSchemaValidation: true
            requiresPolicyGate: true
        aliases:
          url: post
          redditUrl: post
          reddit_url: post
          threadUrl: post
          thread_url: post
        retry:
          idempotencyRequired: false
        acceptedInputFormats:
          post:
            - raw Reddit article ID
            - raw Reddit comment ID, resolved to its parent post thread
            - t3 fullname
            - redd.it URL
            - reddit.com comments URL
            - old.reddit.com comments URL
            - Reddit /r/<subreddit>/s/<token> share URL
        security:
          diagnosticCapsulePolicy: sanitized-only
          publicDebugDetailsDefault: false
          exposeRawRequestBody: false
          exposeHeaders: false
          exposeTokens: false
          exposeStackTrace: false
          exposeRawUpstreamBody: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedditThreadRequest'
      responses:
        '200':
          description: Normalized Reddit thread snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedditThreadResponse'
        '400':
          description: Invalid request payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RepairableProblem'
              examples:
                invalidJson:
                  summary: Invalid JSON body
                  value:
                    type: https://api.juez.local/problems/reddit-thread/caller_contract_violation
                    title: Request contract violation
                    status: 400
                    detail: Request body must be valid JSON.
                    instance: urn:diagnostic:diag_example_invalid_json
                    rec_version: "1.0"
                    operation_id: postRedditThread
                    diagnostic_id: diag_example_invalid_json
                    classification: caller_contract_violation
                    repairable: true
                    confidence: 0.82
                    retry_policy: { can_retry: true, same_request: false }
                    caller_instruction: Send valid JSON with a post field containing a Reddit article ID, t3 fullname, redd.it URL, or canonical reddit.com /comments/<id> URL.
                    safe_debug_summary: Sanitized invalid JSON diagnosis.
                    analysis_mode: fallback
                aliasUrlInsteadOfPost:
                  summary: Alias URL supplied instead of post
                  value:
                    type: https://api.juez.local/problems/reddit-thread/caller_contract_violation
                    title: Request contract violation
                    status: 400
                    detail: The request used an alias field instead of post.
                    instance: urn:diagnostic:diag_example_alias
                    rec_version: "1.0"
                    operation_id: postRedditThread
                    diagnostic_id: diag_example_alias
                    classification: caller_contract_violation
                    repairable: true
                    confidence: 0.9
                    retry_policy: { can_retry: true, same_request: false }
                    repair_patch: [{ op: add, path: /post, value: https://www.reddit.com/r/example/comments/abc123/title/ }, { op: remove, path: /url }]
                    caller_instruction: Move the Reddit URL into post and retry.
                    safe_debug_summary: Sanitized alias-field contract diagnosis.
                    analysis_mode: llm_assisted
                unresolvedShareUrl:
                  summary: Unresolved Reddit share URL
                  value:
                    type: https://api.juez.local/problems/reddit-thread/caller_contract_violation
                    title: Request contract violation
                    status: 400
                    detail: Reddit /s/ share URLs must resolve to a canonical comments URL before this endpoint can fetch the thread.
                    instance: urn:diagnostic:diag_example_share
                    rec_version: "1.0"
                    operation_id: postRedditThread
                    diagnostic_id: diag_example_share
                    classification: caller_contract_violation
                    repairable: true
                    confidence: 0.82
                    retry_policy: { can_retry: true, same_request: false }
                    repair_plan: [{ action: replace_invalid_value, path: /post, value_hint: 'canonical /comments/<id> URL, redd.it URL, t3 fullname, raw article ID, or raw comment ID', reason: The /s/ share URL could not be resolved deterministically. }]
                    caller_instruction: Do not retry the same /s/ share URL. Use a canonical reddit.com /comments/<id> URL, redd.it URL, t3 fullname, or raw article/comment ID instead.
                    safe_debug_summary: Sanitized unresolved share URL diagnosis.
                    analysis_mode: fallback
        '401':
          description: Missing or invalid OAuth bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Valid token, but caller, tenant, client, scope, or role is not allowed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RepairableProblem'
        '404':
          description: Reddit content was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RepairableProblem'
              examples:
                redditNotFound:
                  summary: Reddit content not found
                  value:
                    type: https://api.juez.local/problems/reddit-thread/resource_not_found
                    title: Reddit content was not found
                    status: 404
                    detail: Reddit content was not found for thread.
                    instance: urn:diagnostic:diag_example_404
                    rec_version: "1.0"
                    operation_id: postRedditThread
                    diagnostic_id: diag_example_404
                    classification: resource_not_found
                    repairable: true
                    confidence: 0.68
                    retry_policy: { can_retry: true, same_request: false }
                    caller_instruction: Check that post references an existing public Reddit thread and retry with the corrected identifier or canonical URL.
                    safe_debug_summary: Sanitized Reddit 404 diagnosis.
                    analysis_mode: fallback
        '429':
          description: Reddit rate limit or upstream throttling.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RepairableProblem'
              examples:
                redditRateLimited:
                  summary: Reddit rate limited
                  value:
                    type: https://api.juez.local/problems/reddit-thread/capacity_or_timeout
                    title: Reddit rate limit reached
                    status: 429
                    detail: Reddit rate-limited the request.
                    instance: urn:diagnostic:diag_example_429
                    rec_version: "1.0"
                    operation_id: postRedditThread
                    diagnostic_id: diag_example_429
                    classification: capacity_or_timeout
                    repairable: false
                    confidence: 0.68
                    retry_policy: { can_retry: true, same_request: true, retry_after_ms: 30000 }
                    repair_plan: [{ action: retry_later, reason: The upstream service asked callers to slow down. }]
                    caller_instruction: Retry later with the same request. Do not change request parameters solely to bypass rate limiting.
                    safe_debug_summary: Sanitized Reddit rate-limit diagnosis.
                    analysis_mode: fallback
        '502':
          description: Reddit upstream request failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RepairableProblem'
              examples:
                upstreamDependencyFailure:
                  summary: Reddit upstream dependency failure
                  value:
                    type: https://api.juez.local/problems/reddit-thread/dependency_failure
                    title: Reddit dependency failure
                    status: 502
                    detail: Reddit upstream request failed.
                    instance: urn:diagnostic:diag_example_502
                    rec_version: "1.0"
                    operation_id: postRedditThread
                    diagnostic_id: diag_example_502
                    classification: dependency_failure
                    repairable: false
                    confidence: 0.68
                    retry_policy: { can_retry: true, same_request: true }
                    repair_plan: [{ action: retry_later, reason: The failure happened while contacting or processing the upstream Reddit dependency. }]
                    caller_instruction: Retry later with the same request. Do not invent alternative request parameters for this upstream failure.
                    safe_debug_summary: Sanitized Reddit dependency failure diagnosis.
                    analysis_mode: fallback
  /api/wlh/categories/top:
    get:
      operationId: getWlhCategoriesTop
      summary: List top wlh categories
      security:
        - entraOAuth2:
            - api.access
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WlhCategory" }
  /api/wlh/categories/{categoryId}:
    get:
      operationId: getWlhCategory
      summary: Get one wlh category
      security:
        - entraOAuth2:
            - api.access
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WlhCategory" } } } }
        "404": { description: Not found }
  /api/wlh/categories/{categoryId}/children:
    get:
      operationId: getWlhCategoryChildren
      summary: List child wlh categories
      security:
        - entraOAuth2:
            - api.access
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WlhCategory" } } } } }
  /api/wlh/search:
    post:
      operationId: postWlhSearch
      summary: Search wlh offers
      security:
        - entraOAuth2:
            - api.access
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WlhSearchRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WlhSearchResponse" } } } }
        "400": { description: Bad request }
        "404": { description: Not found }
        "429": { description: Rate limited }
        "502": { description: Upstream failure }
  /api/wlh/offers/{adId}:
    get:
      operationId: getWlhOffer
      summary: Get wlh offer detail
      security:
        - entraOAuth2:
            - api.access
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WlhOfferDetail" } } } }
  /api/wlh/offers/{adId}/images:
    get:
      operationId: getWlhOfferImages
      summary: Get wlh offer images
      security:
        - entraOAuth2:
            - api.access
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { source: {type: string}, adId: {type: string}, images: {type: array, items: {$ref: "#/components/schemas/WlhImage"}} } } } } }

components:
  securitySchemes:
    entraOAuth2:
      type: oauth2
      description: Microsoft Entra OAuth 2.0 authorization-code flow for the dedicated ChatGPT Action client.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/token
          scopes:
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/api.access: Access protected JueZ API endpoints.
  schemas:
    WlhCategory:
      type: object
      additionalProperties: false
      properties: { id: {type: string}, label: {type: string}, path: {type: string}, depth: {type: number}, parentId: {type: string}, hitCount: {type: number}, hasChildren: {type: boolean} }
      required: [id,label,path,depth,hasChildren]
    WlhSearchRequest:
      type: object
      additionalProperties: false
      properties:
        categoryId: { type: string }
        keyword: { type: string }
        priceFrom: { type: number }
        priceTo: { type: number }
        areaId: { type: string }
        paylivery: { type: boolean }
        rows: { type: integer, minimum: 1, maximum: 100 }
        page: { type: integer, minimum: 1 }
        condition: { type: string, enum: [new, like_new, used, defect] }
        delivery: { type: array, items: { type: string, enum: [pickup, shipping] } }
        requiredTerms: { type: array, items: { type: string } }
      required: [categoryId]
    WlhImage:
      type: object
      additionalProperties: false
      properties: { id: {type: string}, url: {type: string} }
      required: [id,url]
    WlhSearchResult:
      type: object
      additionalProperties: false
      properties: { id: {type: string}, title: {type: string}, priceAmount: {type: [number, "null"]}, priceDisplay: {type: string}, location: {type: string}, url: {type: string}, imageCount: {type: number}, thumbnailUrl: {type: string} }
      required: [id,title,priceAmount,priceDisplay,location,url,imageCount]
    WlhSearchResponse:
      type: object
      additionalProperties: false
      properties: { source: {type: string}, fetchedAt: {type: string}, sourceUrl: {type: string}, rowsFound: {type: [number, "null"]}, rowsReturned: {type: number}, filteredRowsReturned: {type: number}, category: { $ref: "#/components/schemas/WlhCategory" }, results: { type: array, items: { $ref: "#/components/schemas/WlhSearchResult" } } }
      required: [source,fetchedAt,sourceUrl,rowsFound,rowsReturned,filteredRowsReturned,category,results]
    WlhOfferDetail:
      type: object
      additionalProperties: true
      properties: { id: {type: string}, title: {type: string}, description: {type: string}, priceAmount: {type: [number, "null"]}, priceDisplay: {type: string}, location: {type: string}, postcode: {type: string}, state: {type: string}, paylivery: {type: [boolean, "null"]}, images: {type: array, items: {$ref: "#/components/schemas/WlhImage"}} }
      required: [id,title,description,priceAmount,priceDisplay,location,paylivery,images]
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        environmentName:
          type: string
          enum: [test, prod, local, unknown]
        deployedCommitSha:
          type: string
        deployedSourceRef:
          type: string
        deploymentRunId:
          type: string
        deployedAtUtc:
          type: string
        buildTimestampUtc:
          type: string
      required:
        - status
        - service
        - timestamp
        - environmentName
        - deployedCommitSha
        - deployedSourceRef
        - deploymentRunId
        - deployedAtUtc
        - buildTimestampUtc
    HelloResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        authenticated:
          type: boolean
        user:
          type: object
          additionalProperties: true
      required:
        - message
        - authenticated
    RedditThreadRequest:
      type: object
      additionalProperties: false
      properties:
        post:
          type: string
          description: Reddit post URL, Reddit comments URL, Reddit /s/ share URL, Reddit article ID, or Reddit comment ID.
        sort:
          type: string
          enum:
            - confidence
            - top
            - new
            - controversial
            - old
            - qa
          default: confidence
        maxComments:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
      required:
        - post
    RedditThreadResponse:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        input:
          type: string
        post:
          type: object
          additionalProperties: true
        comments:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
      required:
        - source
        - fetchedAt
        - input
        - post
        - comments
    RetryPolicy:
      type: object
      additionalProperties: false
      required: [can_retry, same_request]
      properties:
        can_retry: { type: boolean }
        same_request: { type: boolean }
        retry_after_ms: { type: integer, minimum: 0 }
        idempotency_required: { type: boolean }
    InvalidField:
      type: object
      additionalProperties: false
      required: [path, problem]
      properties:
        path:
          type: string
          description: Top-level request field path. JSON Pointer (/post) and JSONPath-style ($.post) forms are accepted in diagnostics.
        problem: { type: string }
        expected: { type: string }
        received: { type: string }
        suggestion: { type: string }
    RepairPlanStep:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [provide_missing_value, replace_invalid_value, remove_unknown_field, call_prerequisite_operation, retry_with_modified_request, retry_later, do_not_change_request, report_diagnostic_id]
        path:
          type: string
          description: Top-level request field path. JSON Pointer (/post) and JSONPath-style ($.post) forms are accepted in diagnostic repair plans.
        value_hint: { type: string }
        operation_id: { type: string }
        reason: { type: string }
    JsonPatchOperation:
      type: object
      additionalProperties: true
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace, move, copy, test]
        path:
          type: string
          description: JSON Patch path. Must use JSON Pointer form such as /post, not JSONPath.
        from:
          type: string
          description: JSON Patch source path for move/copy. Must use JSON Pointer form such as /post, not JSONPath.
        value: {}
    RepairableProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, rec_version, operation_id, diagnostic_id, classification, repairable, confidence, retry_policy, caller_instruction, safe_debug_summary, analysis_mode]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance:
          type: string
          description: Concrete diagnostic occurrence URI in the form urn:diagnostic:<diagnostic_id>.
          example: urn:diagnostic:diag_example_invalid_json
        rec_version: { type: string, enum: ["1.0"] }
        operation_id: { type: string }
        diagnostic_id: { type: string }
        trace_id: { type: string }
        classification:
          type: string
          enum: [caller_contract_violation, semantic_precondition_missing, resource_not_found, authorization_context_mismatch, version_skew, dependency_failure, capacity_or_timeout, service_bug_likely, security_suspicious, diagnostic_uncertain]
        repairable: { type: boolean }
        confidence: { type: number, minimum: 0, maximum: 1 }
        retry_policy:
          $ref: "#/components/schemas/RetryPolicy"
        invalid_fields:
          type: array
          items:
            $ref: "#/components/schemas/InvalidField"
        repair_patch:
          type: array
          items:
            $ref: "#/components/schemas/JsonPatchOperation"
        repair_plan:
          type: array
          items:
            $ref: "#/components/schemas/RepairPlanStep"
        correct_request_example: {}
        caller_instruction: { type: string }
        llm_instruction:
          type: string
          description: Optional alias for GPT Actions compatibility.
        safe_debug_summary: { type: string }
        analysis_mode:
          type: string
          enum: [deterministic, llm_assisted, hybrid, fallback]
    AuthErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    SimpleErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string
        input:
          type: string
      required:
        - error
