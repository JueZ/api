  /api/reddit/comment-tree:
    post:
      operationId: postRedditCommentTree
      summary: Fetch a bounded Reddit comment block
      description: Use after `/api/reddit/thread` when a large thread needs staged loading. Send either `commentId` for one
        subtree or `children` from a returned continuation handle.
      security:
        - entraOAuth2:
            - api.access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditCommentTreeRequest"
      responses:
        "200":
          description: Normalized bounded Reddit comment block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditCommentTreeResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/reddit/thread/overview:
    post:
      operationId: postRedditThreadOverview
      summary: Fetch Reddit thread overview metadata
      description: Cheap thread metadata and coverage summary used to choose a small/medium/large analysis strategy before
        fetching bodies.
      security: &a1
        - entraOAuth2:
            - api.access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditThreadOverviewRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditThreadOverviewResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/reddit/thread/comments:
    post:
      operationId: postRedditThreadComments
      summary: Page Reddit comment skeletons
      description: Returns lightweight, paginated comment skeletons with optional bodies, previews, mechanical filters, cursor
        pagination, maxBytes, and coverage metadata.
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditCommentQueryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditCommentQueryResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/reddit/comments/batch:
    post:
      operationId: postRedditCommentsBatch
      summary: Fetch selected Reddit comments by ID
      description: Fetches full selected comments by ID with field projection so GPT can hydrate only high-signal comments
        after inspecting skeleton pages.
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditCommentsBatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditCommentsBatchResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/bring/lists:
    get:
      operationId: bringListLists
      summary: List Bring! shopping lists
      description: Protected unofficial Bring! integration. Returns normalized list metadata only; credentials, tokens, account data, and cache locations are never exposed.
      tags: [Bring]
      security:
        - entraOAuth2: [api.access]
      responses:
        "200":
          description: Normalized shopping lists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BringListsResponse" }
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
  /api/bring/lists/{listUuid}/items:
    parameters:
      - $ref: "#/components/parameters/BringListUuid"
    get:
      operationId: bringGetItems
      summary: Get Bring! shopping-list items
      description: Protected unofficial operation returning normalized active and completed items.
      tags: [Bring]
      security:
        - entraOAuth2: [api.access]
      responses:
        "200":
          description: Normalized list items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BringList" }
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "404":
          description: Bring list not found.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
    post:
      operationId: bringAddItems
      summary: Add a batch of Bring! items
      description: Adds 1-50 items through an unofficial upstream API. The operation is not idempotent.
      tags: [Bring]
      security:
        - entraOAuth2: [api.access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BringBatchRequest" }
      responses:
        "200":
          description: Batch accepted by Bring!.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BringMutationResponse" }
        "400":
          description: Invalid batch or UUID.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
  /api/bring/lists/{listUuid}/items/complete:
    parameters:
      - $ref: "#/components/parameters/BringListUuid"
    post:
      operationId: bringCompleteItems
      summary: Complete a batch of Bring! items
      description: Marks 1-50 items complete through an unofficial, undocumented upstream API.
      tags: [Bring]
      security:
        - entraOAuth2: [api.access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BringBatchRequest" }
      responses:
        "200":
          description: Batch completion accepted by Bring!.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BringMutationResponse" }
        "400":
          description: Invalid batch or UUID.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResponse" }
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/RepairableProblem" }
components:
  securitySchemes:
    entraOAuth2:
      type: oauth2
      description: Microsoft Entra OAuth 2.0 authorization-code flow for the dedicated ChatGPT Action client.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/token
          scopes:
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/api.access: Access protected JueZ API endpoints.
  parameters:
    BringListUuid:
      name: listUuid
      in: path
      required: true
      description: Bring list UUID. HTTP routes require an explicit list; MCP/service callers may omit it to use the configured/account default.
      schema: { type: string, format: uuid }
  schemas:
    BringItemInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        specification: { type: string, maxLength: 500 }
        uuid: { type: string, format: uuid }
    BringBatchRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/BringItemInput" }
    BringListSummary:
      type: object
      additionalProperties: false
      required: [uuid, name, isDefault]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        theme: { type: string }
        isDefault: { type: boolean }
    BringListsResponse:
      type: object
      additionalProperties: false
      required: [source, lists]
      properties:
        source: { type: string, const: bring }
        lists:
          type: array
          items: { $ref: "#/components/schemas/BringListSummary" }
    BringItem:
      allOf:
        - $ref: "#/components/schemas/BringItemInput"
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [active, completed] }
    BringList:
      type: object
      additionalProperties: false
      required: [uuid, items]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/BringItem" }
    BringMutationResponse:
      type: object
      additionalProperties: false
      required: [source, listUuid, operation, itemCount, items]
      properties:
        source: { type: string, const: bring }
        listUuid: { type: string, format: uuid }
        operation: { type: string, enum: [add, complete] }
        itemCount: { type: integer, minimum: 1, maximum: 50 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/BringItemInput" }
    WlhCategory:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, description: Category identifier. }
        label: { type: string, description: Category display label. }
        path: { type: string, description: Category hierarchy path. }
        depth: { type: number, description: Category depth in tree. }
        parentId: { type: string, description: Parent category identifier. }
        hitCount: { type: number, description: Approximate listing count. }
        hasChildren: { type: boolean, description: True when child categories exist. }
        url: { type: string, description: Category route path resolved against WLH_BASE_URL. }
      required: [id, label, path, depth, hasChildren]
    WlhSearchRequest:
      type: object
      additionalProperties: false
      properties:
        categoryId: { type: string, description: Required category identifier for search. }
        keyword: { type: string, description: Optional free-text search query. }
        priceFrom: { type: number, description: Optional lower price bound. }
        priceTo: { type: number, description: Optional upper price bound. }
        areaId: { type: string, description: Optional area identifier. }
        paylivery: { type: boolean, description: Restrict to listings with paylivery support. }
        rows: { type: integer, minimum: 1, maximum: 100, description: Page size (default 30). }
        page: { type: integer, minimum: 1, description: Page number (default 1). }
        condition: { type: string, enum: [new, like_new, used, defect], description: Typed condition filter. }
        delivery:
          type: array
          items: { type: string, enum: [pickup, shipping] }
          description: Typed delivery filters.
        requiredTerms:
          type: array
          items: { type: string }
          description: Post-filter terms; all non-empty terms must match title/body.
      required: [categoryId]
    WlhImage:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, description: Listing identifier. }
        url: { type: string, description: Canonical listing URL resolved from runtime base URL. }
      required: [id, url]
    WlhSearchResult:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, description: Listing identifier. }
        title: { type: string, description: Listing title. }
        priceAmount: { type: [number, "null"], description: Parsed numeric price amount when available. }
        priceDisplay: { type: string, description: Human-readable price string. }
        location: { type: string, description: Location label for the listing/offer. }
        postcode: { type: string, description: Postal code when available. }
        state: { type: string, description: Region/state value when available. }
        publishedAt: { type: string, description: Published timestamp from upstream payload. }
        changedAt: { type: string, description: Last changed timestamp from upstream payload. }
        paylivery: { type: [boolean, "null"], description: True when paylivery options are detected. }
        sellerId: { type: string, description: Seller identifier when present. }
        url: { type: string, description: Canonical listing URL resolved from runtime base URL. }
        imageCount: { type: number, description: Number of known images for the listing. }
        thumbnailUrl: { type: string, description: Preferred thumbnail URL when available. }
      required: [id, title, priceAmount, priceDisplay, location, url, imageCount]
    WlhSearchResponse:
      type: object
      additionalProperties: false
      properties:
        source: { type: string, description: Source system marker (`wlh`). }
        fetchedAt: { type: string, description: UTC fetch timestamp. }
        sourceUrl: { type: string, description: Source URL used for upstream fetch. }
        rowsFound: { type: [number, "null"], description: Upstream reported total rows found. }
        rowsReturned: { type: number, description: Raw rows returned before requiredTerms filtering. }
        filteredRowsReturned: { type: number, description: Rows returned after requiredTerms filtering. }
        category: { $ref: "#/components/schemas/WlhCategory" }
        results:
          type: array
          items: { $ref: "#/components/schemas/WlhSearchResult" }
      required: [source, fetchedAt, sourceUrl, rowsFound, rowsReturned, filteredRowsReturned, category, results]
    WlhOfferDetail:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, description: Listing identifier. }
        title: { type: string, description: Listing title. }
        description: { type: string, description: HTML-cleaned offer description text. }
        priceAmount: { type: [number, "null"], description: Parsed numeric price amount when available. }
        priceDisplay: { type: string, description: Human-readable price string. }
        location: { type: string, description: Location label for the listing/offer. }
        postcode: { type: string, description: Postal code when available. }
        state: { type: string, description: Region/state value when available. }
        publishedAt: { type: string, description: Published timestamp from upstream payload. }
        changedAt: { type: string, description: Last changed timestamp from upstream payload. }
        status: { type: string, description: Offer status identifier. }
        seller:
          type: object
          additionalProperties: false
          properties:
            id: { type: string, description: Listing identifier. }
            name: { type: string }
          required: [id, name]
        paylivery: { type: [boolean, "null"], description: True when paylivery options are detected. }
        images:
          type: array
          items: { $ref: "#/components/schemas/WlhImage" }
        deliveryOptions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              carrier: { type: string, description: Delivery carrier display name. }
              parcelSize: { type: string, description: Parcel size label. }
              price: { description: Delivery price payload value. }
              originalPrice: { description: Original delivery price payload value. }
              description: { type: string, description: HTML-cleaned offer description text. }
              deliveryDays: { description: Delivery day range payload value. }
              insurance: { description: Delivery insurance payload value. }
      required: [id, title, description, priceAmount, priceDisplay, location, images]

    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: string
          description: Machine-readable error code for structured input errors, or a human-readable error summary for other non-auth application errors.
          examples:
            - UNRESOLVED_REDDIT_SHARE_URL
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        environmentName:
          type: string
          enum:
            - test
            - prod
            - local
            - unknown
        deployedCommitSha:
          type: string
        deployedSourceRef:
          type: string
        deploymentRunId:
          type: string
        deployedAtUtc:
          type: string
        buildTimestampUtc:
          type: string
      required:
        - status
        - service
        - timestamp
        - environmentName
        - deployedCommitSha
        - deployedSourceRef
        - deploymentRunId
        - deployedAtUtc
        - buildTimestampUtc
    HelloResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        authenticated:
          type: boolean
        user:
          type: object
          additionalProperties: true
      required:
        - message
        - authenticated
    RedditThreadRequest:
      type: object
      additionalProperties: false
      properties:
        post:
          type: string
          description: Reddit post URL, Reddit comments URL, Reddit /s/ share URL, Reddit article ID, or Reddit comment ID.
        sort:
          type: string
          enum:
            - confidence
            - top
            - new
            - controversial
            - old
            - qa
          default: confidence
        maxComments:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
          description: Maximum number of normalized comments to return. Large full-body responses can exceed GPT/tool response limits; for medium or large threads prefer the overview, paginated comments, batch hydration, and comment-tree endpoints.
        maxMoreChildrenRequests:
          type: integer
          minimum: 0
          maximum: 5000
          default: 1000
      required:
        - post
    RedditThreadResponse:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        input:
          type: string
        post:
          type: object
          additionalProperties: true
        comments:
          type: array
          items:
            type: object
            additionalProperties: true
        commentContinuations:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
      required:
        - source
        - fetchedAt
        - input
        - post
        - comments
    RedditCommentTreeRequest:
      type: object
      additionalProperties: false
      properties:
        post:
          type: string
        commentId:
          type: string
          description: Raw comment ID or t1 fullname. Exactly one of commentId or children is required.
        children:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Child IDs from a continuation handle. Exactly one of commentId or children is required.
        parentId:
          type: string
        sort:
          type: string
          enum:
            - confidence
            - top
            - new
            - controversial
            - old
            - qa
        depth:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        maxMoreChildrenRequests:
          type: integer
          minimum: 0
          maximum: 5000
          default: 0
      required:
        - post
    RedditCommentTreeResponse:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        input:
          type: string
        post:
          type: object
          additionalProperties: true
        mode:
          type: string
          enum:
            - comment
            - children
        comments:
          type: array
          items:
            type: object
            additionalProperties: true
        commentContinuations:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - source
        - fetchedAt
        - input
        - post
        - mode
        - comments
    RetryPolicy:
      type: object
      additionalProperties: false
      required:
        - can_retry
        - same_request
      properties:
        can_retry:
          type: boolean
        same_request:
          type: boolean
        retry_after_ms:
          type: integer
          minimum: 0
        idempotency_required:
          type: boolean
    InvalidField:
      type: object
      additionalProperties: false
      required:
        - path
        - problem
      properties:
        path:
          type: string
          description: Top-level request field path. JSON Pointer (/post) and JSONPath-style ($.post) forms are accepted in
            diagnostics.
        problem:
          type: string
        expected:
          type: string
        received:
          type: string
        suggestion:
          type: string
    RepairPlanStep:
      type: object
      additionalProperties: false
      required:
        - action
        - reason
      properties:
        action:
          type: string
          enum:
            - provide_missing_value
            - replace_invalid_value
            - remove_unknown_field
            - call_prerequisite_operation
            - retry_with_modified_request
            - retry_later
            - do_not_change_request
            - report_diagnostic_id
        path:
          type: string
          description: Top-level request field path. JSON Pointer (/post) and JSONPath-style ($.post) forms are accepted in
            diagnostic repair plans.
        value_hint:
          type: string
        operation_id:
          type: string
        reason:
          type: string
    JsonPatchOperation:
      type: object
      additionalProperties: true
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
        path:
          type: string
          description: JSON Patch path. Must use JSON Pointer form such as /post, not JSONPath.
        from:
          type: string
          description: JSON Patch source path for move/copy. Must use JSON Pointer form such as /post, not JSONPath.
        value: {}
    RepairableProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - rec_version
        - operation_id
        - diagnostic_id
        - classification
        - repairable
        - confidence
        - retry_policy
        - caller_instruction
        - safe_debug_summary
        - analysis_mode
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Concrete diagnostic occurrence URI in the form urn:diagnostic:<diagnostic_id>.
          example: urn:diagnostic:diag_example_invalid_json
        rec_version:
          type: string
          enum:
            - "1.0"
        operation_id:
          type: string
        diagnostic_id:
          type: string
        trace_id:
          type: string
        classification:
          type: string
          enum:
            - caller_contract_violation
            - semantic_precondition_missing
            - resource_not_found
            - authorization_context_mismatch
            - version_skew
            - dependency_failure
            - capacity_or_timeout
            - service_bug_likely
            - internal_error
            - security_suspicious
            - diagnostic_uncertain
        repairable:
          type: boolean
        confidence:
          type: number
          minimum: 0
          maximum: 1
        retry_policy:
          $ref: "#/components/schemas/RetryPolicy"
        invalid_fields:
          type: array
          items:
            $ref: "#/components/schemas/InvalidField"
        repair_patch:
          type: array
          items:
            $ref: "#/components/schemas/JsonPatchOperation"
        repair_plan:
          type: array
          items:
            $ref: "#/components/schemas/RepairPlanStep"
        correct_request_example: {}
        caller_instruction:
          type: string
        llm_instruction:
          type: string
          description: Optional alias for GPT Actions compatibility.
        safe_debug_summary:
          type: string
        analysis_mode:
