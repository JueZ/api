          properties:
            topLevelComments:
              type: integer
            maxDepth:
              type: integer
            deletedCount:
              type: integer
            loadedSnapshotCommentCount:
              type: integer
          required:
            - topLevelComments
            - maxDepth
            - deletedCount
            - loadedSnapshotCommentCount
        availableSorts:
          type: array
          items:
            type: string
        coverage:
          $ref: "#/components/schemas/RedditCoverage"
        redditRateLimit:
          type: object
          additionalProperties: true
      required:
        - source
        - fetchedAt
        - input
        - post
        - stats
        - availableSorts
        - coverage
        - redditRateLimit
    RedditCommentQueryRequest:
      type: object
      additionalProperties: false
      properties:
        post:
          type: string
          description: Reddit URL, article ID, t3 fullname, or comment URL.
        url:
          type: string
          description: Alias for post.
