        - unavailable
        - knownRemaining
        - cursorsRemaining
        - continuationsRemaining
        - sortsSampled
        - snapshotComplete
    RedditThreadOverviewRequest:
      type: object
      additionalProperties: false
      properties:
        post:
          type: string
          description: Reddit URL, article ID, t3 fullname, or comment URL.
        url:
          type: string
          description: Alias for post.
        redditUrl:
          type: string
          description: Alias for post.
        reddit_url:
          type: string
          description: Alias for post.
        threadUrl:
          type: string
          description: Alias for post.
        thread_url:
          type: string
          description: Alias for post.
        sort:
          type: string
          enum:
            - confidence
            - top
            - new
            - controversial
            - old
            - qa
          default: confidence
        maxComments:
          type: integer
          minimum: 1
          maximum: 10000
          default: 500
    RedditThreadOverviewResponse:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        input:
          type: string
        post:
          type: object
          additionalProperties: true
        stats:
