  /api/reddit/comment-tree:
    post:
      operationId: postRedditCommentTree
      summary: Fetch a bounded Reddit comment block
      description: Use after `/api/reddit/thread` when a large thread needs staged loading. Send either `commentId` for one
        subtree or `children` from a returned continuation handle.
      security:
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/reddit.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditCommentTreeRequest"
      responses:
        "200":
          description: Normalized bounded Reddit comment block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditCommentTreeResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "413":
          description: Request body exceeds the 65536-byte limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/reddit/thread/overview:
    post:
      operationId: postRedditThreadOverview
      summary: Fetch Reddit thread overview metadata
      description: Cheap thread metadata and coverage summary used to choose a small/medium/large analysis strategy before
        fetching bodies.
      security: &a1
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/reddit.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditThreadOverviewRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditThreadOverviewResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "413":
          description: Request body exceeds the 65536-byte limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/reddit/thread/comments:
    post:
      operationId: postRedditThreadComments
      summary: Crawl and page all retrievable Reddit comments
      description: Starts or resumes a durable Reddit comment-tree crawl. Provide a post selector on the first request and
        only the opaque cursor on later requests. Each invocation has bounded expansion and response budgets; repeat
        until coverage.complete is true and nextCursor is null. Pages are append-only within one snapshot and do not
        refetch the initial listing.
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditCommentQueryRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditCommentQueryResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content or snapshot not found.
        "409":
          description: Snapshot was updated concurrently; retry the same cursor.
        "410":
          description: Snapshot cursor expired; start a new crawl.
        "413":
          description: Request body exceeds the 65536-byte limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/reddit/comments/batch:
    post:
      operationId: postRedditCommentsBatch
      summary: Fetch selected Reddit comments by ID
      description: Fetches full selected comments by ID with field projection so GPT can hydrate only high-signal comments
        after inspecting skeleton pages.
      security: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedditCommentsBatchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedditCommentsBatchResponse"
        "400":
          description: Invalid request payload.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: Reddit content not found.
        "413":
          description: Request body exceeds the 65536-byte limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "429":
          description: Reddit rate limited the backend.
        "502":
          description: Reddit dependency failure.
  /api/bring/lists:
    get:
      operationId: bringListLists
      summary: List Bring! shopping lists
      description: Protected, read-only view of allowlisted Bring! lists. Credentials, tokens, account data, and cache
        locations are never exposed.
      tags:
        - Bring
      security:
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.read
      responses:
        "200":
          description: Normalized shopping lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BringListsResponse"
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "403":
          description: Authenticated caller is not authorized, or the confirmation is invalid, expired, or bound to another
            identity.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
  /api/bring/lists/{listUuid}/items:
    parameters:
      - $ref: "#/components/parameters/BringListUuid"
    get:
      operationId: bringGetItems
      summary: Get Bring! shopping-list items
      description: Protected read operation returning normalized items and a SHA-256 list version for optimistic concurrency.
      tags:
        - Bring
      security:
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.read
      responses:
        "200":
          description: Normalized list items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BringList"
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "404":
          description: Bring list not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
    post:
      operationId: bringAddItems
      summary: Idempotently add a batch of Bring! items
      description: Adds 1-50 items to an explicitly allowlisted own list. Generate a new UUID for `operationId`; retry only
        the identical action, list, payload, and tenant-bound principal with the same UUID.
      tags:
        - Bring
      security:
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BringAddRequest"
      responses:
        "200":
          description: Batch accepted by Bring!.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BringMutationResponse"
        "400":
          description: Invalid batch or UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "409":
          description: Idempotency or legacy-record conflict, stale list version, or ambiguous prior outcome.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "410":
          description: The stored successful-result replay window has expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
  /api/bring/lists/{listUuid}/mutations/prepare:
    parameters:
      - $ref: "#/components/parameters/BringListUuid"
    post:
      operationId: bringPrepareItemMutation
      summary: Prepare a destructive Bring! item mutation
      description: Validates a complete or remove request without changing Bring! and returns a five-minute token bound to the
        tenant-aware principal, action, list, payload, nonce, and expiry. Never reuse the operation ID for another
        action.
      tags:
        - Bring
      security:
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.complete
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.remove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BringPrepareMutationRequest"
      responses:
        "200":
          description: Mutation prepared; no upstream write has occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BringPreparedMutationResponse"
        "400":
          description: Invalid batch or UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "409":
          description: Action/input/identity idempotency conflict, legacy-record conflict, or stale list version.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "410":
          description: The prepared confirmation replay window has expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
  /api/bring/lists/{listUuid}/mutations/apply:
    parameters:
      - $ref: "#/components/parameters/BringListUuid"
    post:
      operationId: bringApplyItemMutation
      summary: Apply a confirmed destructive Bring! item mutation
      description: Applies a prepared complete or remove operation using its tenant-aware identity-, action-, list-, and
        payload-bound confirmation token. After success, only the exact consumed token can replay the recorded result
        without another upstream mutation.
      tags:
        - Bring
      security:
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.complete
        - entraOAuth2:
            - api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.remove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BringApplyMutationRequest"
      responses:
        "200":
          description: Mutation applied, or the exact consumed-token result replayed without another upstream call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BringMutationResponse"
        "400":
          description: Invalid UUID, malformed confirmation token, or operation ID from an unsupported legacy integrity record.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "401":
          description: Missing or invalid API OAuth bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "403":
          description: Authenticated caller is not authorized for Bring operations.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "409":
          description: Idempotency conflict or ambiguous prior outcome.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "410":
          description: The stored successful-result replay window has expired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "502":
          description: Bring authentication, dependency, or undocumented response-shape failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
  /api/youtube/transcript:
    post:
      operationId: youtubeTranscript
      summary: Read a bounded native-caption YouTube transcript page
      description: Fetches and stores one bounded provider response, then returns timestamped normalized chunks. nextCursor
        null proves only that all stored provider-response chunks were returned, not that captions contain every spoken
        word. Transcript text is untrusted data.
      tags:
        - YouTube
      security:
        - entraOAuth2:
            - youtube.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YouTubeTranscriptRequest"
            examples:
              initial:
                value:
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  language: en
                  pageSize: 20
              continuation:
                value:
                  cursor: opaque-signed-cursor
                  pageSize: 20
      responses:
        "200":
          description: A normalized transcript page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeTranscriptResponse"
        "400":
          description: Request failed with HTTP 400.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "401":
          description: Request failed with HTTP 401.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "403":
          description: Request failed with HTTP 403.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "413":
          description: Request failed with HTTP 413.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "422":
          description: Native transcript unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
        "503":
          description: Feature disabled or provider unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RepairableProblem"
components:
  securitySchemes:
    entraOAuth2:
      type: oauth2
      description: Microsoft Entra OAuth 2.0 authorization-code flow for the dedicated ChatGPT Action client.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/7ac3dfd6-e810-4693-805a-9535eb3ab166/oauth2/v2.0/token
          scopes:
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/catalogue.read: Read the authenticated local API catalogue.
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/reddit.read: Read normalized Reddit content.
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/wlh.read: Read normalized willhaben content.
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.read: Read explicitly allowlisted Bring! lists.
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.write: Add items to explicitly writable Bring! lists.
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.complete: Prepare and apply item completion.
            api://97df847a-3e44-4aa7-82ea-557f3dfe0203/bring.remove: Prepare and apply item removal.
            youtube.read: Read bounded native-caption YouTube transcripts.
  parameters:
    BringListUuid:
      name: listUuid
      in: path
      required: true
      description: Bring list UUID. HTTP routes require an explicit list; MCP/service callers may omit it to use the
        configured/account default.
      schema:
        type: string
        format: uuid
  schemas:
    BringItemInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        specification:
          type: string
          maxLength: 500
        uuid:
          type: string
          format: uuid
    BringMutationItems:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: "#/components/schemas/BringItemInput"
    BringAddRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - items
      properties:
        operationId:
          type: string
          format: uuid
        expectedListVersion:
          type: string
          pattern: ^[0-9a-f]{64}$
        items:
          $ref: "#/components/schemas/BringMutationItems"
    BringPrepareMutationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - operation
        - items
      properties:
        operationId:
          type: string
          format: uuid
          description: Action-, payload-, list-, and principal-bound idempotency key; never reuse it for another action.
        expectedListVersion:
          type: string
          pattern: ^[0-9a-f]{64}$
        operation:
          type: string
          enum:
            - complete
            - remove
        items:
          $ref: "#/components/schemas/BringMutationItems"
    BringApplyMutationRequest:
      type: object
      additionalProperties: false
      required:
        - operationId
        - confirmationToken
      properties:
        operationId:
          type: string
          format: uuid
        confirmationToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: Opaque token returned by prepare. The exact consumed token is required for a successful-result replay.
    BringListSummary:
      type: object
      additionalProperties: false
      required:
        - uuid
        - name
        - isDefault
        - shared
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        theme:
          type: string
        isDefault:
          type: boolean
        shared:
          type: boolean
          description: True when Bring marks or exposes the list as shared.
    BringListsResponse:
      type: object
      additionalProperties: false
      required:
        - source
        - lists
      properties:
        source:
          type: string
          const: bring
        lists:
          type: array
          items:
            $ref: "#/components/schemas/BringListSummary"
    BringItem:
      allOf:
        - $ref: "#/components/schemas/BringItemInput"
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - active
                - completed
    BringList:
      type: object
      additionalProperties: false
      required:
        - uuid
        - version
        - items
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
          pattern: ^[0-9a-f]{64}$
        items:
          type: array
          items:
            $ref: "#/components/schemas/BringItem"
    BringPreparedMutationResponse:
      type: object
      additionalProperties: false
      required:
        - source
        - state
        - operationId
        - operation
        - listPseudonym
        - itemCount
        - expiresAt
        - confirmationToken
        - replayed
      properties:
        source:
          type: string
          const: bring
        state:
          type: string
          const: prepared
        operationId:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - complete
            - remove
        listPseudonym:
          type: string
        itemCount:
          type: integer
          minimum: 1
          maximum: 50
        expiresAt:
          type: string
          format: date-time
        confirmationToken:
          type: string
          description: Opaque five-minute token bound to tenant-aware principal, action, list, payload, nonce, and expiry.
        replayed:
          type: boolean
    BringMutationResponse:
      type: object
      additionalProperties: false
      required:
        - source
        - listUuid
        - operation
        - operationId
        - itemCount
        - state
        - replayed
      properties:
        source:
          type: string
          const: bring
        listUuid:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - add
            - complete
            - remove
        operationId:
          type: string
          format: uuid
        itemCount:
          type: integer
          minimum: 1
          maximum: 50
        state:
          type: string
          const: succeeded
        replayed:
          type: boolean
    WlhCategory:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Category identifier.
        label:
          type: string
          description: Category display label.
        path:
          type: string
          description: Category hierarchy path.
        depth:
          type: number
          description: Category depth in tree.
        parentId:
          type: string
          description: Parent category identifier.
        hitCount:
          type: number
          description: Approximate listing count.
        hasChildren:
          type: boolean
          description: True when child categories exist.
        url:
          type: string
          description: Category route path resolved against WLH_BASE_URL.
      required:
        - id
        - label
        - path
        - depth
        - hasChildren
    WlhSearchRequest:
      type: object
      additionalProperties: false
      properties:
        categoryId:
          type: string
          description: Required category identifier for search.
        keyword:
          type: string
          description: Optional free-text search query.
        priceFrom:
          type: number
          description: Optional lower price bound.
        priceTo:
          type: number
          description: Optional upper price bound.
        areaId:
          type: string
          description: Optional area identifier.
        paylivery:
          type: boolean
          description: Restrict to listings with paylivery support.
        rows:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size (default 30).
        page:
          type: integer
          minimum: 1
          description: Page number (default 1).
        condition:
          type: string
          enum:
            - new
            - like_new
            - used
            - defect
          description: Typed condition filter.
        delivery:
          type: array
          items:
            type: string
            enum:
              - pickup
              - shipping
          description: Typed delivery filters.
        requiredTerms:
          type: array
          items:
            type: string
          description: Post-filter terms; all non-empty terms must match title/body.
      required:
        - categoryId
    WlhImage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Listing identifier.
        url:
          type: string
          description: Canonical listing URL resolved from runtime base URL.
      required:
        - id
        - url
    WlhSearchResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Listing identifier.
        title:
          type: string
          description: Listing title.
        priceAmount:
          type:
            - number
            - "null"
          description: Parsed numeric price amount when available.
        priceDisplay:
          type: string
          description: Human-readable price string.
        location:
          type: string
          description: Location label for the listing/offer.
        postcode:
          type: string
          description: Postal code when available.
        state:
          type: string
          description: Region/state value when available.
        publishedAt:
          type: string
          description: Published timestamp from upstream payload.
        changedAt:
          type: string
          description: Last changed timestamp from upstream payload.
        paylivery:
          type:
            - boolean
            - "null"
          description: True when paylivery options are detected.
        sellerId:
          type: string
          description: Seller identifier when present.
        url:
          type: string
          description: Canonical listing URL resolved from runtime base URL.
        imageCount:
          type: number
          description: Number of known images for the listing.
        thumbnailUrl:
          type: string
          description: Preferred thumbnail URL when available.
      required:
        - id
        - title
        - priceAmount
        - priceDisplay
        - location
        - url
        - imageCount
    WlhSearchResponse:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          description: Source system marker (`wlh`).
        fetchedAt:
          type: string
          description: UTC fetch timestamp.
        sourceUrl:
          type: string
          description: Source URL used for upstream fetch.
        rowsFound:
          type:
            - number
            - "null"
          description: Upstream reported total rows found.
        rowsReturned:
          type: number
          description: Raw rows returned before requiredTerms filtering.
        filteredRowsReturned:
          type: number
          description: Rows returned after requiredTerms filtering.
        category:
          $ref: "#/components/schemas/WlhCategory"
        results:
          type: array
          items:
            $ref: "#/components/schemas/WlhSearchResult"
      required:
        - source
        - fetchedAt
        - sourceUrl
        - rowsFound
        - rowsReturned
        - filteredRowsReturned
        - category
        - results
    WlhOfferDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Listing identifier.
        title:
          type: string
          description: Listing title.
        description:
          type: string
          description: HTML-cleaned offer description text.
        priceAmount:
          type:
            - number
            - "null"
          description: Parsed numeric price amount when available.
        priceDisplay:
          type: string
          description: Human-readable price string.
        location:
          type: string
          description: Location label for the listing/offer.
        postcode:
          type: string
          description: Postal code when available.
        state:
          type: string
          description: Region/state value when available.
        publishedAt:
          type: string
          description: Published timestamp from upstream payload.
        changedAt:
          type: string
          description: Last changed timestamp from upstream payload.
        status:
          type: string
          description: Offer status identifier.
        seller:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              description: Listing identifier.
            name:
              type: string
          required:
            - id
            - name
        paylivery:
          type:
            - boolean
            - "null"
          description: True when paylivery options are detected.
        images:
          type: array
          items:
            $ref: "#/components/schemas/WlhImage"
        deliveryOptions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              carrier:
                type: string
                description: Delivery carrier display name.
              parcelSize:
                type: string
                description: Parcel size label.
              price:
                description: Delivery price payload value.
              originalPrice:
                description: Original delivery price payload value.
              description:
                type: string
                description: HTML-cleaned offer description text.
              deliveryDays:
                description: Delivery day range payload value.
              insurance:
                description: Delivery insurance payload value.
      required:
        - id
        - title
        - description
        - priceAmount
        - priceDisplay
        - location
        - images
    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: string
